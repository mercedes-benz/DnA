{{- if ne .Values.env "test" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: alloy
  namespace: {{ .Values.namespace }}
  labels:
    name: service
    project: c-svc
spec:
  destination:
    namespace: observability
    server: {{ .Values.server | squote }}
  source:
    path: deployment/kubernetes/DyP/observability/alloy
    repoURL: {{ .Values.repoURL | squote }}
    targetRevision: {{ .Values.branch }}
    plugin:
      name: argocd-vault-plugin-helm
      env:
        - name: HELM_ARGS
          value: -f values-{{ .Values.env }}.yaml -n observability
  project: c-svc
{{- if .Values.enableSync }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - PruneLast=true
      - Replace=true
{{- end }}

{{- end -}}