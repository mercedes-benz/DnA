# fullnameOverride and nameOverride distinguishes blank strings, null values,
# and non-blank strings. For more details, see the configuration reference.
fullnameOverride: "cs"
nameOverride:

# enabled is ignored by the jupyterhub chart itself, but a chart depending on
# the jupyterhub chart conditionally can make use this config option as the
# condition.
enabled:

# custom can contain anything you want to pass to the hub pod, as all passed
# Helm template values will be made available there.
custom: {}

# imagePullSecret is configuration to create a k8s Secret that Helm chart's pods
# can get credentials from to pull their images.
imagePullSecret:
  create: false
  automaticReferenceInjection: true
  registry:
  username:
  password:
  email:
# imagePullSecrets is configuration to reference the k8s Secret resources the
# Helm chart's pods can get credentials from to pull their images.
imagePullSecrets: 
  - name: imagepullsecret

# hub relates to the hub pod, responsible for running JupyterHub, its configured
# Authenticator class KubeSpawner, and its configured Proxy class
# ConfigurableHTTPProxy. KubeSpawner creates the user pods, and
# ConfigurableHTTPProxy speaks with the actual ConfigurableHTTPProxy server in
# the proxy pod.
hub:
  revisionHistoryLimit:
  config:
    Authenticator:
      admin_users:
        - palansa
        - ghosdeb
        - vimhask
      auto_login: true
      allowed_users:
        - ramyrao
    JupyterHub:
      admin_access: true
      authenticator_class: generic-oauth
      redirect_to_server: false
      default_url: https://dev.dna.app.corpintra.net/#/codespaces
      cookie_secret: <path:kv/data/dna/kubernetesSecret/jupyterhub-codeserver#cookie_secret>
    CryptKeeper:
      keys: <path:kv/data/dna/kubernetesSecret/jupyterhub-codeserver#CryptKeeper>      
    GenericOAuthenticator:
      client_id: <path:kv/data/dna/kubernetesSecret/jupyterhub-codeserver#client_id>
      client_secret: <path:kv/data/dna/kubernetesSecret/jupyterhub-codeserver#client_secret>
      oauth_callback_url: https://code-spaces.dna-aws.app.corpintra.net/hub/oauth_callback
      authorize_url: https://sso-int.mercedes-benz.com/as/authorization.oauth2
      token_url: https://sso-int.mercedes-benz.com/as/token.oauth2  
      userdata_url: https://sso-int.mercedes-benz.com/idp/userinfo.openid
      login_service: 'Mercedes-Benz SSO'
      username_claim: 'sub'
      allow_existing_users: true
      scope: 
        - openid
        - email    
        - group_type
  service:
    type: ClusterIP
    annotations: {}
    ports:
      nodePort:
    extraPorts: []
    loadBalancerIP:
  baseUrl: /
  cookieSecret:
  initContainers: []
  nodeSelector: {}
  tolerations: []
  concurrentSpawnLimit: 64
  consecutiveFailureLimit: 5
  activeServerLimit:
  deploymentStrategy:
    ## type: Recreate
    ## - sqlite-pvc backed hubs require the Recreate deployment strategy as a
    ##   typical PVC storage can only be bound to one pod at the time.
    ## - JupyterHub isn't designed to support being run in parallell. More work
    ##   needs to be done in JupyterHub itself for a fully highly available (HA)
    ##   deployment of JupyterHub on k8s is to be possible.
    type: Recreate
  db:
    type: postgres
    upgrade: true
    pvc:
      annotations: {}
      selector: {}
      accessModes:
        - ReadWriteOnce
      storage: 1Gi
      subPath:
      storageClassName: dhc-gp3
    url: postgresql+psycopg2://cs-hub-db:64000/jupyterhub
    password: <path:kv/data/dna/kubernetesSecret/csdb#dbadm.password>
  labels: {}
  annotations: {}
  command: []
  args: []
  extraConfig: 
    code_spawner.py: |
      from kubespawner.spawner import KubeSpawner
      from jupyterhub.spawner import _quote_safe

      class CodeSpaceKubeSpawner(KubeSpawner):
          def get_args(self):
              """Custom args function for the coder"""

              # Turn off authentication (happens via jupyterhub)
              args = ["--auth", "none"]
              # Turn off telemetry
              args += ["--disable-telemetry"]
              # Set App Name
              args += ["--app-name", "DnACodeSpace"]

              # set port and ip if given
              ip = "0.0.0.0"
              if self.ip:
                  ip = _quote_safe(self.ip)

              port = 8888
              if self.port:
                  port = self.port
              elif self.server and self.server.port:
                  self.log.warning(
                      "Setting port from user.server is deprecated as of JupyterHub 0.7."
                  )
                  port = self.server.port

              args += ["--bind-addr", f"{ip}:{port}"]

              # set startup folder
              if self.notebook_dir:
                  notebook_dir = self.format_string(self.notebook_dir)
                  args += ["--user-data-dir", _quote_safe(notebook_dir)]

              # if self.debug:
              #     args += ["-vvv"]

              args.extend(self.args)
              return args

          def get_env(self):
              env = super().get_env()
              user_options_env = self.user_options.get("env", {})
              env.update(user_options_env)
              return env        
      # Use the configured spawner
      c.JupyterHub.spawner_class = CodeSpaceKubeSpawner

    code_settings.py: |
      # The working dir is by default set to
      # /home/coder in the VSCode image
      c.CodeSpaceKubeSpawner.working_dir = "/home/coder"
      # By default, the cmd includes the call to "jupyterhub-singleserver"
      # However, the docker image already comes with the correct
      # VSCode command to call, so we just set it to an empty string here
      c.CodeSpaceKubeSpawner.cmd = ""    
          
      # Dynamically Get the set_resource capacity from the user options or set default values
      def set_resource(spawner):
          # user_storage_capacity = spawner.storage_capacity
          # user_pvc_name = spawner.pvc_name

          spawner.storage_capacity = spawner.user_options.get("storage_capacity", "1Gi")       
          spawner.mem_guarantee = spawner.user_options.get("mem_guarantee", "256M")       
          spawner.mem_limit = spawner.user_options.get("mem_limit", "4G")       
          spawner.cpu_limit = spawner.user_options.get("cpu_limit", 3)       
          spawner.cpu_guarantee = spawner.user_options.get("cpu_guarantee", 0.2) 
          spawner.extra_containers = spawner.user_options.get("extra_containers",[])
          # expand_pvc_command = f'kubectl patch pvc {user_pvc_name} -p \'{{"spec":{{"resources":{{"requests":{{"storage":"{user_storage_capacity}"}}}}}}}}\''
          # os.system(expand_pvc_command)           

      c.CodeSpaceKubeSpawner.pre_spawn_hook = set_resource     

      c.CodeSpaceKubeSpawner.extra_container_config = {
            'livenessProbe': {
              'httpGet': {
                'path': '/healthz',
                'port': 'notebook-port',
                'scheme': 'HTTP'
              },
              'initialDelaySeconds': 30,
              'periodSeconds': 60,
              'timeoutSeconds': 5,
              'successThreshold': 1,
              'failureThreshold': 10
            }
          }        

  #   livenessProbe:
  #     httpGet:
  #       path: /healthz
  #       port: http
  #       scheme: HTTP    
  #     initialDelaySeconds: 90
  #     periodSeconds: 10
  #     failureThreshold: 5
  #     successThreshold: 1
  #     timeoutSeconds: 3
