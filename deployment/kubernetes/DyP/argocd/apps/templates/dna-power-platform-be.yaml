apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: {{ .Values.env }}-power-platform-be
  namespace: {{ .Values.namespace }}
  labels:
    name: backend 
    env: {{ .Values.env }}
    project: {{ .Values.env }}-dna 
spec:
  destination:
    namespace: {{ .Values.env }}-dna-power-platform
    server: {{ .Values.server | squote }}
  source:
    path: deployment/kubernetes/helm/charts/power-platform-be
    repoURL: {{ .Values.repoURL | squote }}
    targetRevision: {{ .Values.branch }}
    helm:
      releaseName: power-platform-be
      valueFiles:
        - values-{{ .Values.env }}.yaml 
  project: {{ .Values.env }}-dna
{{- if .Values.enableSync }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
{{- end }}