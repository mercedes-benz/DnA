swagger: "2.0"
info:
 version: "1.0.0"
 title: "core uilicious Service"
host: "localhost:7171"
basePath: "/api/1.0"
consumes:
 - "application/json"
produces:
 - "application/json"
tags:
 - name: "uilicious"
   description: "This service is used to onboard uilicious users."

schemes:
- "https"


# path to create and manage uilicious workspace
#
# supprorted http methods GET, POST 
#
# path example ../uilicious

# Uilicious module - simplified workspace listing (refactored from Fabric schema)
paths:
  /uilicious-workspaces:
    get:
      tags:
        - "uilicious-workspaces"
      summary: "Get list of workspaces for Uilicious"
      description: |
        Returns Uilicious workspaces for the current user (or for the provided email).
        Each workspace includes metadata such as spaceName, link, lean governance and userRole.
      operationId: "getUiliciousWorkspaces"
      parameters:   
        - name: offset
          in: query
          description: "Page number from which listing of workspaces should start. Example: 2"
          required: false
          type: integer
        - name: limit
          in: query
          description: "Page size to limit the number of workspaces. Example: 15"
          required: false
          type: integer
        - name: sortOrder
          in: query
          description: "Sort order (asc or desc)."
          required: false
          type: string
          enum: [asc,desc]
      responses:
        200:
          description: "Successful fetch of Uilicious workspace records."
          schema:
            $ref: "#/definitions/UiliciousWorkspacesCollectionVO"
        204:
          description: "Fetch complete, no content found."
        400:
          description: "Bad request."
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed."
        500:
          description: "Internal server error."

    put:
      tags:
        - "uilicious-workspaces"
      summary: "Update lean governance for Uilicious workspace"
      description: "Updates the lean governance information for an existing Uilicious workspace identified by accountId."
      operationId: "updateUiliciousWorkspace"
      parameters:
        - name: "UiliciousWorkspaceUpdateRequestVO"
          in: "body"
          description: "Request Body that contains accountId and lean governance data to be updated"
          required: true
          schema:
            $ref: "#/definitions/UiliciousWorkspaceUpdateRequestVO"          
      responses:
        200:
          description: "Lean governance updated successfully"
          schema:
            $ref: "#/definitions/UiliciousWorkspaceUpdateResponseVO"
        204:
          description: "No content to update."
        400:
          description: "Bad request - Invalid accountId or lean governance data."
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        404:
          description: "Workspace not found for the provided accountId."
        405:
          description: "Method not allowed."
        500:
          description: "Internal server error."  

    post:
      tags:
        - "uilicious-workspaces"
      summary: "Create Uilicious Workspace"
      description: "Creates a new Uilicious workspace with the provided lean governance information."
      operationId: "createUiliciousWorkspace"
      parameters:
        - name: "CreateUiliciousWorkspaceRequestVO"
          in: "body"
          description: "Request Body that contains lean governance data for the new workspace"
          required: true
          schema:
            $ref: "#/definitions/CreateUiliciousWorkspaceRequestVO"          
      responses:
        200:
          description: "Uilicious workspace created successfully"
          schema:
            $ref: "#/definitions/GenericMessage"
        400:
          description: "Bad request - Invalid lean governance data."  
        401:
          description: "Request does not have sufficient credentials."
        403:  
          description: "Request is not authorized."
        405:  
          description: "Method not allowed."  
        500:  
          description: "Internal server error."
 
 
definitions:

  # Collection wrapper returned by the GET endpoint
  UiliciousWorkspacesCollectionVO:
    type: object
    properties:
      totalRecords:
        type: integer
        description: "Total number of workspace records available for the current query."
      leanGovernance:
        type: object
        items:
          $ref: "#/definitions/leanGovernanceVO"
      accountId:
        type: string
        description: "Uilicious Account ID."
      items:
        type: array
        items:
          $ref: "#/definitions/UiliciousWorkspaceVO"
      
  
  leanGovernanceVO:
    type: object
    properties:
      costCenter:
        type: string
        description: "Cost Center associated with the workspace."
      internalOrder:
        type: string
        description: "Internal order number."
      divisionId:
        type: string
        description: "Division ID"
      division:
        type: string
        description: "Division name."
      subDivisionId:
        type: string
        description: "Subdivision ID."
      subDivision:
        type: string
        description: "Subdivision name."
      department:
        type: string
        description: "Department name."
      dataClassification:
        type: string
        description: "Data classification for the workspace (e.g. Confidential, Internal, Public)."
      hasPii:
        type: boolean
        description: "Whether the workspace contains PII (true/false)."
      

  # Simplified workspace object for Uilicious consumers
  UiliciousWorkspaceVO:
    type: object
    properties:
      spaceId:
        type: string
        description: "Space id (unique workspace identifier in the platform)."
      spaceName:
        type: string
        description: "Direct link/URL to the workspace/space."
      userRole:
        type: string
        description: "Role of the user in this workspace (e.g. admin, editor, viewer)."

  # Request body for updating lean governance
  UiliciousWorkspaceUpdateRequestVO:
    type: object
    required:
      - accountId
      - leanGovernance
    properties:
      accountId:
        type: string
        description: "Uilicious Account ID to identify which workspace to update."
      leanGovernance:
        $ref: "#/definitions/leanGovernanceVO"

  # Response body for update operation
  UiliciousWorkspaceUpdateResponseVO:
    type: object
    properties:
      accountId:
        type: string
        description: "Uilicious Account ID of the updated workspace."
      leanGovernance:
        $ref: "#/definitions/leanGovernanceVO"
      message:
        type: string
        description: "Success message."
      
  CreateUiliciousWorkspaceRequestVO:
    type: object
    properties:
      leanGovernance:
        $ref: "#/definitions/leanGovernanceVO"
    required:
      - leanGovernance

