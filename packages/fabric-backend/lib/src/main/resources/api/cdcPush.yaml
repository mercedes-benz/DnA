swagger: "2.0"
info:
  version: "1.0.0"
  title: "Fabric workspaces management service"
host: "localhost:9292"
basePath: "/api/1.0"
consumes:
  - "application/json"
produces:
  - "application/json"
tags:
  - name: "solutions"
    description: "This service is used for lakehouse tables push to cdc maintenance."

schemes:
  - "https"

paths:
  # path to create a new solution and fetch all valid solution or by intent
  #
  #  supprorted http methods GET, POST and DELETE
  #
  # path example ../cdc-push
  /cdc-push/tables:
    get:
      tags:
        - "cdc-push"
      summary: "Get tables for a given lakehouse"
      description: "Get all tables for a given Fabric lakehouse under a workspace."
      operationId: "getLakehouseTables"
      parameters:
        - name: "workspaceId"
          in: "query"
          required: true
          type: "string"
        - name: "lakehouseId"
          in: "query"
          required: true
          type: "string"
      responses:
        200:
          description: "List of tables in the lakehouse"
          schema:
            $ref: "#/definitions/LakehouseTableCollectionVO"
        204:
          description: "Fetch complete, but no tables found."
        400:
          description: "Bad request."
        401:
          description: "Request does not have valid credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed."
        500:
          description: "Internal server error."

  /cdc-push/tables/schema:
    get:
      tags:
        - "cdc-push"
      summary: "Get table schema"
      description: "Get column schema for a table inside a Fabric lakehouse."
      operationId: "getTableSchema"
      parameters:
        - name: "workspaceId"
          in: "query"
          required: true
          type: "string"
        - name: "lakehouseId"
          in: "query"
          required: true
          type: "string"
        - name: "tableName"
          in: "query"
          required: true
          type: "string"
        - name: "schemaName"
          in: "query"
          required: false
          type: "string"
      responses:
        200:
          description: "Successfully fetched table schema."
          schema:
            $ref: "#/definitions/TableSchemaResponseVO"
        204:
          description: "Fetch complete, but no schema found."
        400:
          description: "Bad request."
        401:
          description: "Request does not have valid credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed."
        500:
          description: "Internal server error."

definitions:
  LakehouseTableResponseVO:
    description: "Response object for fabric lakehouse operations"
    type: object
    properties:
      data:
        $ref: "#/definitions/LakehouseTableCollectionVO"
      responses:
        $ref: "#/definitions/GenericMessage"

  LakehouseTableCollectionVO:
    description: "Collection of fabric lakehouse shortcuts."
    type: object
    properties:
      records:
        type: array
        items:
          $ref: "#/definitions/LakehouseTableVO"

  LakehouseTableVO:
    type: object
    properties:
      name:
        type: string
      schema:
        type: string

  TableSchemaResponseVO:
    description: "Schema response for a table"
    type: object
    properties:
      data:
        $ref: "#/definitions/TableSchemaDataVO"
      responses:
        $ref: "#/definitions/GenericMessage"

  TableSchemaDataVO:
    type: object
    properties:
      columns:
        type: array
        items:
          $ref: "#/definitions/TableColumnVO"

  TableColumnVO:
    type: object
    properties:
      columnName:
        type: string
      colType:
        type: string
      colConstraint:
        type: string