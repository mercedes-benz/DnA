swagger: "2.0"
info:
  version: "1.0.0"
  title: "Fabric Lakehouse catalog management service"
host: "localhost:9292"
basePath: "/api/1.0"
consumes:
  - "application/json"
produces:
  - "application/json"
tags:
  - name: "solutions"
    description: "This service is used for fabric Lakehouse catalog maintenance."

schemes:
  - "https"

paths:
  /catalog/{workspaceId}/publish:
    post:
      tags:
        - "fabric-catalog-management"
      summary: "Publish a new catalog."
      description: "This endpoint will be used to publish a new fabric catalog."
      operationId: "publishCatalogRequest"
      parameters:
        - name: publishCatalogRequest
          in: body
          description: "The catalog to publish."
          required: true
          schema:
            $ref: "#/definitions/PublishCatalogRequestVO"
        - name: workspaceId
          in: path
          description: "The ID of the workspace."
          required: true
          type: "string"
      responses:
        201:
          description: "Returns message of success or failure "
          schema:
            $ref: "#/definitions/PublishCatalogResponseVO"
        400:
          description: "Bad Request"
          schema:
            $ref: "#/definitions/GenericMessage"
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"

    put:
      tags:
        - "fabric-catalog-management"
      summary: "update Published catalog."
      description: "This endpoint will be used to update published fabric catalog."
      operationId: "updatePublishedCatalogRequest"
      parameters:
        - name: updateCatalogRequest
          in: body
          description: "The catalog to publish."
          required: true
          schema:
            $ref: "#/definitions/PublishCatalogRequestVO"
        - name: workspaceId
          in: path
          description: "The ID of the workspace."
          required: true
          type: "string"
      responses:
        201:
          description: "Returns message of success or failure "
          schema:
            $ref: "#/definitions/PublishCatalogResponseVO"
        400:
          description: "Bad Request"
          schema:
            $ref: "#/definitions/GenericMessage"
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"



  /catalog/{workspaceId}/{serviceName}:
    get:
      tags:
        - "fabric-catalog-management"
      summary: "Get catalog by service name."
      description: "This endpoint will be used to retrieve a fabric catalog by its service name."
      operationId: "getCatalogByServiceName"
      parameters:
        - name: "workspaceId"
          in: "path"
          description: "The ID of the workspace."
          required: true
          type: "string"
        - name: "serviceName"
          in: "path"
          description: "The name of the service."
          required: true
          type: "string"
      responses:
        200:
          description: "Returns message of success or failure"
          schema:
            $ref: "#/definitions/PublishCatalogResponseVO"
        204:
          description: "Fetch complete, no content found."
        400:
          description: "Bad request."
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"
  /catalog/ddx/group-update/{ddxId}/{workspaceId}/{lakehouseId}:
    post:
      tags:
        - "fabric-catalog-management"
      summary: "update groups from ddx."
      description: "This endpoint will be used to update groups from ddx."
      operationId: "updateGroupsFromDDX"
      parameters:
        - name:   updateDDXGroupsRequest
          in: body
          description: "The groups update request from DDX."
          required: true
          schema:
            $ref: "#/definitions/updateDDXGroupsRequestVO"
        - name: ddxId
          in: path
          description: "The ID of DDX data product."
          required: true
          type: "string"
        - name: "workspaceId"
          in: path
          description: "The ID of the workspace."
          required: true
          type: "string"
        - name: lakehouseId
          in: path
          description: "The ID of Lakehouse."
          required: true
          type: "string"
      responses:
        201:
          description: "Returns message of success or failure "
          schema:
            $ref: "#/definitions/GenericMessage"
        400:
          description: "Bad Request"
          schema:
            $ref: "#/definitions/GenericMessage"
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"

  /catalog/{workspaceId}/check-mismatch:
    get:
      tags:
        - "fabric-catalog-management"
      summary: "Check table mismatch between Fabric and CDC."
      description: "Compares current Fabric lakehouse tables with published CDC metadata to detect mismatches."
      operationId: "checkTableMismatch"
      parameters:
        - name: "workspaceId"
          in: "path"
          description: "The ID of the workspace."
          required: true
          type: "string"
        - name: "lakehouseId"
          in: "query"
          description: "The ID of the lakehouse."
          required: true
          type: "string"
      responses:
        200:
          description: "Returns mismatch detection results"
          schema:
            $ref: "#/definitions/TableMismatchResponseVO"
        400:
          description: "Bad Request"
          schema:
            $ref: "#/definitions/GenericMessage"
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        404:
          description: "Catalog metadata not found."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"

  /catalog/ddx/fabric-lakehouses/objects:
    get:
      tags:
        - "fabric-catalog-management"
      summary: "get lakehouse objects."
      description: "This endpoint will be used to get lakehouse objects."
      operationId: "getLakehouseObjects"
      parameters:
        - name: workspaceId
          in: query
          description: "The ID of the workspace."
          required: true
          type: string
        - name: lakehouseId
          in: query
          description: "The ID of Lakehouse."
          required: true
          type: string
        - name: schemaName
          in: query
          description: "The name of schema."
          required: false
          type: string
      responses:
        201:
          description: "Returns message of success or failure "
          schema:
            $ref: "#/definitions/LakehouseObjectsResponseVO"
        400:
          description: "Bad Request"
          schema:
            $ref: "#/definitions/GenericMessage"
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"
  
  /catalog/ddx/get-groups-status/{ddxId}/{workspaceId}/{lakehouseId}:
    get:
      tags:
        - "fabric-catalog-management"
      summary: "get the groups status which are requested to add to the lakehouse."
      description: "This endpoint will return the status of groups requested to be added to a lakehouse."
      operationId: "getGroupsAssignmentStatus"
      parameters:
        - name: updateDDXGroupsRequest
          in: body
          description: "The groups name to get the status for."
          required: true
          schema:
            $ref: "#/definitions/updateDDXGroupsRequestVO"
        - name: ddxId
          in: path
          description: "The ID of DDX data product."
          required: true
          type: "string"
        - name: workspaceId
          in: path
          description: "The ID of the workspace."
          required: true
          type: "string"
        - name: lakehouseId
          in: path
          description: "The ID of Lakehouse."
          required: true
          type: "string"
      responses:
        200:
          description: "Returns list of group name and their status"
          schema:
            type: array
            items:
              $ref: "#/definitions/GroupStatusResponseVO"
        400:
          description: "Bad Request"
          schema:
            $ref: "#/definitions/GenericMessage"
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        404:
          description: "Workspace, Lakehouse, or Group not found"
          schema:
            $ref: "#/definitions/GenericMessage"
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"

definitions:

  PublishCatalogRequestVO:
    type: object
    required:
      - metadata
      - workspaceId
      - mandatoryFields
      - owners
    properties:
      metadata:
        $ref: "#/definitions/FabricCatalogMetadataVO"
        required: true
      mandatoryFields:
        $ref: "#/definitions/MandatoryFieldsVO"
        required: true
      owners:
        type: array
        items:
          $ref: "#/definitions/CreatedByVO"
      sourceConfig:
        type: object
        properties:
          config:
            type: object
            properties:
              type:
                type: string

  FabricCatalogMetadataVO:
    type: object
    required:
      - serviceName
    properties:
      serviceName:
        type: string
        description: "Name of the service"
      serviceId:
        type: string
        description: "OpenMetadata service ID (optional)"
      databases:
        type: array
        description: "List of databases with metadata"
        items:
          $ref: "#/definitions/DatabaseMetadataVO"

  DatabaseMetadataVO:
    type: object
    required:
      - dbId
      - dbName
      - description
    properties:
      dbName:
        type: string
      dbId:
        type: string
      description:
        type: string
      schemas:
        type: array
        items:
          $ref: "#/definitions/SchemaMetadataVO"

  SchemaMetadataVO:
    type: object
    required:
      - schemaName
    properties:
      schemaName:
        type: string
      schemaId:
        type: string
      tables:
        type: array
        items:
          $ref: "#/definitions/TableMetadataVO"

  TableMetadataVO:
    type: object
    required:
      - tableName
    properties:
      tableName:
        type: string
      tableId:
        type: string
      enabled:
        type: boolean
        description: "Indicates if the table is enabled (true) or disabled (false)"
        default: true
      columns:
        type: array
        items:
          $ref: "#/definitions/ColumnMetadataVO"

  ColumnMetadataVO:
    type: object
    required:
      - columnName
      - colType
    properties:
      columnId:
        type: string
      columnName:
        type: string
      colType:
        type: string
      colConstraint:
        type: string
      enabled:
        type: boolean
        description: "Indicates if the column is enabled (true) or disabled (false)"
        default: true

  PublishCatalogResponseVO:
    type: object
    properties:
      data:
        $ref: "#/definitions/FabricCatalogMetadataDetailsVO"
      responses:
        $ref: "#/definitions/GenericMessage"

  MandatoryFieldsVO:
    type: object
    required:
      - divisions
      - department
      # - dataOrigin
      - leanIXId
      - isDocumentationUpdated
      # - isDataLakeAvailability
      # - isDataAsset
      - dataConfidentiality
      - tier
    properties:
      divisions:
        type: array
        items:
          type: string
          enum: ["Daimler Buses","Daimler Trucks","Mercedes-Benz Cars","Mercedes-Benz Mobility","Mercedes-Benz Vans"]
      department:
        type: string
        minLength: 1
      # dataOrigin:
      #   type: string
      #   enum: ["internal","external","mixed"]
      leanIXId:
        type: string
        minLength: 1
      isDocumentationUpdated:
        type: string
        enum: ["Yes","No"]
      # isDataLakeAvailability:
      #   type: string
      #   enum: ["Yes","No"]
#      isDataAsset:
#        type: string
#        enum: ["Yes","No"]
      dataConfidentiality:
        type: string
        enum: [public,confidential,secret,internal]
      tier:
        type: integer
        enum: [1,2]

  FabricCatalogMetadataDetailsVO:
    type: object
    properties:
      id:
        type: string
      metadata:
        $ref: "#/definitions/FabricCatalogMetadataVO"
      owners:
        type: array
        items:
          $ref: "#/definitions/CreatedByVO"
      mandatoryFields:
        $ref: "#/definitions/MandatoryFieldsVO"
      publishedLakehouseTables:
        type: array
        description: "List of table names available in the lakehouse"
        items:
          type: string
      publishedLakehouseTableDetails:
        type: array
        description: "Detailed information about lakehouse tables including enabled status"
        items:
          $ref: "#/definitions/LakehouseTableDetailVO"

  LakehouseTableDetailVO:
    type: object
    description: "Detailed information about a lakehouse table"
    properties:
      tableName:
        type: string
        description: "Name of the table"
      enabled:
        type: boolean
        description: "Whether the table is enabled (true) or disabled (false)"
        default: false
      columns:
        type: array
        description: "List of columns in the table"
        items:
          $ref: "#/definitions/LakehouseColumnDetailVO"

  LakehouseColumnDetailVO:
    type: object
    description: "Detailed information about a column in a lakehouse table"
    properties:
      columnName:
        type: string
        description: "Name of the column"
      enabled:
        type: boolean
        description: "Whether the column is enabled (true) or disabled (false)"
        default: false

  updateDDXGroupsRequestVO:
    type: object
    required:
      - groups
    properties:
      groups:
        type: array
        items:
          type: string
      type:
        type: string
        enum:
          - FABRIC_TO_FABRIC
        description: "Type identifier for DDX group update"

  LakehouseObjectsResponseVO:
    type: object
    properties:
      tables:
        type: array
        items:
          $ref: "#/definitions/LakehouseTableObjectVO"
      responseCode:
        type: string
        description: "Response code from the service"
      errorMessage:
        type: string
        description: "Error message if any error occurred"

  LakehouseTableObjectVO:
    type: object
    properties:
      name:
        type: string
      formatType:
        type: string
      type:
        type: string
      comments:
        type: string  
      columns:
        type: array
        items:
          $ref: "#/definitions/LakehouseColumnObjectVO"
  
  LakehouseColumnObjectVO:
    type: object
    properties:
      columnName:
        type: string
      dataType:
        type: string
      comment:
        type: string
      columnMaskingRule:
        type: string

  TableMismatchResponseVO:
    type: object
    properties:
      hasMismatch:
        type: boolean
        description: "Whether any mismatch was detected"
      mismatches:
        type: array
        items:
          $ref: "#/definitions/TableMismatchDetailVO"
      responses:
        $ref: "#/definitions/GenericMessage"

  TableMismatchDetailVO:
    type: object
    properties:
      tableName:
        type: string
        description: "Name of the table"
      mismatchType:
        type: string
        description: "Type of mismatch detected"
        enum:
          - NEW_TABLE
          - DELETED_TABLE
          - COLUMNS_ADDED
          - COLUMNS_REMOVED
          - COLUMN_TYPE_CHANGED
      details:
        type: string
        description: "Details about the mismatch"
      affectedColumns:
        type: array
        items:
          type: string
        description: "List of affected column names"

  GroupStatusResponseVO:
    type: object
    properties:
      groupName:
        type: string
      status:
        type: string
      message:
        type: string
        description: "Error message if the group addition failed"

  LegalEntitiesResponseVO:
    type: object
    properties:
      legalName:
        type: string
      companyCode:
        type: string