{{- if ne .Values.env "test" }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: c-svc
  namespace: {{ .Values.namespace }}
spec:
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  destinations:
    - name: in-cluster
      namespace: '*'
      server: {{ .Values.server }}
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  sourceRepos:
    - {{ .Values.repoURL }}
{{- end -}}