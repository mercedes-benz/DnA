{{- if eq .Values.env "prod" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: paperless-ngx
  namespace: {{ .Values.namespace }}
  labels:
    name: service
spec:
  destination:
    namespace: cs-apps-services
    server: {{ .Values.server | squote }}
  source:
    path: deployment/kubernetes/DyP/paperless-ngx
    repoURL: {{ .Values.repoURL | squote }}
    targetRevision: {{ .Values.branch }}
    plugin:
      name: argocd-vault-plugin-helm
      env:
        - name: HELM_ARGS
          value: --namespace cs-apps-services -f values-{{ .Values.env }}.yaml
  project: {{ .Values.env }}-dna
{{- if .Values.enableSync }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
{{- end }}
{{- end }}      