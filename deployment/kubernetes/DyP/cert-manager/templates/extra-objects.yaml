apiVersion: v1
data:
  Corp-Issuing-CA01-G2.pem: {{ .Values.extraObjects.cert }}
kind: Secret
metadata:
  name: acme-ca
  namespace: {{ include "cert-manager.namespace" . }}
type: Opaque
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: mercedes-benz-acme
  namespace: {{ include "cert-manager.namespace" . }}
spec:
  acme:
    server: https://acme.app.corpintra.net/acme/ws/Acme.svc/InternalWebserverACME/directory
    email: dna@mercedes-benz.com
    privateKeySecretRef:
      name: mercedes-benz-acme
    solvers:
    - http01:
        ingress:
          ingressClassName: ingress-traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-acme-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: dna@mercedes-benz.com
    privateKeySecretRef:
      name: letsencrypt-acme-staging
    solvers:
    - http01:
        ingress:
          class: traefik-internet
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-acme-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: dna@mercedes-benz.com
    privateKeySecretRef:
      name: letsencrypt-acme-prod
    solvers:
    - http01:
        ingress:
          class: traefik-internet        
