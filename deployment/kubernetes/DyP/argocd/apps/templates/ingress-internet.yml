apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: ingress-internet
  namespace: {{ .Values.namespace }}
  labels:
    name: dyp
spec:
  destination:
    namespace: ingress-internet
    server: {{ .Values.server | squote }}
  source:
    path: deployment/kubernetes/DyP/ingress
    repoURL: {{ .Values.repoURL | squote }}
    targetRevision: {{ .Values.branch }}
    helm:
      releaseName: ingress-internet
      skipCrds: false
      valueFiles:
        - values-internet.yaml    
  project: dna
{{- if .Values.enableSync }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
{{- end }}