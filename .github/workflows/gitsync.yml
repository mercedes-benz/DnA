name: Git Sync
on:
  workflow_dispatch:
    inputs:
      publicBranch:
        description: 'Public Branch name'
        required: true  
      privateBranch:
        description: 'Private Branch name'
        default: dev
        required: true         
        type: choice
        options: 
          - dev
          - staging
          - main         
  workflow_call:
    inputs:
      isSync:
        required: true
        type: string
        default: 'yes'
    secrets:
      PID_PAT:
        required: true  
env:
  PUBLIC_SRC_REPO: https://github.com/mercedes-benz/DnA.git
  DEST_REPO: git.i.mercedes-benz.com/DNA/DnA-Private.git
  # DEST_STAGING_BRANCH: staging-gitsync

jobs:
  gitsync:
    name: "Git Sync"
    if: ${{ inputs.isSync == 'yes' || ( github.event_name == 'workflow_dispatch' && inputs.isSync == '' ) }}
    runs-on: [ road-runner, self-hosted ]
    steps:

      - name: Check Source Branch
        run: |
          if [[ "${{ github.event.inputs.publicBranch }}" == *"feature"* ]]; then
            echo "Public Branch name: ${{ github.event.inputs.publicBranch }}"
          else
            echo "Public Branch name does not valid"
            echo "Given Branch name: ${{ github.event.inputs.publicBranch }}"
            exit 1
          fi

      # - uses: actions/checkout@v3

      # - name: Clone changes from public repo branch to private branch
      #   working-directory: ./utils/gitsync/
      #   run: |
      #     chmod +x ./gitsync
      #     ./gitsync
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.PID_PAT }}
      #     PUBLIC_SRC_BRANCH:  ${{ github.event.inputs.publicBranch }}
      #     DEST_BRANCH: ${{ github.event.inputs.privateBranch }}
      #     DEST_STAGING_BRANCH: ${{ github.event.inputs.privateBranch }}
      

      - name: Sync code with Public repo
        uses: wei/git-sync@v3
        with:
          source_repo: "$PUBLIC_SRC_REPO"
          source_branch: "${{ github.event.inputs.publicBranch }}"
          destination_repo: "https://${{ secrets.PID_PAT }}@$DEST_REPO"
          destination_branch: "${{ github.event.inputs.publicBranch }}"

      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: '${{ github.event.inputs.publicBranch }}'          

      # - name: Create Pull Request
      #   id: cpr
      #   uses: peter-evans/create-pull-request@v6.1.0
      #   with:
      #     token: ${{ secrets.PID_PAT }}
      #     base: ${{ github.event.inputs.privateBranch }}
      #     branch: ${{ github.event.inputs.publicBranch }}

      - name: Run the Action
        id: cpr
        uses: devops-infra/action-pull-request@v0.5.5
        with:
          github_token: ${{ secrets.PID_PAT }}
          source_branch: ${{ github.event.inputs.publicBranch }}
          target_branch: ${{ github.event.inputs.privateBranch }}
          title: ${{ github.event.commits[0].message }}
          reviewer: palansa
          assignee: palansa
          label: automatic,feature
          get_diff: true
          old_string: "**Write you description here**"
          new_string: ${{ github.event.commits[0].message }}          

      - name: Pull Request URL
        if: ${{ steps.cpr.outputs.pr_number }}
        run: |
          echo "Pull Request Number - ${{ steps.cpr.outputs.pr_number }}"
          echo "Pull Request URL - ${{ steps.cpr.outputs.url }}"
            
      - uses: peter-evans/enable-pull-request-automerge@v3
        if: ${{ steps.cpr.outputs.pr_number }}
        with:
          token: ${{ secrets.PID_PAT }}
          pull-request-number: ${{ steps.cpr.outputs.url }}
              

  success:
  #To avoid skipping other dependent job, just running cmd to make job success.
    name: "Make job success"
    needs: gitsync
    if: always() && needs.gitsync.result == 'skipped'
    runs-on: [ road-runner, self-hosted ]
    steps:

      - name: Success
        run: |
          echo "Success"  
