buildscript {
    ext {
        springBootVersion = "3.3.13"
        releaseVersion = "1.0.0"
    }
    repositories {
		maven {
            url System.getenv('ARTIFACTORY_URL')
            credentials {
                username System.getenv('ARTIFACTORY_USER')
                password System.getenv('ARTIFACTORY_PASSWORD')
            }
		}
    }
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
		classpath("gradle.plugin.org.hidetake:gradle-swagger-generator-plugin:2.18.2")
		classpath("org.apache.maven.plugins:maven-dependency-plugin:3.1.2")
    }

}


plugins {
    // the plugins DSL is replacing apply plugin over time for Java-plugins. It is therefore favoured over the legacy "apply plugin:" approach
    id "java"
    id "eclipse"
}

apply plugin: "io.spring.dependency-management"
apply plugin: "org.springframework.boot"
apply plugin: "maven-publish"
apply plugin: "org.hidetake.swagger.generator"

repositories {
		maven {
            url System.getenv('ARTIFACTORY_URL')
            credentials {
                username System.getenv('ARTIFACTORY_USER')
                password System.getenv('ARTIFACTORY_PASSWORD')
            }
		}
}

group 'com.mb.dna'
version = releaseVersion;

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }


//__________________________________________________________//
//_____________________ SWAGGER CONFIGURATION ______________//
swaggerSources {

    fabricWorkspace {
        def fabricWorkspaceyaml = "${rootDir}/lib/src/main/resources/api/fabricWorkspaces.yaml"
        def fabricWorkspaceJson = "${rootDir}/lib/src/main/resources/api/fabricWorkspaces.json"
        inputFile = file(fabricWorkspaceyaml)

        def ignoreFile = "${rootDir}/lib/src/main/resources/api/.swagger-codegen-ignore"

        code {
            language = 'spring'
            configFile = file(fabricWorkspaceJson)
            rawOptions = ['--ignore-file-override', ignoreFile]
            components = ['models', 'apis']
        }
    }
    tag {
        def tagyaml = "${rootDir}/lib/src/main/resources/api/Tag.yaml"
        def tagJson = "${rootDir}/lib/src/main/resources/api/Tag.json"
        inputFile = file(tagyaml)

        def ignoreFile = "${rootDir}/lib/src/main/resources/api/.swagger-codegen-ignore"

        code {
            language = 'spring'
            configFile = file(tagJson)
            rawOptions = ['--ignore-file-override', ignoreFile]

            components = ['models', 'apis']
        }
    }

    adaProjects {
        def adaProjectsYaml = "${rootDir}/lib/src/main/resources/api/adaProjects.yaml"
        def adaProjectsJson = "${rootDir}/lib/src/main/resources/api/adaProjects.json"
        inputFile = file(adaProjectsYaml)

        def ignoreFile = "${rootDir}/lib/src/main/resources/api/.swagger-codegen-ignore"

        code {
            language = 'spring'
            configFile = file(adaProjectsJson)
            rawOptions = ['--ignore-file-override', ignoreFile]

            components = ['models', 'apis']
        }
    }

    fabricCatalogManagement {
        def fabricCatalogManagementyaml = "${rootDir}/lib/src/main/resources/api/fabricCatalogManagement.yaml"
        def fabricCatalogManagementJson = "${rootDir}/lib/src/main/resources/api/fabricCatalogManagement.json"
        inputFile = file(fabricCatalogManagementyaml)

        def ignoreFile = "${rootDir}/lib/src/main/resources/api/.swagger-codegen-ignore"

        code {
            language = 'spring'
            configFile = file(fabricCatalogManagementJson)
            rawOptions = ['--ignore-file-override', ignoreFile]

            components = ['models', 'apis']
        }
    }
    
    fabricWorkspaceAdmin {
        def fabricWorkspaceAdminyaml = "${rootDir}/lib/src/main/resources/api/fabricWorkspacesAdmin.yaml"
        def fabricWorkspaceAdminJson = "${rootDir}/lib/src/main/resources/api/fabricWorkspacesAdmin.json"
        inputFile = file(fabricWorkspaceAdminyaml)

        def ignoreFile = "${rootDir}/lib/src/main/resources/api/.swagger-codegen-ignore"

        code {
            language = 'spring'
            configFile = file(fabricWorkspaceAdminJson)
            rawOptions = ['--ignore-file-override', ignoreFile]
            components = ['models', 'apis']
        }
    }
}

compileJava {
    dependsOn processResources
    dependsOn swaggerSources.fabricWorkspace.code
    source "${swaggerSources.fabricWorkspace.code.outputDir}/src/main/java" 
    dependsOn swaggerSources.tag.code
    source "${swaggerSources.tag.code.outputDir}/src/main/java"
    dependsOn swaggerSources.adaProjects.code
    source "${swaggerSources.adaProjects.code.outputDir}/src/main/java"
    dependsOn swaggerSources.fabricCatalogManagement.code
    source "${swaggerSources.fabricCatalogManagement.code.outputDir}/src/main/java"
    dependsOn swaggerSources.fabricWorkspaceAdmin.code
    source "${swaggerSources.fabricWorkspaceAdmin.code.outputDir}/src/main/java" 
}

sourceSets {
    unitTest {
        java { srcDir 'src/test/groovy' }
        resources { srcDir 'src/test/resources' }
        compileClasspath += sourceSets.main.runtimeClasspath
    }
    main {
        java { srcDirs = srcDirs }
		java { srcDirs += "${swaggerSources.fabricWorkspace.code.outputDir}/src/main/java" }
        java { srcDirs += "${swaggerSources.tag.code.outputDir}/src/main/java"}
        java { srcDirs += "${swaggerSources.adaProjects.code.outputDir}/src/main/java"}
        java { srcDirs += "${swaggerSources.fabricCatalogManagement.code.outputDir}/src/main/java" }
        java { srcDirs += "${swaggerSources.fabricWorkspaceAdmin.code.outputDir}/src/main/java" }
    }
}


dependencies {

	implementation group: 'org.springframework.boot', name: 'spring-boot-starter-security'

	implementation group: 'org.flywaydb', name: 'flyway-core'
	implementation group: 'org.flywaydb', name: 'flyway-database-postgresql'
	implementation group: 'org.springframework.boot', name: 'spring-boot-starter-data-jpa'
	implementation group: 'org.postgresql', name: 'postgresql'
    //implementation group: 'org.springframework.cloud', name: 'spring-cloud-starter-vault-config', version: '3.1.1'
	implementation group: 'io.hypersistence', name: 'hypersistence-utils-hibernate-63', version: '3.9.11'
	
	implementation group: 'org.yaml', name: 'snakeyaml'
    
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-actuator'
    implementation group: 'org.json', name: 'json', version: '20250517'

	//implementation group: 'com.graphql-java', name: 'graphql-spring-boot-starter', version: '5.0.2'
    
	//implementation (group: 'com.graphql-java', name: 'graphql-java-tools', version: '5.2.4'){
    //    exclude (group: 'com.fasterxml.jackson.core')
    //}
	
	//implementation group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.12.3'
	
	//implementation group: 'com.graphql-java', name: 'graphql-java-extended-scalars', version: '1.0'
	
    
    implementation 'io.swagger:swagger-annotations:1.6.14'

    swaggerCodegen 'org.openapitools:openapi-generator-cli:7.9.0'

    implementation group: 'cglib', name: 'cglib-nodep', version: '3.3.0'
    
    implementation('org.springframework.boot:spring-boot-starter-web')

	implementation('org.apache.tomcat.embed:tomcat-embed-jasper')

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    
    implementation group: 'org.codehaus.mojo', name: 'animal-sniffer-annotations', version: '1.20'
    
    implementation group: 'org.antlr', name: 'antlr4-runtime'

    implementation group: 'org.apache.httpcomponents.client5', name: 'httpclient5'
	
	implementation('org.springframework.boot:spring-boot-starter-aop')
	
    implementation 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    
    implementation 'org.springframework.boot:spring-boot-starter-validation'
	
	implementation group: 'com.google.code.gson', name: 'gson', version: '2.11.0'
	implementation group: 'org.glassfish.jaxb', name: 'jaxb-runtime'
	runtimeOnly group: 'org.glassfish', name: 'javax.json', version: '1.1.4'

    implementation group: 'net.minidev', name: 'json-smart'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation ('net.javacrumbs.shedlock:shedlock-spring:6.3.1')
    implementation ('net.javacrumbs.shedlock:shedlock-provider-jdbc-template:6.3.1')

    // OpenMetadata SDK
    implementation 'org.open-metadata:openmetadata-java-client:1.12.14'
    implementation 'org.open-metadata:openmetadata-spec:1.12.14'

    // Feign for HTTP client
    implementation 'io.github.openfeign:feign-core:13.5'
    implementation 'io.github.openfeign:feign-jackson:13.5'
    implementation 'io.github.openfeign:feign-okhttp:13.5'

    // databricks SDK
    implementation("com.databricks:databricks-sdk-java:0.150.0")
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
