swagger: "2.0"
info:
  version: "1.0.0"
  title: "Fabric workspaces for Admin management service"
host: "localhost:9292"
basePath: "/api/1.0"
consumes:
  - "application/json"
produces:
  - "application/json"
tags:
  - name: "solutions"
    description: "This service is used for fabric workspaces maintenance."

schemes:
  - "https"

paths:
  # path to create a new solution and fetch all valid solution or by intent
  #
  #  supprorted http methods GET, POST and DELETE
  #
  # path example ../fabric-workspaces
  /fabric-workspaces/admin/workspaces:
    get:
      tags:
        - "fabric-workspaces-admin"
      summary: "Get all workspaces for Fabric Admin users."
      description: "Fetches all valid fabric workspace records. This endpoint is available only for users who have the FabricAdmin role."
      operationId: "getAllForFabricAdmin"
      parameters:
        - name: offset
          in: query
          description: Page number from which listing of workspaces should start. Offset. Example 2
          required: false
          type: integer
        - name: limit
          in: query
          description: Page size to limit the number of workspaces, Example 15
          required: false
          type: integer
        - name: sortBy
          in: query
          description: Sort workspaces by a given variable like name or createdOn
          required: false
          type: string
          enum: [name, createdOn]
        - name: sortOrder
          in: query
          description: Sort workspaces based on the given order (asc or desc)
          required: false
          type: string
          enum: [asc, desc]
        - name: search
          in: query
          type: string
          description: "Search term to filter workspaces by name."
          required: false
      responses:
        200:
          description: "Returns list of workspaces for Fabric Admin."
          schema:
            $ref: "#/definitions/FabricWorkspacesCollectionVO"
        204:
          description: "Fetch complete, no content found."
        400:
          description: "Bad request."
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "User is not a Fabric Admin."
        405:
          description: "Method not allowed."
        500:
          description: "Internal server error."

  /fabric-workspaces/admin/capacity:
    get:
      tags:
        - "fabric-workspaces-admin"
      summary: "Get all capacity details."
      description: "Fetches all capacity records. This endpoint is available only for users who have the FabricAdmin role."
      operationId: "getAllCapacity"
      responses:
        200:
          description: "Returns all capacity details."
          schema:
            type: array
            items:
              $ref: "#/definitions/CapacityVO"
        204:
          description: "Fetch complete, no content found."
        400:
          description: "Bad request."
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "User is not a Fabric Admin."
        405:
          description: "Method not allowed."
        500:
          description: "Internal server error."
    post:
      tags:
        - "fabric-workspaces-admin"
      summary: "Create or update a capacity record."
      description: "Creates a new capacity record or updates an existing one for the given region. This endpoint is available only for users who have the FabricAdmin role."
      operationId: "createOrUpdateCapacity"
      parameters:
        - name: capacity
          in: body
          description: "Capacity details to create or update."
          required: true
          schema:
            $ref: "#/definitions/CapacityVO"
      responses:
        200:
          description: "Capacity created or updated successfully."
          schema:
            $ref: "#/definitions/CapacityVO"
        400:
          description: "Bad request."
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "User is not a Fabric Admin."
        405:
          description: "Method not allowed."
        500:
          description: "Internal server error."

  /fabric-workspaces/admin/capacity/{region}:
    get:
      tags:
        - "fabric-workspaces-admin"
      summary: "Get capacity details by region."
      description: "Fetches capacity record for the given region. This endpoint is available only for users who have the FabricAdmin role."
      operationId: "getCapacityByRegion"
      parameters:
        - name: region
          in: path
          description: "Region identifier for the capacity (e.g. global, eu, us)."
          required: true
          type: string
      responses:
        200:
          description: "Returns capacity details for the given region."
          schema:
            $ref: "#/definitions/CapacityVO"
        204:
          description: "Fetch complete, no content found."
        400:
          description: "Bad request."
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "User is not a Fabric Admin."
        405:
          description: "Method not allowed."
        500:
          description: "Internal server error."
    delete:
      tags:
        - "fabric-workspaces-admin"
      summary: "Delete capacity for a given region."
      description: "Deletes the capacity record for the given region. This endpoint is available only for users who have the FabricAdmin role."
      operationId: "deleteCapacityByRegion"
      parameters:
        - name: region
          in: path
          description: "Region identifier for the capacity to be deleted."
          required: true
          type: string
      responses:
        200:
          description: "Capacity deleted successfully."
          schema:
            $ref: "#/definitions/CapacityVO"
        400:
          description: "Bad request."
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "User is not a Fabric Admin."
        404:
          description: "Capacity not found for the given region."
        405:
          description: "Method not allowed."
        500:
          description: "Internal server error."
