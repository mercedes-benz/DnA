namespace: dna
imagePullSecret:
  name: imagepullsecret
ingress:
  enabled: false
  namespace: ingress
  host: dna.app.corpintra.net
  lbIP: 53.6.53.65
  annotations:
    traefik.frontend.rule.type: PathPrefix
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: daimler-acme
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect@kubernetescrd
configJs: |
  window["INJECTED_ENVIRONMENT"]={
    OIDC_DISABLED: ,
    OIDC_PROVIDER: "",
    API_BASEURL: "",
    CLIENT_IDS: "",
    REDIRECT_URLS: "",
    OAUTH2_AUTH_URL: "",
    OAUTH2_LOGOUT_URL: "",
    OAUTH2_REVOKE_URL: "",
    OAUTH2_TOKEN_URL: "",
    DNA_COMPANY_NAME: "",
    DNA_APPNAME_HEADER: "",
    DNA_APPNAME_HOME: "",
    DNA_CONTACTUS_HTML: "",
    DNA_BRAND_LOGO_URL: "",
    DNA_APP_LOGO_URL: "",
    ENABLE_INTERNAL_USER_INFO: true,
    ENABLE_DATA_COMPLIANCE: true,
    ENABLE_JUPYTER_WORKSPACE: true,
    JUPYTER_NOTEBOOK_URL: "",
    JUPYTER_NOTEBOOK_OIDC_POPUP_URL: "",
    JUPYTER_NOTEBOOK_OIDC_POPUP_WAIT_TIME: 5000,
    ENABLE_DATAIKU_WORKSPACE: true,
    DATAIKU_LIVE_APP_URL: "",
    DATAIKU_TRAINING_APP_URL: "",
    DATAIKU_FERRET_URL: "",
    ENABLE_MALWARE_SCAN_SERVICE: true,
    MALWARE_SCAN_SWAGGER_UI_URL: "",
    ENABLE_MALWARE_SCAN_ONEAPI_INFO: true,
    ENABLE_DATA_PIPELINE_SERVICE: true,
    ENABLE_STORAGE_SERVICE: true,
    STORAGE_MFE_APP_URL: "",
    ENABLE_REPORTS: true,
    ENABLE_ML_PIPELINE_SERVICE: true,
    ENABLE_NOTIFICATION: true,
    DATA_PIPELINES_APP_BASEURL: "",
    DATA_PIPELINES_API_BASEURL: "",
    NOTIFICATIONS_API_BASEURL: "",
    DASHBOARD_API_BASEURL: "",
    MALWARESCAN_API_BASEURL: "",
    ML_PIPELINE_URL: "",
    MODEL_REGISTRY_API_BASEURL: "",
    ENABLE_MY_MODEL_REGISTRY_SERVICE: true,
    INTERNAL_USER_TEAMS_INFO: ''
    ENABLE_DATA_PRODUCT: true,
    DATA_PRODUCT_MFE_APP_URL: "",
    SPIRE_URL: 'YOUR_SPIRE_URL'
  };

  window["STORAGE_INJECTED_ENVIRONMENT"]={
      CONTAINER_APP_URL: "",
      STORAGE_API_BASEURL: "",
      TOU_HTML: "", 
      ENABLE_DATA_CLASSIFICATION_SECRET: false,
      API_BASEURL: ,
      TRINO_API_BASEURL: ",
      ENABLE_TRINO_PUBLISH: true    
  };

  window["DATA_PRODUCT_INJECTED_ENVIRONMENT"]={
    CONTAINER_APP_URL: "",
    API_BASEURL: "",
    DATA_PRODUCT_API_BASEURL: "",
    DATA_GOVERNANCE_HTML_FOR_CHINA_DATA: "",
    DATA_PRODUCT_TOU_HTML: ""
  };  
  window["CHRONOS_INJECTED_ENVIRONMENT"]={
    CONTAINER_APP_URL: "",
    API_BASEURL: "",
    CHRONOS_API_BASEURL: "",
  };
  window["MATOMO_INJECTED_ENVIRONMENT"]={
    API_BASEURL:"",
    CONTAINER_APP_URL:"",
    MATOMO_API_BASEURL:"",
    MATOMO_APP_URL:"",
    REPORTS_API_BASEURL:"",
    STORAGE_API_BASEURL:"",
  }; 
probes:
  initialDelaySeconds: 30
  timeoutSeconds: 10
  periodSeconds: 10
  failureThreshold: 3
  readinessProbe:
    path: /
    port: 3000
appFrontend:
  replicaCount: 2
  image:
    repository: registry-emea.app.corpintra.net/dnaplatform/dna-frontend
    tag: 3.11.3
  ngnix:
    backend: http://dna-app-backend-service.dna.svc.cluster.local:80
    grafanaServer: http://i3-monitoring-grafana.i3-monitoring.svc.cluster.local:80
    avscanMgwServer: apisap.app.corpintra.net
    clamav: http://clamav-rest-service.clamav.svc.cluster.local:8181
vaultInjector:
  enable: true
  annotations:
    vault.hashicorp.com/agent-inject: 'true'
    vault.hashicorp.com/role: 'dna_prod_k8_role'
    vault.hashicorp.com/tls-skip-verify: 'true'
    vault.hashicorp.com/agent-pre-populate-only: 'true'
    vault.hashicorp.com/agent-inject-secret-configjs: dna_kv/prod/kubernetesSecret/dnaFrontend
    vault.hashicorp.com/agent-inject-file-configjs: config.js
    vault.hashicorp.com/agent-inject-template-configjs: |
      {{- with secret "dna_kv/prod/kubernetesSecret/dnaFrontend" -}}
          window["INJECTED_ENVIRONMENT"]={
          {{- range $k, $v := .Data.data }}
          {{- if or (eq $v "true") (eq $v "false") (regexMatch "^[0-9]+$" $v) }}
                  {{ $k }}:{{ $v }},
          {{ else }}
                  {{ $k }}:'{{ $v }}',
          {{- end }}
          {{- end }}
              };
      {{- end }}
      {{- with secret "dna_kv/prod/kubernetesSecret/storageMFE" -}}
          window["STORAGE_INJECTED_ENVIRONMENT"]={
          {{- range $k, $v := .Data.data }}
          {{- if or (eq $v "true") (eq $v "false") (regexMatch "^[0-9]+$" $v) }}
                  {{ $k }}:{{ $v }},
          {{ else }}
                  {{ $k }}:'{{ $v }}',
          {{- end }}
          {{- end }}
              };
      {{- end }}  
      {{- with secret "dna_kv/prod/kubernetesSecret/dataProductMFE" -}}
          window["DATA_PRODUCT_INJECTED_ENVIRONMENT"]={
          {{- range $k, $v := .Data.data }}
          {{- if or (eq $v "true") (eq $v "false") (regexMatch "^[0-9]+$" $v) }}
                  {{ $k }}:{{ $v }},
          {{ else }}
                  {{ $k }}:'{{ $v }}',
          {{- end }}
          {{- end }}
              };
      {{- end }}
      {{- with secret "dna_kv/prod/kubernetesSecret/chronosMFE" -}}
          window["CHRONOS_INJECTED_ENVIRONMENT"]={
          {{- range $k, $v := .Data.data }}
          {{- if or (eq $v "true") (eq $v "false") (regexMatch "^[0-9]+$" $v) }}
                  {{ $k }}:{{ $v }},
          {{ else }}
                  {{ $k }}:'{{ $v }}',
          {{- end }}
          {{- end }}
              };
      {{- end }}     
      {{- with secret "dna_kv/prod/kubernetesSecret/dssMFE" -}}
          window["DSS_INJECTED_ENVIRONMENT"]={
          {{- range $k, $v := .Data.data }}
          {{- if or (eq $v "true") (eq $v "false") (regexMatch "^[0-9]+$" $v) }}
                  {{ $k }}:{{ $v }},
          {{ else }}
                  {{ $k }}:'{{ $v }}',
          {{- end }}
          {{- end }}
              };
      {{- end }}
      {{- with secret "dna_kv/prod/kubernetesSecret/matomoMFE" -}}
          window["MATOMO_INJECTED_ENVIRONMENT"]={
          {{- range $k, $v := .Data.data }}
