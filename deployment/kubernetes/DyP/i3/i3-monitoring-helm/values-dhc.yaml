tempo-distributed:
  enabled: true
  global:
    image:
      registry: registry-emea.app.corpintra.net/dockerhub
  fullnameOverride: 'tempo'
  ingester:
    persistence:
      enabled: true
      inMemory: false
      size: 10Gi
      storageClass: dhc-gp3    
    complete_block_timeout: 720h
  compactor:    
    config:
      compaction:
        block_retention: 720h    
  traces:
    otlp:
      grpc:
        enabled: true
      http:
        enabled: true
    zipkin:
      enabled: true
    jaeger:
      thriftHttp:
        enabled: true
      thriftCompact:
        # -- Enable Tempo to ingest Jaeger Thrift Compact traces
        enabled: true        
    opencensus:
      enabled: false
  storage:
    trace:
      s3:
        endpoint: <path:kv/data/dna/kubernetesSecret/monitoring#s3.host>
        bucket: <path:kv/data/dna/kubernetesSecret/monitoring#traces_bucket>
        insecure: true
        access_key: <path:kv/data/dna/kubernetesSecret/monitoring#access_key>
        secret_key: <path:kv/data/dna/kubernetesSecret/monitoring#secret_key>
        forcepathstyle: true
  extraObjects: 
    -   apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: tempo
          namespace: i3-monitoring
        spec:
          podSelector:
            matchLabels:
              app.kubernetes.io/name: tempo
          ingress:
            - ports:
                - protocol: TCP
                  port: 3100
                - protocol: TCP
                  port: 14268
                - protocol: TCP
                  port: 9411
                - protocol: TCP
                  port: 4318
                - protocol: TCP
                  port: 7946   
                - protocol: TCP
                  port: 9095       
                - protocol: TCP
                  port: 11211        
                - protocol: UDP
                  port: 6831                                                                                  
          policyTypes:
            - Ingress      
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-acme-http01-solver
        namespace: i3-monitoring
      spec:
        podSelector:
          matchLabels:
            acme.cert-manager.io/http01-solver: 'true'
        ingress:
          - ports:
              - protocol: TCP
                port: 8089
          - from:
              - podSelector:
                  matchLabels:
                    app: traefik
                namespaceSelector:
                  matchExpressions:
                    - key: name
                      operator: In
                      values:
                        - ingress
        policyTypes:
          - Ingress


loki:
  enabled: true
  global:
    image:
      registry: registry-emea.app.corpintra.net/dockerhub  
  networkPolicy:
    enabled: true         
  sidecar:
    image:
      repository: registry-emea.app.corpintra.net/dockerhub/kiwigrid/k8s-sidecar     
  memcached:
    image:
      repository: registry-emea.app.corpintra.net/dockerhub/memcached      
  memcachedExporter:
    enabled: true
    image:
      repository: registry-emea.app.corpintra.net/dockerhub/prom/memcached-exporter  
  loki:
    auth_enabled: false
    # compactor:
    #   compaction_interval: 10m
    #   retention_delete_delay: 2h
    #   retention_delete_worker_count: 150
    #   retention_enabled: true
    #   working_directory: /data/retention
    limits_config:
      retention_period: 72h   
      max_streams_per_user: 100000         
    commonConfig:
      replication_factor: 3
    schemaConfig:
      configs:
      - from: "2024-01-01"
        store: tsdb
        index:
          prefix: loki_index_
          period: 24h
        object_store: s3
        schema: v13
    storage:
      type: 's3'
      bucketNames:
        chunks: loki-chunks
        ruler: loki-ruler
        admin: loki-admin
      s3:
        endpoint: <path:kv/data/dna/kubernetesSecret/monitoring#s3.host>
        secretAccessKey: <path:kv/data/dna/kubernetesSecret/monitoring#secret_key>
        accessKeyId: <path:kv/data/dna/kubernetesSecret/monitoring#access_key>
        s3ForcePathStyle: true
        insecure: true
        http_config: {}    
    singleBinary:
      replicas: 3    
