deployment:
  kong:
    enabled: true
  serviceAccount:
    create: true
  test:
    enabled: false
  sidecarContainers:
    - name: simple-rp
      image: registry-emea.app.corpintra.net/dnaplatform/simple-rp-code-space:1
      ports:
        - containerPort: 8080
          protocol: TCP
  daemonset: false
  hostNetwork: false
namespace: kong
env:
  database: postgres
  pg_port: '64000'
  pg_ssl: 'off'
  pg_ssl_verify: 'off'
  pg_host:
    valueFrom:
      secretKeyRef:
        key: postgres.host
        name: kong-settings
  pg_user:
    valueFrom:
      secretKeyRef:
        key: postgres.user
        name: kong-settings
  pg_password:
    valueFrom:
      secretKeyRef:
        key: postgres.password
        name: kong-settings
  pg_database:
    valueFrom:
      secretKeyRef:
        key: postgres.db
        name: kong-settings
  pg_schema:
    valueFrom:
      secretKeyRef:
        key: postgres.schema
        name: kong-settings
  nginx_worker_processes: '2'
  proxy_access_log: /dev/stdout
  admin_gui_url: https://manager.serving.kfp.dna.app.corpintra.net
  admin_api_uri: https://serving.kfp.dna.app.corpintra.net/admin
  admin_listen: 0.0.0.0:8001
  admin_gui-listen: 0.0.0.0:8002
  admin_access_log: /dev/stdout
  admin_gui_access_log: /dev/stdout
  portal_api_access_log: /dev/stdout
  proxy_error_log: /dev/stderr
  admin_error_log: /dev/stderr
  admin_gui_error_log: /dev/stderr
  portal_api_error_log: /dev/stderr
  prefix: /kong_prefix/
  log_level: error
  plugins: bundled,oneapi,jwt,oidc,jwtissuer,appauthoriser,apiauthoriser,fcjwtissuer,pathfinder,cookies-to-headers
  oneapi_gateway_key:
    valueFrom:
      secretKeyRef:
        key: ONEAPI_GATEWAY_KEY
        name: kong-settings
  oneapi_gateway_secret:
    valueFrom:
      secretKeyRef:
        key: ONEAPI_GATEWAY_SECRET
        name: kong-settings
  oneapi_https_proxy: http://security-proxy.emea.svc.corpintra.net:3128
  pluginserver_names: js
  pluginserver_js_socket: /usr/local/kong/js_pluginserver.sock
  pluginserver_js_start_cmd: /usr/bin/kong-js-pluginserver -v --plugins-directory /usr/local/kong/js-plugins
  pluginserver_js_query_cmd: /usr/bin/kong-js-pluginserver --plugins-directory /usr/local/kong/js-plugins --dump-all-plugins
