apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-apps
  namespace: argocd
  labels:
    name: argocd-apps  
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  source:
    path: deployment/kubernetes/DyP/argocd/apps
    repoURL: https://git.i.mercedes-benz.com/DNA/NeuDnAPlatform.git
    targetRevision: migration/aws
    plugin:
      name: argocd-vault-plugin-helm
      env:
        - name: HELM_ARGS
          value: -f values-dev.yaml
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
---
## ArgoCD root app for BAT development applications
kind: Application
apiVersion: argoproj.io/v1alpha1
metadata:
  name: bat-dev-root-app
  namespace: argocd
spec:
  project: 'bat-development'
  source:
    repoURL: 'https://git.i.mercedes-benz.com/BAT/bat-infra.git'
    targetRevision: HEAD
    path: c52p219-dev/apps
    plugin:
      name: argocd-vault-plugin-helm
  destination:
    name: 'bat-development-c82p085'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true