# -----------------------------------------------------------------------------
# Kong parameters
# -----------------------------------------------------------------------------

# Specify Kong configuration
# This chart takes all entries defined under `.env` and transforms them into into `KONG_*`
# environment variables for Kong containers.
env:
  database: "postgres"
  pg_host: "dev-db.dev-apisap.svc.cluster.local"
  pg_port: "64000"  
  pg_ssl: "off"
  pg_ssl_verify: "off"
  pg_user:
    valueFrom:
      secretKeyRef:
        key: postgres.user
        name: kongdev-db-setting
  pg_password:
    valueFrom:
      secretKeyRef:
        key: postgres.password
        name: kongdev-db-setting
  pg_database:
    valueFrom:
      secretKeyRef:
        key: postgres.db
        name: kongdev-db-setting 
  pg_schema: "public"       
  admin_api_uri: http://localhost:8001
  admin_gui_url: http://localhost:8002
  # admin_listen: 0.0.0.0:8001
  # admin_gui-listen: 0.0.0.0:8002  
  plugins: "bundled,oneapi,pathfinder,oauth2saml"
  log_level: "debug"   # info, debug
  NGINX_PROXY_PROXY_SSL_TRUSTED_CERTIFICATE: /etc/kong/tls.crt
  # upstream_keepalive_idle_timeout: 120
#  oneapi_environment: "testing" # optional
  oneapi_gateway_key:
   valueFrom:
    secretKeyRef:
      key: ONEAPI_GATEWAY_KEY
      name: kong-gateway-secret
  oneapi_gateway_secret:
   valueFrom:
    secretKeyRef:
      key: ONEAPI_GATEWAY_SECRET
      name: kong-gateway-secret
  oneapi_https_proxy: "http://security-proxy.emea.svc.corpintra.net:3128" 
  oneapi_no_proxy: "sso-int.daimler.com,sso.daimler.com,corpintra.net,corpshared.net,127.0.0.0/8,53.0.0.0/8,cluster.local,sso.mercedes-benz.com,sso-int.mercedes-benz.com"
  headers: "off"  
  
  pluginserver_names: js
  pluginserver_js_socket: /usr/local/kong/js_pluginserver.sock
  pluginserver_js_start_cmd: /usr/bin/kong-js-pluginserver -v --plugins-directory /usr/local/kong/js-plugins
  pluginserver_js_query_cmd: /usr/bin/kong-js-pluginserver --plugins-directory /usr/local/kong/js-plugins --dump-all-plugins
  # pluginserver_names: js
  # pluginserver_js_socket: /usr/local/kong/js_pluginserver.sock
  # pluginserver_js_start_cmd: /usr/local/bin/kong-js-pluginserver -v --plugins-directory /usr/local/kong/js-plugins
  # pluginserver_js_query_cmd: /usr/local/bin/kong-js-pluginserver --plugins-directory /usr/local/kong/js-plugins --dump-all-plugins
 

deployment:
  
  sidecarContainers:
  - name: simple-rp
    image: registry-emea.app.corpintra.net/dnaplatform/kong-reverse-proxy:2
    imagePullPolicy: Always
    ports:
    - containerPort: 8080
    env:
    - name: HTTPS_PROXY
      value: "http://security-proxy.emea.svc.corpintra.net:3128"
    - name: NO_PROXY
      value: 53.0.0.0/8,10.0.0.0/8,corpshared.net,corpintra.net,cluster.local,git.daimler.com,login.daimler.com,sso.daimler.com,matter.i.mercedes-benz.com  
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 150Mi
        cpu: 200m
    livenessProbe:
      httpGet:
        path: /alive
        port: 8080
        httpHeaders:
        - name: x-alive
          value: healthcheck
      initialDelaySeconds: 10
      periodSeconds: 5

  userDefinedVolumes:
  - name: sap-certificate
    secret:
      secretName: global-sap-saml
  - name: pathfinder-config
    configMap: 
      name: pathfinder-config 
      defaultMode: 420 
  - name: pathfinder-secret 
    secret:
      secretName: pathfinder-secret  

  # - name: kong-log-file
  #   persistentVolumeClaim:
  #     claimName: kong-log-file-pvc
       
            
  userDefinedVolumeMounts:
  - mountPath: /usr/local/kong/js-plugins/oauth2saml/certs/cert.pem
    subPath: cert.pem
    name: sap-certificate
  - mountPath: /usr/local/kong/js-plugins/oauth2saml/certs/key.pem
    subPath: key.pem
    name: sap-certificate
  - mountPath: /usr/local/kong/js-plugins/oauth2saml/certs/ca-root.pem
    subPath: ca-root.pem
    name: sap-certificate

  - mountPath: /etc/kong/tls.crt
    subPath: tls.crt
    name: sap-certificate
      
  - mountPath: /usr/local/kong/js-plugins/pathfinder/certs/cert.pem
    subPath: cert.pem
    name: sap-certificate
  - mountPath: /usr/local/kong/js-plugins/pathfinder/certs/key.pem
    subPath: key.pem
    name: sap-certificate
  - mountPath: /usr/local/kong/js-plugins/pathfinder/certs/ca-root.pem
    subPath: ca-root.pem
    name: sap-certificate     

  - mountPath: /usr/local/kong/js-plugins/pathfinder/pathfinder-secret.yaml
    subPath: pathfinder-secret.yaml
    name: pathfinder-secret
  - mountPath: /usr/local/kong/js-plugins/pathfinder/pathfinder-config.yaml
    subPath: pathfinder-config.yaml
    name: pathfinder-config    

image:
  repository: registry-emea.app.corpintra.net/dnaplatform/kong/oneapi-custom-pathfinder 
  tag: 1.9.2
  pullPolicy: Always
  pullSecrets:
  - imagepullsecret  
# Specify Kong proxy service configuration
proxy:
  # Enable creating a Kubernetes service for the proxy
  enabled: true
  type: ClusterIP
  
  
  # If you want to specify annotations for the proxy service, uncomment the following
  # line, add additional or adjust as needed, and remove the curly braces after 'annotations:'.
  annotations: {}
  #  service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"

  http:
    # Enable plaintext HTTP listen for the proxy
    enabled: true

  tls:
    # Enable HTTPS listen for the proxy
    enabled: false

## Ingress route to create routes and middleware for trafeik on DHCaas
  ingressRoute:
    # Enable/disable exposure using ingress.
    enabled: false
    # Ingress hostname
    hostname: apisap-aws.app.corpintra.net
    # Ingress path.
    pathPrefix: /
    certificateIssuer: mercedes-benz-acme

  # Kong proxy ingress settings.
  # Note: You need this only if you are using another Ingress Controller
  # to expose Kong outside the k8s cluster.
  ingress:
    # Enable/disable exposure using ingress.
    enabled: true
    ingressClassName:
    # Ingress hostname
    # TLS secret name.
    tls: apisap-dev-tls
    # Ingress hostname
    hostname: apisap-aws.app.corpintra.net
    annotations:     
      cert-manager.io/cluster-issuer: mercedes-benz-acme
      kubernetes.io/ingress.class: traefik
      traefik.frontend.rule.type: PathPrefix
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: 'true'
    path: /
    # Each path in an Ingress is required to have a corresponding path type. (ImplementationSpecific/Exact/Prefix)
    pathType: Prefix

    
    
