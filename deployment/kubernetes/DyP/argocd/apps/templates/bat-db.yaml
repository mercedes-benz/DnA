apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: {{ .Values.env }}-bat-db
  namespace: {{ .Values.namespace }}
  labels:
    name: db
    env: {{ .Values.env }}-bat
spec:
  destination:
    namespace: {{ .Values.env }}-bat
    server: {{ .Values.server | squote }}
  source:
    path: deployment/kubernetes/DyP/i3/postgresql-helm
    repoURL: {{ .Values.repoURL | squote }}
    targetRevision: {{ .Values.branch }}
    plugin:
      name: argocd-vault-plugin-helm
      env:
        - name: HELM_ARGS
          value: -f values-bat-{{ .Values.env }}-db.yaml --set namespace={{ .Values.env }}-bat       
  project: {{ .Values.env }}-dna
  {{- if .Values.enableSync }}
  syncPolicy: 
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
{{- end }}
