
name: Trigger Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target build environment"
        type: environment
        required: true
        default: 'Development'
      # service:
      #   description: 'Service to deploy'
      #   default: code-server
      #   required: true         
      #   type: choice
      #   options: 
      #     - code-server
      #     - dna-frontend
      #     - dna-backend         

  # push:
  #   branches:
  #     - dev
  #   paths:
  #     - 'packages/**'
  pull_request:
    types:
      - closed
    branches:
      - 'dev'
      - 'staging'
      - 'main'
    paths:
      - 'packages/**'      

env:
  REGISTRY: registry-emea.app.corpintra.net
  REGISTRY_DNA_USER: robot_dnaplatform+cicdbot 
  NO_PROXY: ''
  RUNNER_ALLOW_RUNASROOT: 1
  IMAGE_NAME: registry-emea.app.corpintra.net/dnaplatform/code-server-be
  IMAGE_TAG_PATH: image.tag
  DOCKER_FILE_PATH: dockerfiles/cs-backend.Dockerfile
  BLACKDUCK_URL: https://bdscan.i.mercedes-benz.com/
  DETECT_PROJECT_NAME: CodeServerBE
  # DETECT_SOURCE_PATH: <<<<fill-it>>>>>  # comment the line if path is root
  SECHUB_USERID: pid6c39
  SECHUB_SERVER: https://sechub.app.corpintra.net

jobs: 

    # changes:
