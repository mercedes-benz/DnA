konga:
  enabled: true
  namespace: kong
  ingress:
    enabled: true
    annotations:
      traefik.frontend.rule.type: PathPrefix
      kubernetes.io/ingress.class: traefik
      traefik.ingress.kubernetes.io/router.tls: 'true'
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: daimler-acme
      traefik.ingress.kubernetes.io/router.middlewares: default-redirect@kubernetescrd
    hosts:
      - host: konga.dna.app.corpintra.net
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - konga.dna.app.corpintra.net
        secretName: kfp-serving-secret-manager
  userdb_data: |
    module.exports = [
          {
              "username": "admin",
              "email": "kong-admin@dna.com",
              "firstName": "Admin",
              "lastName": "User",
              "node_id": "http://dna-kong-gw-kong-admin:8001",
              "admin": true,
              "active" : true,
              "password": "<path:dna_kv/data/prod/kubernetesSecret/kong#konga.password>"
          }
      ]
  kong_node_data: |
    module.exports = [
        {
            "name": "Kong Admin API",
            "type": "default",
            "kong_admin_url": "http://dna-kong-gw-kong-admin:8001",
            "health_checks": false,
        }
    ]