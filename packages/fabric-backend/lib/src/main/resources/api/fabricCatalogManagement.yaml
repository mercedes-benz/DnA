swagger: "2.0"
info:
  version: "1.0.0"
  title: "Fabric Lakehouse catalog management service"
host: "localhost:9292"
basePath: "/api/1.0"
consumes:
  - "application/json"
produces:
  - "application/json"
tags:
  - name: "solutions"
    description: "This service is used for fabric Lakehouse catalog maintenance."

schemes:
  - "https"

paths:
  /catalog/publish:
     post:
      tags:
        - "fabric-catalog-management"
      summary: "Publish a new catalog."
      description: "This endpoint will be used to publish a new fabric catalog."
      operationId: "publishCatalogRequest"
      parameters:
        - name: publishCatalogRequest
          in: body
          description: "The catalog to publish."
          required: true
          schema:
            $ref: "#/definitions/PublishCatalogRequestVO"
      responses:
        201:
          description: "Returns message of success or failure "
          schema:
            $ref: "#/definitions/PublishCatalogResponseVO"
        400:
          description: "Bad Request"
          schema:
            $ref: "#/definitions/GenericMessage"
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"
          

definitions:

  PublishCatalogRequestVO:
    type: object
    required:
      - metaData
      - workspaceId
      - customProperties
      - owners
    properties:
      metaData:
        $ref: "#/definitions/FabricCatalogMetadataVO"
      workspaceId:
        type: string
        minLength: 1
        description: "The workspace ID where the catalog will be published."
      mandatoryFields:
        $ref: "#/definitions/MandatoryFieldsVO"
      owners:
        type: array
        items:
          $ref: "#/definitions/CreatedByVO"

  FabricCatalogMetadataVO:
    type: object
    required:
      - serviceName
    properties:
      serviceName:
        type: string
        description: "Name of the service"
      serviceId:
        type: string
        description: "OpenMetadata service ID (optional)"
      databases:
        type: array
        description: "List of databases with metadata"
        items:
          $ref: "#/definitions/DatabaseMetadataVO"

  DatabaseMetadataVO:
    type: object
    required:
      - dbName
    properties:
      dbName:
        type: string
      dbId:
        type: string
      schemas:
        type: array
        items:
          $ref: "#/definitions/SchemaMetadataVO"

  SchemaMetadataVO:
    type: object
    required:
      - schemaName
    properties:
      schemaName:
        type: string
      schemaId:
        type: string
      tables:
        type: array
        items:
          $ref: "#/definitions/TableMetadataVO"

  TableMetadataVO:
    type: object
    required:
      - tableName
    properties:
      tableName:
        type: string
      tableId:
        type: string
      columns:
        type: array
        items:
          $ref: "#/definitions/ColumnMetadataVO"

  ColumnMetadataVO:
    type: object
    required:
      - columnName
      - colType
    properties:
      columnId:
        type: string
      columnName:
        type: string
      colType:
        type: string
      colConstraint:
        type: string

  PublishCatalogResponseVO:
    type: object
    properties:
      data:
        type: object
        properties:
          catalogMetadata:
            $ref: "#/definitions/FabricCatalogMetadataVO"
          ownerDetails:
            $ref: "#/definitions/CreatedByVO"
      responses:
        $ref: "#/definitions/GenericMessage"


  CreatedByVO:
    type: object
    properties:
      id:
        type: string
        description: "ID of user"
      firstName:
        type: string
        description: "First Name of the user"
      lastName:
        type: string
        description: "Last Name of the user"
      department:
        type: string
        description: "Department of the user"
      email:
        type: string
        description: "E-Mail of the user"
      mobileNumber:
        type: string
        description: "Mobile number of the user"

  MandatoryFieldsVO:
    type: object
    properties:
      division:
        type: string
        minLength: 1
      department:
        type: string
        minLength: 1
      dataOrigin:
        type: string
        minLength: 1
        enum: ["internal","external","mixed"]
      leanIXId:
        type: string
        minLength: 1
      isDocumentationUpdated:
        type: string
        enum: ["Yes","No"]
        minLength: 1
      isDataLakeAvailability:
        type: string
        enum: ["Yes","No"]
        minLength: 1
      isDataAsset:
        type: string
        minLength: 1
        enum: ["Yes","No"]