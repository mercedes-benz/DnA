#Author: KAMERAO
# This is the build & deploy workflow for Clamav Malware Scanner base image

name: Build & Publish Clamav Docker image
on:
  workflow_dispatch:  
  schedule:
    - cron:  '0 1 */1 * *' # every day at midnight

env:
  REGISTRY: registry-emea.app.corpintra.net
  REGISTRY_DNA_USER: robot_dnaplatform+cicdbot  
  IMAGE_NAME: registry-emea.app.corpintra.net/dnaplatform/clamav
  CLAMAV_VERSION: '1.0.1'
jobs:
  
  build:
    name: "Build Clamav Docker Image (Create PR to main)"
    runs-on: [os-small-amd64-linux]
    outputs:
      date: ${{ steps.date.outputs.date }}

    steps:
    - name: Check out repository code
      uses: actions/checkout@v3
      # with:
      #   ref: 'dev'

    # - name: Copy virus db
    #   working-directory: ./deployment/dockerfiles/clamav
    #   run: |
    #     mkdir runner-db
    #     cp -r /var/lib/clamav/*.* ./runner-db/
    
    - name: Get current date
      id: date
      run:  |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Build image
      working-directory: ./deployment/dockerfiles/clamav/1.0.1
      run: docker  build . --file clamav.Dockerfile --tag $IMAGE_NAME:$CLAMAV_VERSION --tag $IMAGE_NAME:${{ steps.date.outputs.date }}    

    - name: Log into DNA Registry
      run: echo ${{ secrets.HARBOR_DNA_REPO_SECRET }} | docker  login $REGISTRY -u $REGISTRY_DNA_USER --password-stdin
      
    - name: Push image
      run: |
        docker  push $IMAGE_NAME:$CLAMAV_VERSION
        docker  push $IMAGE_NAME:${{ steps.date.outputs.date }} 

    - name: Update Image Version values.yaml
      uses: fjogeleit/yaml-update-action@v0.13.1
      id: cpr
      with:
        valueFile: deployment/kubernetes/helm/charts/clamav/values-prod.yaml
        propertyPath: 'image.repo'
        value: "registry-emea.app.corpintra.net/dnaplatform/clamav:${{ steps.date.outputs.date }}"
        createPR: true
        branch: deploy-version-${{ github.run_number }}-main
        targetBranch: main
        masterBranchName: main
        labels: 'main, update-image-version'
        reviewers: 'AMARIAR,VKURAPA,SKOLLUR'
        commitChange: true
        message: 'Update Image Version to ${{ steps.date.outputs.date }}' 
        githubAPI: https://git.i.mercedes-benz.com/api/v3
        token: ${{ secrets.PID_PAT }} 

    - name: Print pull request details
      run: |
        echo "Pull Request Info - ${{ steps.cpr.outputs.pull_request }}"

  css-scan:
        name: Container security scan
        needs: build
        uses: ./.github/workflows/consec.yaml
        with:
          FULL_IMAGE_NAME: 'registry-emea.app.corpintra.net/dnaplatform/clamav:${{ needs.build.outputs.date }}'
        secrets: inherit

  staging:
    name: "Update tag staging"
    needs: build
    runs-on: [road-runner]
    
    steps:
    - name: Check out repository code
      uses: actions/checkout@v3
      with:
        ref: 'staging' 

    - name: Update Image Version values.yaml
      uses: fjogeleit/yaml-update-action@v0.13.1
      id: cpr
      with:
        valueFile: deployment/kubernetes/helm/charts/clamav/values-test.yaml
        propertyPath: 'image.repo'
        value: "registry-emea.app.corpintra.net/dnaplatform/clamav:${{ needs.build.outputs.date }}"
        createPR: true
        branch: deploy-version-${{ github.run_number }}-staging
        targetBranch: staging
        masterBranchName: staging
        labels: 'staging, update-image-version'
        commitChange: true
        message: 'Update Image Version to ${{ needs.build.outputs.date }}' 
        githubAPI: https://git.i.mercedes-benz.com/api/v3
        token: ${{ secrets.PID_PAT }}  

    - name: Print pull request details
      id: pr_number
      run: |
       PR_NUMBER=$(echo '${{ steps.cpr.outputs.pull_request }}' | grep -o '"number":[0-9]*' | sed 's/"number"://')
       echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_OUTPUT 

    - name: Staging pull request merge
      uses: sudo-bot/action-pull-request-merge@v1.2.0
      with:
        github-token: ${{ secrets.PID_PAT }}
        number: ${{ steps.pr_number.outputs.PR_NUMBER }}
        filter-label: staging 

  dev:
    name: "Update tag dev"
    needs: build
    runs-on: [road-runner]
    
    steps:
    - name: Check out repository code
      uses: actions/checkout@v3
      with:
        ref: 'dev' 

    - name: Update Image Version values.yaml
      uses: fjogeleit/yaml-update-action@v0.13.1
      id: cpr
      with:
        valueFile: deployment/kubernetes/helm/charts/clamav/values-dev.yaml
        propertyPath: 'image.repo'
        value: "registry-emea.app.corpintra.net/dnaplatform/clamav:${{ needs.build.outputs.date }}"
        createPR: true
        branch: deploy-version-${{ github.run_number }}-dev
        targetBranch: dev
        masterBranchName: dev
        labels: 'dev, update-image-version'
        commitChange: true
        message: 'Update Image Version to ${{ needs.build.outputs.date }}' 
        githubAPI: https://git.i.mercedes-benz.com/api/v3
        token: ${{ secrets.PID_PAT }}  

    - name: Print pull request details
      id: pr_number
      run: |
       PR_NUMBER=$(echo '${{ steps.cpr.outputs.pull_request }}' | grep -o '"number":[0-9]*' | sed 's/"number"://')
       echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_OUTPUT 

    - name: Dev pull request merge
      uses: sudo-bot/action-pull-request-merge@v1.2.0
      with:
        github-token: ${{ secrets.PID_PAT }}
        number: ${{ steps.pr_number.outputs.PR_NUMBER }}
        filter-label: dev 

