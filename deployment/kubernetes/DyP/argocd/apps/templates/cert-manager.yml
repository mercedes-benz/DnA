apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: cert-manager
  namespace: {{ .Values.namespace }}
  labels:
    name: dyp
    env: {{ .Values.env }}
    project: dna 
spec:
  destination:
    namespace: cert-manager
    server: {{ .Values.server | squote }}
  source:
    path: deployment/kubernetes/DyP/cert-manager
    repoURL: {{ .Values.repoURL | squote }}
    targetRevision: {{ .Values.branch }}
    plugin:
      name: argocd-vault-plugin-helm
      env:
        - name: HELM_ARGS
          value: -f values-dhc.yaml -n cert-manager  
  project: dna
{{- if .Values.enableSync }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
{{- end }}