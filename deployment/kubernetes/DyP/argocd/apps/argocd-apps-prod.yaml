apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-apps-prod
  namespace: argocd
  labels:
    name: argocd-apps-prod 
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  source:
    path: deployment/kubernetes/DyP/argocd/apps
    repoURL: https://git.i.mercedes-benz.com/DNA/NeuDnAPlatform.git
    targetRevision: main
    plugin:
      name: argocd-vault-plugin-helm
      env:
        - name: HELM_ARGS
          value: -f values-prod.yaml
  project: default
