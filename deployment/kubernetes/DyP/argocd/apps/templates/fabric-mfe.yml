apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: fabric-frontend
  namespace: {{ .Values.namespace }}
  labels:
    name: frontend  
spec:
  destination:
    namespace: fabric
    server: {{ .Values.server | squote }}
  source:
    path: deployment/helm
    repoURL: https://git.i.mercedes-benz.com/DNA/dna-fabric-mfe.git
    targetRevision: {{ .Values.branch }}
    helm:
      releaseName: fabric-mfe
      valueFiles:
        - values-{{ .Values.env }}.yaml
  project: dna
{{- if .Values.enableSync }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
{{- end }}
