# fullnameOverride and nameOverride distinguishes blank strings, null values,
# and non-blank strings. For more details, see the configuration reference.
fullnameOverride: "cs"
nameOverride:

# enabled is ignored by the jupyterhub chart itself, but a chart depending on
# the jupyterhub chart conditionally can make use this config option as the
# condition.
enabled:

# custom can contain anything you want to pass to the hub pod, as all passed
# Helm template values will be made available there.
custom: {}

# imagePullSecret is configuration to create a k8s Secret that Helm chart's pods
# can get credentials from to pull their images.
imagePullSecret:
  create: false
  automaticReferenceInjection: true
  registry:
  username:
  password:
  email:
# imagePullSecrets is configuration to reference the k8s Secret resources the
# Helm chart's pods can get credentials from to pull their images.
imagePullSecrets: 
  - name: imagepullsecret

# hub relates to the hub pod, responsible for running JupyterHub, its configured
# Authenticator class KubeSpawner, and its configured Proxy class
# ConfigurableHTTPProxy. KubeSpawner creates the user pods, and
# ConfigurableHTTPProxy speaks with the actual ConfigurableHTTPProxy server in
# the proxy pod.
hub:
  revisionHistoryLimit:
  config:
    Authenticator:
      admin_users:
        - palansa
      auto_login: true
      allowed_users:
       - skollur
    JupyterHub:
      admin_access: true
      authenticator_class: generic-oauth
      redirect_to_server: false
      default_url: https://dna.app.corpintra.net/#/codespaces
      cookie_secret: <path:dna_aws_kv/data/prod/kubernetesSecret/jupyterhub-codeserver#cookie_secret>
    CryptKeeper:
      keys: <path:dna_aws_kv/data/prod/kubernetesSecret/jupyterhub-codeserver#CryptKeeper> 
    ConfigurableHTTPProxy:
      auth_token: <path:dna_aws_kv/data/prod/kubernetesSecret/jupyterhub-codeserver#auth_token>           
    GenericOAuthenticator:
      client_id: <path:dna_aws_kv/data/prod/kubernetesSecret/jupyterhub-codeserver#client_id>
      client_secret: <path:dna_aws_kv/data/prod/kubernetesSecret/jupyterhub-codeserver#client_secret>
      oauth_callback_url: https://code-spaces.dna.app.corpintra.net/hub/oauth_callback
      authorize_url: https://sso.mercedes-benz.com/as/authorization.oauth2
      token_url: https://sso.mercedes-benz.com/as/token.oauth2  
      userdata_url: https://sso.mercedes-benz.com/idp/userinfo.openid
      login_service: 'Mercedes-Benz SSO'
      username_claim: 'sub'
      allow_existing_users: true
      scope: 
        - openid
        - email    
        - group_type
  service:
    type: ClusterIP
    annotations: {}
    ports:
      nodePort:
      appProtocol:
    extraPorts: []
    loadBalancerIP:
  baseUrl: /
  cookieSecret:
  initContainers: []
  nodeSelector: {}
  tolerations: []
  concurrentSpawnLimit: 64
  consecutiveFailureLimit: 5
  activeServerLimit:
  deploymentStrategy:
    ## type: Recreate
    ## - sqlite-pvc backed hubs require the Recreate deployment strategy as a
    ##   typical PVC storage can only be bound to one pod at the time.
    ## - JupyterHub isn't designed to support being run in parallell. More work
    ##   needs to be done in JupyterHub itself for a fully highly available (HA)
    ##   deployment of JupyterHub on k8s is to be possible.
    type: Recreate
  db:
    type: postgres
    upgrade: true
    pvc:
      annotations: {}
      selector: {}
      accessModes:
        - ReadWriteOnce
      storage: 1Gi
      subPath:
      storageClassName: dhc-gp3
    url: postgresql+psycopg2://cs-hub-db:64000/jupyterhub
    password: <path:dna_aws_kv/data/prod/kubernetesSecret/csdb#dbadm.password>
  labels: {}
  annotations: {}
  command: []
  args: []
  extraConfig: 
    code_spawner.py: |
      import json
      from kubespawner.spawner import KubeSpawner
      from jupyterhub.spawner import _quote_safe

      def redact_sensitive_data(data):
          """Redact sensitive information like tokens and passwords from logs"""
          if not isinstance(data, dict):
              return data
          
          import copy
          redacted = copy.deepcopy(data)
          sensitive_keys = ['token', 'password', 'secret', 'pat', 'key', 'credential']
          
          # Redact top-level sensitive keys
          for key in list(redacted.keys()):
              if any(sensitive in key.lower() for sensitive in sensitive_keys):
                  redacted[key] = '***REDACTED***'
          
          # Redact env variables
          if 'env' in redacted and isinstance(redacted['env'], dict):
              redacted['env'] = {
                  k: '***REDACTED***' if any(s in k.upper() for s in ['TOKEN', 'PASSWORD', 'SECRET', 'PAT', 'KEY', 'CREDENTIAL']) else v
                  for k, v in redacted['env'].items()
              }
          
          return redacted

      class CodeSpaceKubeSpawner(KubeSpawner):
          """
          Custom KubeSpawner that stores complete workspace configuration
          in user_options and logs all spawn operations for debugging.
          """
          
          async def start(self):
              """
              Override start to log and preserve all user_options before spawning.
              All configuration sent via API will be stored in JupyterHub database.
              """
              # Log the complete user_options being stored in database
              self.log.info(f"[WORKSPACE-START] Server: '{self.name}', User: '{self.user.name}'")
              self.log.info(f"[WORKSPACE-CONFIG] Complete user_options stored in DB: {json.dumps(redact_sensitive_data(self.user_options), indent=2)}")
              
              # Extract environment variables from user_options
              user_options_env = self.user_options.get("env", {})
              if user_options_env:
                  self.log.info(f"[WORKSPACE-ENV] Environment variables: {json.dumps(redact_sensitive_data({'env': user_options_env})['env'], indent=2)}")
              
              # Extract and log resource configurations
              storage_capacity = self.user_options.get('storage_capacity')
              mem_guarantee = self.user_options.get('mem_guarantee')
              mem_limit = self.user_options.get('mem_limit')
              cpu_guarantee = self.user_options.get('cpu_guarantee')
              cpu_limit = self.user_options.get('cpu_limit')
              extra_containers = self.user_options.get('extra_containers')
              profile = self.user_options.get('profile', 'default')
              
              self.log.info(f"[WORKSPACE-RESOURCES] Profile: {profile}, "
                           f"Storage: {storage_capacity}, Memory: {mem_guarantee}/{mem_limit}, "
                           f"CPU: {cpu_guarantee}/{cpu_limit}, "
                           f"Extra Containers: {len(extra_containers) if extra_containers else 0}")
              
              # Call parent start method
              return await super().start()
          
          async def stop(self, now=False):
              """Override stop to log workspace shutdown."""
              self.log.info(f"[WORKSPACE-STOP] Server: '{self.name}', User: '{self.user.name}'")
              self.log.info(f"[WORKSPACE-CONFIG] Stored user_options: {json.dumps(redact_sensitive_data(self.user_options), indent=2)}")
              return await super().stop(now=now)
          
          def get_args(self):
              """Custom args function for the coder"""
              self.log.info(f"[WORKSPACE-ARGS] Building args for server '{self.name}'")

              # Turn off authentication (happens via jupyterhub)
              args = ["--auth", "none"]
              # Turn off telemetry
              args += ["--disable-telemetry"]
              # Set App Name
              args += ["--app-name", "DnACodeSpace"]

              # Set non root domain
              args += ["--abs-proxy-base-path", f"/user/{self.user.name}/{self.name}"]

              # set port and ip if given
              ip = "0.0.0.0"
              if self.ip:
                  ip = _quote_safe(self.ip)

              port = 8888
              if self.port:
                  port = self.port
              elif self.server and self.server.port:
                  self.log.warning(
                      "Setting port from user.server is deprecated as of JupyterHub 0.7."
                  )
                  port = self.server.port

              args += ["--bind-addr", f"{ip}:{port}"]

              # set startup folder
              if self.notebook_dir:
                  notebook_dir = self.format_string(self.notebook_dir)
                  args += ["--user-data-dir", _quote_safe(notebook_dir)]

              # if self.debug:
              #     args += ["-vvv"]

              args.extend(self.args)
              self.log.info(f"[WORKSPACE-ARGS] Final args: {args}")
              return args

          def get_env(self):
              """Extract and merge environment variables from user_options"""
              env = super().get_env()
              user_options_env = self.user_options.get("env", {})
              if user_options_env:
                  self.log.info(f"[WORKSPACE-ENV] Merging user_options env: {list(user_options_env.keys())}")
                  env.update(user_options_env)
              return env

          async def get_options_from_form(self, formdata):
              """
              Preserve rich user_options when the restart API sends no body (empty dict).
              Without this override, KubeSpawner maps an empty form submission to
              {"profile": "default"}, overwriting all custom workspace configuration
              (storage, memory, CPU, env vars, extra_containers) that was stored in
              the JupyterHub DB during the initial server creation.

              Guard logic:
                - If the incoming formdata has substantive keys beyond 'profile',
                  forward normally to super() so intentional re-configuration works.
                - If the stored user_options already contains only {'profile': ...},
                  forward normally — there is nothing richer to preserve.
                - Otherwise (restart with empty/profile-only body against a workspace
                  that has full options stored), return the stored user_options as-is.
              """
              has_substantive_options = any(
                  k not in ('profile',) for k in (formdata or {})
              )
              has_rich_stored_options = bool(self.user_options) and any(
                  k not in ('profile',) for k in self.user_options
              )
              if not has_substantive_options and has_rich_stored_options:
                  self.log.info(
                      "[PRESERVE-OPTIONS] Incoming formdata minimal (%s), "
                      "preserving stored user_options for server '%s' (keys: %s)",
                      list((formdata or {}).keys()),
                      self.name,
                      list(self.user_options.keys())
                  )
                  return self.user_options
              return await super().get_options_from_form(formdata)

      # Use the configured spawner
      c.JupyterHub.spawner_class = CodeSpaceKubeSpawner

    code_settings.py: |
      import json
      
      # The working dir is by default set to
      # /home/coder in the VSCode image
      c.CodeSpaceKubeSpawner.working_dir = "/home/coder"
      # By default, the cmd includes the call to "jupyterhub-singleserver"
      # However, the docker image already comes with the correct
      # VSCode command to call, so we just set it to an empty string here
      c.CodeSpaceKubeSpawner.cmd = ""    
          
      # Pre-spawn hook to apply resource configurations from user_options
      # This ensures all details are read from JupyterHub DB (user_options)
      # rather than relying on code-server database
      def set_resource(spawner):
          """
          Apply resource configurations from user_options stored in JupyterHub database.
          All configuration details sent via API are preserved here.
          """
          # Redact sensitive data for logging
          def redact_log_data(data):
              if not isinstance(data, dict):
                  return data
              import copy
              redacted = copy.deepcopy(data)
              if 'env' in redacted and isinstance(redacted['env'], dict):
                  redacted['env'] = {
                      k: '***REDACTED***' if any(s in k.upper() for s in ['TOKEN', 'PASSWORD', 'SECRET', 'PAT', 'KEY']) else v
                      for k, v in redacted['env'].items()
                  }
              return redacted
          
          spawner.log.info(f"[PRE-SPAWN] Applying resources for user '{spawner.user.name}', server '{spawner.name}'")
          spawner.log.info(f"[PRE-SPAWN] user_options from DB: {json.dumps(redact_log_data(spawner.user_options), indent=2)}")
          
          # Apply storage capacity
          storage_capacity = spawner.user_options.get("storage_capacity", "1Gi")
          spawner.log.info(f"[PRE-SPAWN] Applying storage_capacity: {storage_capacity}")
          spawner.storage_capacity = storage_capacity
          
          # Apply memory settings
          mem_guarantee = spawner.user_options.get("mem_guarantee", "1000M")
          mem_limit = spawner.user_options.get("mem_limit", "2000M")
          spawner.log.info(f"[PRE-SPAWN] Applying memory - guarantee: {mem_guarantee}, limit: {mem_limit}")
          spawner.mem_guarantee = mem_guarantee
          spawner.mem_limit = mem_limit
          
          # Apply CPU settings
          cpu_guarantee = spawner.user_options.get("cpu_guarantee", 0.2)
          cpu_limit = spawner.user_options.get("cpu_limit")
          spawner.log.info(f"[PRE-SPAWN] Applying CPU - guarantee: {cpu_guarantee}, limit: {cpu_limit}")
          spawner.cpu_guarantee = cpu_guarantee
          # CPU limit intentionally not set to allow pods to burst above guarantee
          
          # Apply extra containers if provided
          extra_containers = spawner.user_options.get("extra_containers", [])
          if extra_containers:
              spawner.log.info(f"[PRE-SPAWN] Applying {len(extra_containers)} extra_containers")
              spawner.extra_containers = extra_containers
          
          profile = spawner.user_options.get("profile", "default")
          spawner.log.info(f"[PRE-SPAWN] Profile: {profile}")
          
          # Log final configuration summary
          cpu_limit_value = getattr(spawner, 'cpu_limit', 'N/A')
          spawner.log.info(f"[PRE-SPAWN] Resource configuration complete - "
                          f"Storage: {spawner.storage_capacity}, "
                          f"Memory: {spawner.mem_guarantee}/{spawner.mem_limit}, "
                          f"CPU: {spawner.cpu_guarantee}/{cpu_limit_value}")

      c.CodeSpaceKubeSpawner.pre_spawn_hook = set_resource     

      c.CodeSpaceKubeSpawner.extra_container_config = {
            'livenessProbe': {
              'httpGet': {
                'path': '/healthz',
                'port': 'notebook-port',
                'scheme': 'HTTP'
              },
              'initialDelaySeconds': 30,
              'periodSeconds': 60,
              'timeoutSeconds': 5,
              'successThreshold': 1,
              'failureThreshold': 10
            }
          }

