# Adjust values of prometheus Chart to run in DHC CaaS
prometheus:
  enabled: true
  # See values of upstream chart for details: https://github.com/prometheus-community/helm-charts/tree/main/charts/prometheus
  alertmanager:
    image:
      repository: registry-emea.app.corpintra.net/dockerhub/prom/alertmanager
    # Adjust securityContext for non-root
    securityContext:
      runAsUser: 65534
      runAsNonRoot: true
    configmapReload:
      image:
        repository: registry-emea.app.corpintra.net/ghcrcache/prometheus-operator/prometheus-config-reloader
  configmapReload:
    prometheus:
      image:
        repository: registry-emea.app.corpintra.net/ghcrcache/prometheus-operator/prometheus-config-reloader
  initChownData:
    enabled: false
    image:
      repository: registry-emea.app.corpintra.net/dockerhub/busybox
  kube-state-metrics:
    enabled: false
    image:
      registry: registry-emea.app.corpintra.net
      repository: k8scache/kube-state-metrics/kube-state-metrics
    securityContext:
      runAsUser: 65534
      fsGroup: 65534
  # DHC CaaS already provides nodeExporter
  prometheus-node-exporter:
    enabled: false
  server:
    image:
      repository: registry-emea.app.corpintra.net/dockerhub/prom/prometheus
    extraArgs:
      # Limit persistent data size (experimental)
      storage.tsdb.retention.size: "10GB"
    # Adjust securityContext for non-root
    securityContext:
      runAsUser: 65534
      runAsNonRoot: true
      fsGroup: 65534
    persistentVolume:
     storageClass: dhc-gp3
     size: 30Gi
    #podLabels for adding label for network policy
    retention: "30d"
    podLabels:
      i3.monitoring.app: prometheus
    global:
      # Adjust scrape_interval to 1m
      scrape_interval: 1m
      # Adjust scrape_timeout to 20s for scraping kube-system resources which may need > 10s to respond
      scrape_timeout: 20s


    ### BEGIN autoload all alert configmaps
    extraVolumeMounts:
      - name: alert-storage-volume
        mountPath: /etc/config/alerting_rules
        readOnly: true

    extraVolumes:
      - name: alert-storage-volume
        emptyDir: {}

    sidecarContainers:
      reloadAlerts:
        name: reload-alerts
        image: "registry-emea.app.corpintra.net/dockerhub/kiwigrid/k8s-sidecar:1.26.1"
        imagePullPolicy: IfNotPresent
        env:
          - name: METHOD
            value: WATCH
          - name: LABEL
            value: "prometheus_alert"
          - name: FOLDER
            value: "/alerts"
          - name: RESOURCE
            value: "configmap"
          # - name: NAMESPACE
          #   value: "{{ .Values.sidecar.dashboards.searchNamespace }}"
          - name: SKIP_TLS_VERIFY
            value: "true"
          # Adapt REQ_URL if you change prometheus.server.prefixURL
          - name: REQ_URL
            value: "http://127.0.0.1:9090/-/reload"
          - name: REQ_METHOD
            value: POST
        resources:
          limits:
            memory: "128Mi"
        volumeMounts:
        - name: alert-storage-volume
          mountPath: /alerts
  
  serverFiles:
    prometheus.yml:
      rule_files:
        - /etc/config/alerting_rules/*.yaml
        - /etc/config/recording_rules.yml
        - /etc/config/alerting_rules.yml
      ## Below two files are DEPRECATED will be removed from this default values file
        - /etc/config/rules
        - /etc/config/alerts
  
    ### END autoload all alert configmaps

  prometheus-pushgateway:
    enabled: true
    image:
      repository: registry-emea.app.corpintra.net/dockerhub/prom/pushgateway
    # Adjust securityContext for non-root
    securityContext:
      runAsUser: 65534
      fsGroup: 65534
    #podLabels for adding label for network policy
    podLabels:
      i3.monitoring.app: prometheus
            
    ingress:
      enabled: true
      path: /
      hosts:
        - metrics.dna-aws.app.corpintra.net
      annotations:
        traefik.frontend.rule.type: PathPrefix
        kubernetes.io/ingress.class: ingress-traefik
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        cert-manager.io/cluster-issuer: mercedes-benz-acme
        traefik.ingress.kubernetes.io/router.middlewares: default-redirect@kubernetescrd 
      tls:
        - hosts:
            - metrics.dna-aws.app.corpintra.net
          secretName: metrics-pg-tls
  # Disable default network policies of prometheus chart, we'll use our own more fine-grained network policies
  networkPolicy:
    enabled: true

# Adjust values of grafana Chart to run in DHC CaaS
grafana:
  enabled: true
  global:
    # -- Overrides the Docker registry globally for all images
    imageRegistry: registry-emea.app.corpintra.net/dockerhub
  deploymentStrategy:
    type: Recreate
  ingress:
    enabled: true
    # # To expose Grafana, override ingress with the following settings
    # enabled: true
    path: /
    hosts:
       - monitoring.dna-aws.app.corpintra.net
    annotations:
      traefik.frontend.rule.type: PathPrefix
      kubernetes.io/ingress.class: ingress-traefik
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: mercedes-benz-acme
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect@kubernetescrd 
    tls:
      - hosts:
          - monitoring.dna-aws.app.corpintra.net
        secretName: grafana-tls

  # if the Grafana URL uses a subpath like /grafana, ensure to set the following lines
  grafana.ini:
    server:
      domain: monitoring.dna-aws.app.corpintra.net
      root_url: https://monitoring.dna-aws.app.corpintra.net
      serve_from_sub_path: false
    smtp:
      enabled: true
      host: <path:kv/data/dna/kubernetesSecret/monitoring#mailhost>
      skip_verify: true
      from_address: <path:kv/data/dna/kubernetesSecret/monitoring#fromaddress>
      from_name: <path:kv/data/dna/kubernetesSecret/monitoring#fromname>
    auth.generic_oauth:
      enabled: true
      allow_sign_up: true
      auto_login: true
      team_ids:
      allowed_organizations:
      name: MB-SSO
      client_id: <path:kv/data/dna/kubernetesSecret/monitoring#client_id>
      client_secret: <path:kv/data/dna/kubernetesSecret/monitoring#client_secret>
      scopes: openid profile email offline_access
      auth_url: <path:kv/data/dna/kubernetesSecret/monitoring#auth_url>
      token_url: <path:kv/data/dna/kubernetesSecret/monitoring#token_url>
      api_url: https://monitoring.dna-aws.app.corpintra.net/userinfo
      use_pkce: true
      use_refresh_token: true     
      skip_org_role_sync: true

  ## Configure notifiers
  ## ref: http://docs.grafana.org/administration/provisioning/#alert-notification-channels
  ##
  notifiers:
   notifiers.yaml:
     notifiers:
     - name: DnADevAlerts
       type: email
       uid: DnADevAlerts-UID
       # either:
       org_id: 1
       # or
       #org_name: Main Org.
       is_default: true
       send_reminder: true
       frequency: 10h
       settings:
         addresses: <path:kv/data/dna/kubernetesSecret/monitoring#notifiers.addresses>
     delete_notifiers:

  # Enable dashboard sidecar
  # Grafana will watch configmaps and secrets inside the same namespace with the matching label
  sidecar:
    image:
      registry: registry-emea.app.corpintra.net
      repository: dockerhub/kiwigrid/k8s-sidecar
    dashboards:
      enabled: true
      label: grafana_dashboard
  initChownData:
    enabled: false

  # DHC CaaS forbids settings of container capabilities, so lets disable PodSecurityPolicy
  rbac:
    pspEnabled: false

  # Override default image dduportal/bats with one of ours
  testFramework:
    enabled: false

  # Override default image appropriate/curl with one of ours
  downloadDashboardsImage:
    repository: registry-emea.app.corpintra.net/i3-images/alpine
    tag: latest

  # # To set admin credentials for login:
  adminUser: <path:kv/data/dna/kubernetesSecret/monitoring#user>
  adminPassword: <path:kv/data/dna/kubernetesSecret/monitoring#password>

  # Default DataSource
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: "http://{{ .Release.Name }}-prometheus-server"
        isDefault: true
        basic_auth: false

