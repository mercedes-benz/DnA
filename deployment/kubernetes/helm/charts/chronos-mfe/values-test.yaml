namespace: test-dna-chronos
configJs: |
  window["chronos_INJECTED_ENVIRONMENT"]={
    CONTAINER_APP_URL: "https://dna-aws.app.corpintra.net",
    API_BASEURL: "https://dna-aws.app.corpintra.net/api",
    CHRONOS_API_BASEURL: "",
  };
replicaCount: 1
chronosbackend: http://chronos-be.dev-dna-chronos.svc.cluster.local:80
image:
  repository: registry-emea.app.corpintra.net/dnaplatform/chronos-mfe
  pullPolicy: IfNotPresent
  tag: '382'
imagePullSecrets:
  - name: imagepullsecret
nameOverride: ''
fullnameOverride: chronos-mfe
podSecurityContext:
  runAsUser: 1001
containerPort: 4000
service:
  type: ClusterIP
  port: 90
ingress:
  enabled: true
  className: test-ingress-intranet
  annotations:
    traefik.frontend.rule.type: PathPrefix
    kubernetes.io/ingress.class: test-ingress-intranet
    acme.cert-manager.io/http01-ingress-class: test-ingress-intranet
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: mercedes-benz-acme
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect@kubernetescrd
  hosts:
    - host: chronos.dna-aws.app.corpintra.net
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - chronos.dna-aws.app.corpintra.net
      secretName: chronos-tls-secret
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi
vaultInjector:
  enable: true
  annotations:
    vault.hashicorp.com/agent-inject: 'true'
    vault.hashicorp.com/role: 'dna_aws_staging_k8_role'
    vault.hashicorp.com/tls-skip-verify: 'true'
    vault.hashicorp.com/agent-image: registry-emea.app.corpintra.net/dnaplatform/vault-secret-auto-update:v1
    vault.hashicorp.com/agent-inject-command-envvar: sh /opt/restart_deployment.sh
    vault.hashicorp.com/template-static-secret-render-interval: 10s
    vault.hashicorp.com/agent-pre-populate-only: 'false'
    vault.hashicorp.com/agent-inject-secret-configjs: dna_aws_kv/staging/kubernetesSecret/chronosMFE
    vault.hashicorp.com/agent-inject-file-configjs: config.js
    vault.hashicorp.com/agent-inject-template-configjs: |
      {{- with secret "dna_aws_kv/staging/kubernetesSecret/chronosMFE" -}}
          window["CHRONOS_INJECTED_ENVIRONMENT"]={
          {{- range $k, $v := .Data.data }}
          {{- if or (eq $v "true") (eq $v "false") (regexMatch "^[0-9]+$" $v) }}
                  {{ $k }}:{{ $v }},
          {{ else }}
                  {{ $k }}:'{{ $v }}',
          {{- end }}
          {{- end }}
              };
      {{- end }}   
  saName: default
