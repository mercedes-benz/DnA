{{- if .Values.networkPolicy.enabled -}}
{{- $fullName := include "pgadmin.fullname" . -}}
apiVersion: {{ template "networkPolicy.apiVersion" . }}
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}
  namespace: {{ include "pgadmin.namespaceName" . }}
  labels:
    {{- include "pgadmin.labels" . | nindent 4 }}
spec:
  policyTypes:
    - Ingress
    - Egress
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pgadmin.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  ingress:
    {{- if .Values.networkPolicy.ingressRules.customRules }}
    {{- .Values.networkPolicy.ingressRules.customRules | toYaml | nindent 4 }}
    {{- end }}   
  egress:   
    {{- if .Values.networkPolicy.egressRules.customRules }}
    {{- .Values.networkPolicy.egressRules.customRules | toYaml | nindent 4 }}
    {{- end }}      
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-acme-http01-solver
  namespace: {{ include "pgadmin.namespaceName" . }}
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: 'true'
  ingress:
    - ports:
        - protocol: TCP
          port: 8089
    - from:
        - podSelector:
            matchLabels:
              app: traefik
          namespaceSelector:
            matchExpressions:
              - key: name
                operator: In
                values:
                  - ingress
  policyTypes:
    - Ingress
