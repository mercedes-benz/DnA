replicaCount: 2
envs: []
secret: []
image:
  repository: registry-emea.app.corpintra.net/dnaplatform/dss-backend
  pullPolicy: IfNotPresent
  tag: 1.0.11
imagePullSecrets: []
nameOverride: ''
fullnameOverride: dss-be
namespace: prod-dna-dss
serviceAccount:
  create: false
  annotations: {}
  name: ''
podAnnotations: {}
podSecurityContext:
  runAsUser: 1000
containerPort: 7777
securityContext: {}
service:
  type: ClusterIP
  port: 7777
ingress:
  enabled: false
  host: api.dss.dna.app.corpintra.net
  className: prod-ingress-intranet
  annotations:
    traefik.frontend.rule.type: PathPrefix
    kubernetes.io/ingress.class: prod-ingress-intranet
    acme.cert-manager.io/http01-ingress-class: prod-ingress-intranet
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: mercedes-benz-acme
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect@kubernetescrd
  hosts:
    - host: api.dss.dna.app.corpintra.net
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - api.dss.dna.app.corpintra.net
      secretName: api-dss-tls-secret
resources:
  requests:
    memory: 423Mi
    cpu: 2m
  limits:
    memory: 423Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetMemoryUtilizationPercentage: 70
nodeSelector: {}
tolerations: []
affinity: {}
vaultInjector:
  enable: true
  annotations:
    vault.hashicorp.com/agent-inject: 'true'
    vault.hashicorp.com/role: dna_aws_prod_k8_role
    vault.hashicorp.com/agent-pre-populate-only: 'true'
    vault.hashicorp.com/agent-inject-secret-envvar: dna_aws_kv/prod/kubernetesSecret/dssService
    vault.hashicorp.com/agent-inject-template-envvar: |
      {{- with secret "dna_aws_kv/prod/kubernetesSecret/dssService" -}}
        {{- range $k, $v := .Data.data }}
            export {{ $k }}="{{ $v }}"
        {{- end }}
      {{- end }}        
  saName: default
  jarName: dataiku-backend-lib-1.0.0-all.jar
podDisruptionBudget:
  enabled: true
  minAvailable: 50%
