name: Pull Docker Images

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: [ dot-enterprise-runner ]

    steps:
    # - name: cloning DNA public repo
    #   uses: actions/checkout@v3
    #   repository: https://github.com/mercedes-benz/DnA.git

    - name: Login to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    - name: Log in to Docker Registry
      run: |
        echo "${{ secrets.DOCKER_HUB_PASSWORD }}" | img login hub.docker.com -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

    - name: Log in to Docker Registry
      run: |
        img pull vardhandevalla/dataproduct-mfe-foss-release:3.1.0
        img ls 