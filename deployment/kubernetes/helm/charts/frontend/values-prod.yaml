              };
      {{- end }} 
      {{- with secret "dna_kv/prod/kubernetesSecret/datalakeMFE" -}}
          window["DATALAKE_INJECTED_ENVIRONMENT"]={
          {{- range $k, $v := .Data.data }}
          {{- if or (eq $v "true") (eq $v "false") (regexMatch "^[0-9]+$" $v) }}
                  {{ $k }}:{{ $v }},
          {{ else }}
                  {{ $k }}:'{{ $v }}',
          {{- end }}
          {{- end }}
              };
      {{- end }}
      {{- with secret "dna_kv/prod/kubernetesSecret/fabricMFE" -}}
