          DETECT_PROJECT_NAME: 'CodeServerBE'
          IS_OVERRIDE_REQUIRED: true
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          IS_REACT_APP: false
          CODE_FOLDER: 'packages/code-server'
          APP_VERSION_FILE_PATH: 'packages/code-server/code-server-lib/src/main/resources/application.yml'
          HELM_FOLDER: 'deployment/kubernetes/helm/charts/code-server-backend'
          YML_IMAGE_TAG_PATH: 'image.tag' 
