# -----------------------------------------------------------------------------
# Ingress Controller parameters
# -----------------------------------------------------------------------------

# Kong Ingress Controller's primary purpose is to satisfy Ingress resources
# created in k8s.  It uses CRDs for more fine grained control over routing and
# for Kong specific configuration.
ingressController:
  enabled: false

# If you want to specify resources, uncomment the following
# lines, adjust them as necessary, and remove the curly braces after 'resources:'.
resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 400Mi
    cpu: 400m

# Proxy container lifecycle hooks
# Ref: https://kubernetes.io/docs/concepts/containers/container-lifecycle-hooks/
lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "/bin/sleep 15 && kong quit"]

# Kong pod count.
# It has no effect when autoscaling.enabled is set to true
replicaCount: 2

# Annotation to be added to Kong pods
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"
  prometheus.io/port: "8100"

# Kong Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  maxUnavailable: "50%"

securityContext:
  runAsUser: 1000
extraResources:
 - |
    apiVersion: v1
    kind: Secret
    metadata:
      name: global-sap-saml
      namespace: {{ .Release.Namespace }}
    data:
      ca-root.pem: <path:kv/data/dna/kubernetesSecret/infraAPISAP#ca-root | base64encode>
      cert.pem: <path:kv/data/dna/kubernetesSecret/infraAPISAP#cert | base64encode>
      key.pem: <path:kv/data/dna/kubernetesSecret/infraAPISAP#key | base64encode>
      tls.crt: <path:kv/data/dna/kubernetesSecret/infraAPISAP#tls | base64encode>
    type: Opaque
 - |
    apiVersion: v1
    kind: Secret
    metadata:
      name: kong-gateway-secret
      namespace: {{ .Release.Namespace }}
    data:
      ONEAPI_GATEWAY_KEY: <path:kv/data/dna/kubernetesSecret/infraAPISAP#oneapi_key | base64encode>
      ONEAPI_GATEWAY_SECRET: <path:kv/data/dna/kubernetesSecret/infraAPISAP#oneapi_secret | base64encode>
    type: Opaque   