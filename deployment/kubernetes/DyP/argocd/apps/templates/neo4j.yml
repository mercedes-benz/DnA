apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: neo4j
  namespace: {{ .Values.namespace }}
  labels:
    name: service  
spec:
  destination:
    namespace: neo4j
    server: {{ .Values.server | squote }}
  source:
    path: deployment/kubernetes/helm/charts/neo4j
    repoURL: {{ .Values.repoURL | squote }}
    targetRevision: {{ .Values.branch }}
    helm:
      releaseName: neo4j-release
      valueFiles:
        - values-{{ .Values.env }}.yaml                 
  project: dna
{{- if .Values.enableSync }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
{{- end }}
