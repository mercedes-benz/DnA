appName: trino
namespace: test-dna-trino
accessRules:
  endpoint: http://trino-backend-service.trino.svc.cluster.local:7575/service/access
cert:
  certManager: mercedes-benz-acme
image:
  repository: registry-emea.app.corpintra.net/dnaplatform/trino-immuta/trino-immuta-v2
  pullPolicy: IfNotPresent
  tag: 419-v1
ingress:
  enabled: true
  host: trino.test.dna.app.corpintra.net
  annotations:
    traefik.frontend.rule.type: PathPrefix
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: mercedes-benz-acme
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect@kubernetescrd 
server:
  host: trino.test.dna.app.corpintra.net
  workers: 2
  node:
    environment: test
    dataDir: /data/trino
    pluginDir: /usr/lib/trino/plugin
  log:
    trino:
      level: INFO
  config:
    path: /etc/trino
    internalSharedSecret: <path:kv/data/dna/kubernetesSecret/trino#internalSharedSecret>
    http:
      port: 8080
    query:
      maxMemory: 4GB
      maxMemoryPerNode: 1GB
    memory:
      heapHeadroomPerNode: 1GB
  exchangeManager:
    name: filesystem
    baseDir: /tmp/trino-local-file-system-exchange-manager
  jvm:
    maxHeapSize: 8G
    gcMethod:
      type: UseG1GC
      g1:
        heapRegionSize: 32M
  autoscaling:
    enabled: false
    maxReplicas: 5
    targetCPUUtilizationPercentage: 50
additionalNodeProperties: {}
additionalJVMConfig: {}
additionalConfigProperties: {}
additionalLogProperties: {}
additionalExchangeManagerProperties: {}
additionalCatalogs: {}
env: []
initContainers: {}
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
service:
  type: ClusterIP
  port: 8080
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
serviceAccount:
  create: false
  name: ''
  annotations: {}
authentication:
  oidc:
    enabled: true
    issuer: https://sso-int.mercedes-benz.com
    authUrl: https://sso-int.mercedes-benz.com/as/authorization.oauth2
    tokenUrl: https://sso-int.mercedes-benz.com/as/token.oauth2
    jwksUrl: https://sso-int.mercedes-benz.com/pf/JWKS
    clientId: <path:kv/data/dna/kubernetesSecret/trino#clientId>
    clientSecret: <path:kv/data/dna/kubernetesSecret/trino#clientSecret>
    userInfoUrl: https://sso-int.mercedes-benz.com/idp/userinfo.openid
    scopes: openid
    claim: sub
  password:
    user: immuta
    bcryptPass: <path:kv/data/dna/kubernetesSecret/trino#bcryptPass>
hivemetastore:
  image: registry-emea.app.corpintra.net/dnaplatform/hivemetastore:1.0.1
  server:
    session:
      check_interval: 1h
      timeout: 2h
    operation:
      timeout: 2h
    thrift:
      http_timeout: 2h
  requests:
    memory: 8G
    cpu: 2
  limits:
    memory: 8G
    cpu: 2
  minio:
    host: my-release-minio.minio.svc.cluster.local:9000
    accessKey: <path:kv/data/dna/kubernetesSecret/trino#minio.accessKey>
    secretKey: <path:kv/data/dna/kubernetesSecret/trino#minio.secretKey>
    warehouseBucketName: datalake
  postgres:
    host: hive-db.trino.svc.cluster.local:64000
    db: hive
    user: hive
    password: <path:kv/data/dna/kubernetesSecret/trino#postgtres.password>
immuta:
  enabled: true
  name: immuta
  endpoint: <path:kv/data/dna/kubernetesSecret/trino#immuta.endpoint>
  apiKey: <path:kv/data/dna/kubernetesSecret/trino#immuta.apikey>
  listenerName: immuta-event-listener
  nonImmutaUserPermission: READ
