    #     uses: actions/checkout@v4

    #   - uses: dorny/paths-filter@v3.0.2
    #     id: filter
    #     with:
    #       filters: |
    #         package1: src/package1
    #         package2: src/package2
          
  select-service:
    name: 'Select Service to Deploy'
    runs-on: [road-runner, medium]
    permissions:
      pull-requests: read    
    steps:

      # For pull requests it's not necessary to checkout the code
      - name: checkout 
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v3

      - uses: dorny/paths-filter@v3.0.2
        id: filter
        with:
          filters: |
            code-server: packages/code-server
            chronos-mfe: packages/chronos-mfe

      - name: Debug
        run: |
          echo  "${{ steps.filter.outputs }}"
          echo  "${{ steps.filter.outputs.code-server }}"
          echo  "${{ steps.filter.outputs.chronos-mfe }}"

      - name: Code Server
        if: steps.filter.outputs.code-server == 'true'
        run: |
          echo  "Code-server Folder"

