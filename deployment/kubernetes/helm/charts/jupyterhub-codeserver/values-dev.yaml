    HTTP_PROXY : http://security-proxy.emea.svc.corpintra.net:3128/
    ftp_proxy : http://security-proxy.emea.svc.corpintra.net:3128/
    http_proxy : http://security-proxy.emea.svc.corpintra.net:3128/
