apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: dev-dna-airflowdb
  namespace: {{ .Values.namespace }}
  labels:
    name: db
spec:
  destination:
    namespace: dev-dna-airflow
    server: {{ .Values.server | squote }}
  source:
    path: deployment/kubernetes/DyP/i3/postgresql-helm
    repoURL: {{ .Values.repoURL | squote }}
    targetRevision: migration/aws-airflow
    plugin:
      name: argocd-vault-plugin-helm
      env:
        - name: HELM_ARGS
          {{- if ne .Values.env "prod" }}          
          value: -f values-airflow-db-dev.yaml
          {{ else }}
          value: -f values-airflow-db-{{ .Values.env }}.yaml
          {{- end }}          
  project: dev-dna
{{- if .Values.enableSync }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
{{- end }}
