---
fullnameOverride: loki
global:
  image:
    registry: registry-emea.app.corpintra.net/dockerhub  
networkPolicy:
  enabled: false         
loki:
  schemaConfig:
    configs:
      - from: 2024-04-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  ingester:
    chunk_encoding: snappy
    
  pattern_ingester:
    enabled: true
    
  tracing:
    enabled: true
  querier:
    max_concurrent: 4
  auth_enabled: false
  server:
    http_listen_port: 3100
    grpc_listen_port: 9095
    http_server_read_timeout: 600s
    http_server_write_timeout: 600s
    http_server_idle_timeout: 600s
    grpc_server_max_recv_msg_size: 26214400
    grpc_server_max_send_msg_size: 26214400
  limits_config:
    allow_structured_metadata: true
    ingestion_burst_size_mb: 36
    ingestion_rate_mb: 24
    max_cache_freshness_per_query: 10m
    max_query_series: 5000
    per_stream_rate_limit: 15MB
    per_stream_rate_limit_burst: 20MB
    query_timeout: 600s
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    retention_period: 2d
    split_queries_by_interval: 15m
    volume_enabled: true
    discover_log_levels: true


deploymentMode: Distributed

ingester:
  replicas: 3
  autoforget_unhealthy: true
  chunk_block_size: 262144
  chunk_encoding: zstd
  chunk_idle_period: 30m
  chunk_retain_period: 2h
  chunk_target_size: 1572864
  lifecycler:
    ring:
      kvstore:
        store: memberlist
      replication_factor: 2
  max_chunk_age: 2h
  wal:
    dir: /var/loki/wal
    enabled: true
  persistence:
    enabled: true
    claims:
      - name: data
        size: 10Gi    
  rolloutGroupPrefix: "loki"  
  addIngesterNamePrefix: true      

querier:
  replicas: 3
  maxUnavailable: 2
  max_concurrent: 40
  multi_tenant_queries_enabled: false
  query_ingesters_within: 2h

queryFrontend:
  replicas: 2
  maxUnavailable: 1
  compress_responses: true
  log_queries_longer_than: 5s
  max_outstanding_per_tenant: 4096

queryScheduler:
  replicas: 2

distributor:
  replicas: 3
  maxUnavailable: 2
  ring:
    kvstore:
      store: memberlist

compactor:
  replicas: 1
  retention_enabled: true
  working_directory: /var/loki/data/compactor
  retention_delete_delay: 48h # 2 days
  delete_request_store: s3

analytics:
  reporting_enabled: false

indexGateway:
  replicas: 2
  maxUnavailable: 1
  persistence:
    enabled: true

bloomPlanner:
  replicas: 0

bloomBuilder:
  replicas: 0

bloomGateway:
  replicas: 0

minio:
  enabled: true
  replicas: 1
  rootUser: <path:dna_aws_kv/data/dev/kubernetesSecret/loki#rootUser>
  rootPassword: <path:dna_aws_kv/data/dev/kubernetesSecret/loki#rootPassword>
  image:
    repository: registry-emea.app.corpintra.net/quaycache/minio/minio
  mcImage:
    repository: registry-emea.app.corpintra.net/quaycache/minio/mc
  persistence:
    size: 1200Gi

memcachedExporter:
  image:
    repository: registry-emea.app.corpintra.net/dockerhub/prom/memcached-exporter

memcached:
  image:
    repository: registry-emea.app.corpintra.net/dockerhub/memcached

backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

singleBinary:
  replicas: 0

query_range:
  align_queries_with_step: true
  cache_results: true
  max_retries: 5
  parallelise_shardable_queries: true

ruler:
  replicas: 1
  persistence:
    enabled: true
  extraVolumeMounts:
    - name: data
      mountPath: /etc/loki/rules
    - name: wal-rules
      mountPath: /var/loki/ruler-wal
  extraVolumes:
    - name: wal-rules
      emptyDir: {}

chunksCache:
  enabled: true
  defaultValidity: 1h
  writebackSizeLimit: 1GB

table_manager:
  retention_deletes_enabled: true
  retention_period: 2d
tracing:
  enabled: true

ingress:
  enabled: true
  ingressClassName: dev-ingress-intranet
  annotations: 
    traefik.frontend.rule.type: PathPrefix
    kubernetes.io/ingress.class: dev-ingress-intranet
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: mercedes-benz-acme
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect@kubernetescrd 
  hosts:
    - api.logs.dev.dna.app.corpintra.net
  path: /
  tls:
    - hosts:
        - api.logs.dev.dna.app.corpintra.net
      secretName: loki-gateway-tls