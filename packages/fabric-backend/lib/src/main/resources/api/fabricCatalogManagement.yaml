swagger: "2.0"
info:
  version: "1.0.0"
  title: "Fabric Lakehouse catalog management service"
host: "localhost:9292"
basePath: "/api/1.0"
consumes:
  - "application/json"
produces:
  - "application/json"
tags:
  - name: "solutions"
    description: "This service is used for fabric Lakehouse catalog maintenance."

schemes:
  - "https"

paths:
  /catalog/{workspaceId}/publish:
    post:
      tags:
        - "fabric-catalog-management"
      summary: "Publish a new catalog."
      description: "This endpoint will be used to publish a new fabric catalog."
      operationId: "publishCatalogRequest"
      parameters:
        - name: publishCatalogRequest
          in: body
          description: "The catalog to publish."
          required: true
          schema:
            $ref: "#/definitions/PublishCatalogRequestVO"
        - name: workspaceId
          in: path
          description: "The ID of the workspace."
          required: true
          type: "string"
      responses:
        201:
          description: "Returns message of success or failure "
          schema:
            $ref: "#/definitions/PublishCatalogResponseVO"
        400:
          description: "Bad Request"
          schema:
            $ref: "#/definitions/GenericMessage"
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"

    put:
      tags:
        - "fabric-catalog-management"
      summary: "update Published catalog."
      description: "This endpoint will be used to update published fabric catalog."
      operationId: "updatePublishedCatalogRequest"
      parameters:
        - name: updateCatalogRequest
          in: body
          description: "The catalog to publish."
          required: true
          schema:
            $ref: "#/definitions/PublishCatalogRequestVO"
        - name: workspaceId
          in: path
          description: "The ID of the workspace."
          required: true
          type: "string"
      responses:
        201:
          description: "Returns message of success or failure "
          schema:
            $ref: "#/definitions/PublishCatalogResponseVO"
        400:
          description: "Bad Request"
          schema:
            $ref: "#/definitions/GenericMessage"
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"



  /catalog/{workspaceId}/{serviceName}:
    get:
      tags:
        - "fabric-catalog-management"
      summary: "Get catalog by service name."
      description: "This endpoint will be used to retrieve a fabric catalog by its service name."
      operationId: "getCatalogByServiceName"
      parameters:
        - name: "workspaceId"
          in: "path"
          description: "The ID of the workspace."
          required: true
          type: "string"
        - name: "serviceName"
          in: "path"
          description: "The name of the service."
          required: true
          type: "string"
      responses:
        200:
          description: "Returns message of success or failure"
          schema:
            $ref: "#/definitions/PublishCatalogResponseVO"
        204:
          description: "Fetch complete, no content found."
        400:
          description: "Bad request."
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"
  /catalog/ddx/group-update/{ddxId}/{workspaceId}/{lakehouseId}:
    post:
      tags:
        - "fabric-catalog-management"
      summary: "update groups from ddx."
      description: "This endpoint will be used to update groups from ddx."
      operationId: "updateGroupsFromDDX"
      parameters:
        - name:   updateDDXGroupsRequest
          in: body
          description: "The groups update request from DDX."
          required: true
          schema:
            $ref: "#/definitions/updateDDXGroupsRequestVO"
        - name: ddxId
          in: path
          description: "The ID of DDX data product."
          required: true
          type: "string"
        - name: "workspaceId"
          in: path
          description: "The ID of the workspace."
          required: true
          type: "string"
        - name: lakehouseId
          in: path
          description: "The ID of Lakehouse."
          required: true
          type: "string"
      responses:
        201:
          description: "Returns message of success or failure "
          schema:
            $ref: "#/definitions/GenericMessage"
        400:
          description: "Bad Request"
          schema:
            $ref: "#/definitions/GenericMessage"
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"

  /catalog/ddx/fabric-lakehouses/objects:
    get:
      tags:
        - "fabric-catalog-management"
      summary: "get lakehouse objects."
      description: "This endpoint will be used to get lakehouse objects."
      operationId: "getLakehouseObjects"
      parameters:
        - name: workspaceId
          in: query
          description: "The ID of the workspace."
          required: true
          type: string
        - name: lakehouseId
          in: query
          description: "The ID of Lakehouse."
          required: true
          type: string
        - name: schemaName
          in: query
          description: "The name of schema."
          required: false
          type: string
      responses:
        201:
          description: "Returns message of success or failure "
          schema:
            $ref: "#/definitions/LakehouseObjectsResponseVO"
        400:
          description: "Bad Request"
          schema:
            $ref: "#/definitions/GenericMessage"
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"
  
  /catalog/ddx/get-groups-status/{ddxId}/{workspaceId}/{lakehouseId}:
    get:
      tags:
        - "fabric-catalog-management"
      summary: "get the groups status which are requested to add to the lakehouse."
      description: "This endpoint will return the status of groups requested to be added to a lakehouse."
      operationId: "getGroupsAssignmentStatus"
      parameters:
        - name: updateDDXGroupsRequest
          in: body
          description: "The groups name to get the status for."
          required: true
          schema:
            $ref: "#/definitions/updateDDXGroupsRequestVO"
        - name: ddxId
          in: path
          description: "The ID of DDX data product."
          required: true
          type: "string"
        - name: workspaceId
          in: path
          description: "The ID of the workspace."
          required: true
          type: "string"
        - name: lakehouseId
          in: path
          description: "The ID of Lakehouse."
          required: true
          type: "string"
      responses:
        200:
          description: "Returns list of group name and their status"
          schema:
            type: array
            items:
              $ref: "#/definitions/GroupStatusResponseVO"
        400:
          description: "Bad Request"
          schema:
            $ref: "#/definitions/GenericMessage"
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        404:
          description: "Workspace, Lakehouse, or Group not found"
          schema:
            $ref: "#/definitions/GenericMessage"
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"

  /catalog/databricks/mirrored-catalog:
    post:
      tags:
        - "fabric-catalog-management"
      summary: "Create Databricks Mirrored Catalog in Fabric central workspace."
      description: "This endpoint will provision a Databricks Mirrored Catalog hosted in a Fabric central workspace, backed by an ADLS Gen2 storage account, and grant permissions to create Fabric shortcuts to a DDX group."
      operationId: "createMirroredCatalog"
      parameters:
        - name: createMirroredCatalogRequest
          in: body
          description: "The mirrored catalog creation request."
          required: true
          schema:
            $ref: "#/definitions/CreateMirroredCatalogRequestVO"
      responses:
        200:
          description: "Returns mirrored catalog creation response"
          schema:
            $ref: "#/definitions/MirroredCatalogResponseVO"
        400:
          description: "Bad Request"
          schema:
            $ref: "#/definitions/MirroredCatalogErrorResponseVO"
        403:
          description: "Storage access denied"
          schema:
            $ref: "#/definitions/MirroredCatalogErrorResponseVO"
        404:
          description: "Databricks data product or DDX group not found"
          schema:
            $ref: "#/definitions/MirroredCatalogErrorResponseVO"
        401:
          description: "Request does not have sufficient credentials."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"
          schema:
            $ref: "#/definitions/MirroredCatalogErrorResponseVO"

  /catalog/databricks/mirrored-catalog/status:
    post:
      tags:
        - "fabric-catalog-management"
      summary: "Get Databricks Mirrored Catalog status."
      description: "This endpoint will query the status of mirrored catalog creation and group permission assignment, update the DB, and return the current status."
      operationId: "getMirroredCatalogStatus"
      parameters:
        - name: mirroredCatalogStatusRequest
          in: body
          description: "The mirrored catalog status request with correlation ID."
          required: true
          schema:
            $ref: "#/definitions/MirroredCatalogStatusRequestVO"
      responses:
        200:
          description: "Returns mirrored catalog status response"
          schema:
            $ref: "#/definitions/MirroredCatalogResponseVO"
        400:
          description: "Bad Request"
          schema:
            $ref: "#/definitions/MirroredCatalogErrorResponseVO"
        404:
          description: "Mirrored catalog record not found"
          schema:
            $ref: "#/definitions/MirroredCatalogErrorResponseVO"
        401:
          description: "Request does not have sufficient credentials."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"
          schema:
            $ref: "#/definitions/MirroredCatalogErrorResponseVO"

  /catalog/databricks/mirrored-catalog/update-status:
    put:
      tags:
        - "fabric-catalog-management"
      summary: "Update Databricks Mirrored Catalog status (Uilicious callback)."
      description: "This endpoint is called by Uilicious to update the status of mirrored catalog creation and group permission assignment."
      operationId: "updateMirroredCatalogStatus"
      parameters:
        - name: updateMirroredCatalogStatusRequest
          in: body
          description: "The status update payload from Uilicious."
          required: true
          schema:
            $ref: "#/definitions/UpdateMirroredCatalogStatusRequestVO"
      responses:
        200:
          description: "Returns updated mirrored catalog status"
          schema:
            $ref: "#/definitions/MirroredCatalogResponseVO"
        400:
          description: "Bad Request"
          schema:
            $ref: "#/definitions/MirroredCatalogErrorResponseVO"
        404:
          description: "Mirrored catalog record not found"
          schema:
            $ref: "#/definitions/MirroredCatalogErrorResponseVO"
        401:
          description: "Request does not have sufficient credentials."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"
          schema:
            $ref: "#/definitions/MirroredCatalogErrorResponseVO"

definitions:

  PublishCatalogRequestVO:
    type: object
    required:
      - metadata
      - workspaceId
      - mandatoryFields
      - owners
    properties:
      metadata:
        $ref: "#/definitions/FabricCatalogMetadataVO"
        required: true
      mandatoryFields:
        $ref: "#/definitions/MandatoryFieldsVO"
        required: true
      owners:
        type: array
        items:
          $ref: "#/definitions/CreatedByVO"
      sourceConfig:
        type: object
        properties:
          config:
            type: object
            properties:
              type:
                type: string

  FabricCatalogMetadataVO:
    type: object
    required:
      - serviceName
    properties:
      serviceName:
        type: string
        description: "Name of the service"
      serviceId:
        type: string
        description: "OpenMetadata service ID (optional)"
      databases:
        type: array
        description: "List of databases with metadata"
        items:
          $ref: "#/definitions/DatabaseMetadataVO"

  DatabaseMetadataVO:
    type: object
    required:
      - dbId
      - dbName
      - description
    properties:
      dbName:
        type: string
      dbId:
        type: string
      description:
        type: string
      schemas:
        type: array
        items:
          $ref: "#/definitions/SchemaMetadataVO"

  SchemaMetadataVO:
    type: object
    required:
      - schemaName
    properties:
      schemaName:
        type: string
      schemaId:
        type: string
      tables:
        type: array
        items:
          $ref: "#/definitions/TableMetadataVO"

  TableMetadataVO:
    type: object
    required:
      - tableName
    properties:
      tableName:
        type: string
      tableId:
        type: string
      columns:
        type: array
        items:
          $ref: "#/definitions/ColumnMetadataVO"

  ColumnMetadataVO:
    type: object
    required:
      - columnName
      - colType
    properties:
      columnId:
        type: string
      columnName:
        type: string
      colType:
        type: string
      colConstraint:
        type: string

  PublishCatalogResponseVO:
    type: object
    properties:
      data:
        $ref: "#/definitions/FabricCatalogMetadataDetailsVO"
      responses:
        $ref: "#/definitions/GenericMessage"

  MandatoryFieldsVO:
    type: object
    required:
      - divisions
      - department
      # - dataOrigin
      - leanIXId
      - isDocumentationUpdated
      # - isDataLakeAvailability
      # - isDataAsset
      - dataConfidentiality
      - tier
    properties:
      divisions:
        type: array
        items:
          type: string
          enum: ["Daimler Buses","Daimler Trucks","Mercedes-Benz Cars","Mercedes-Benz Mobility","Mercedes-Benz Vans"]
      department:
        type: string
        minLength: 1
      # dataOrigin:
      #   type: string
      #   enum: ["internal","external","mixed"]
      leanIXId:
        type: string
        minLength: 1
      isDocumentationUpdated:
        type: string
        enum: ["Yes","No"]
      # isDataLakeAvailability:
      #   type: string
      #   enum: ["Yes","No"]
#      isDataAsset:
#        type: string
#        enum: ["Yes","No"]
      dataConfidentiality:
        type: string
        enum: [public,confidential,secret,internal]
      tier:
        type: integer
        enum: [1,2]

  FabricCatalogMetadataDetailsVO:
    type: object
    properties:
      id:
        type: string
      metadata:
        $ref: "#/definitions/FabricCatalogMetadataVO"
      owners:
        type: array
        items:
          $ref: "#/definitions/CreatedByVO"
      mandatoryFields:
        $ref: "#/definitions/MandatoryFieldsVO"

  updateDDXGroupsRequestVO:
    type: object
    required:
      - groups
    properties:
      groups:
        type: array
        items:
          type: string
      type:
        type: string
        enum:
          - FABRIC_TO_FABRIC
        description: "Type identifier for DDX group update"

  LakehouseObjectsResponseVO:
    type: object
    properties:
      tables:
        type: array
        items:
          $ref: "#/definitions/LakehouseTableObjectVO"
      responseCode:
        type: string
        description: "Response code from the service"
      errorMessage:
        type: string
        description: "Error message if any error occurred"

  LakehouseTableObjectVO:
    type: object
    properties:
      name:
        type: string
      formatType:
        type: string
      type:
        type: string
      comments:
        type: string  
      columns:
        type: array
        items:
          $ref: "#/definitions/LakehouseColumnObjectVO"
  
  LakehouseColumnObjectVO:
    type: object
    properties:
      columnName:
        type: string
      dataType:
        type: string
      comment:
        type: string
      columnMaskingRule:
        type: string

  GroupStatusResponseVO:
    type: object
    properties:
      groupName:
        type: string
      status:
        type: string
      message:
        type: string
        description: "Error message if the group addition failed"

  LegalEntitiesResponseVO:
    type: object
    properties:
      legalName:
        type: string
      companyCode:
        type: string

  CreateMirroredCatalogRequestVO:
    type: object
    properties:
      dataProductName:
        type: string
        description: "Name of the data product"
      catalogName:
        type: string
        description: "Name of the Databricks catalog"
      schemaName:
        type: string
        description: "Name of the schema within the catalog"
      region:
        type: string
        description: "Region for the mirrored catalog"
      fullSchema:
        type: boolean
        description: "If true, mirror the full schema. If false, objects map is required."
      objects:
        type: object
        description: "Map of object names to their types (table or view). Required when fullSchema is false."
        additionalProperties:
          type: string
          enum:
            - table
            - view
      storageAccountUrl:
        type: string
        description: "ADLS Gen2 storage account URL"
      ddxGroup:
        type: string
        description: "DDX group name for permission assignment"
      ddxCorrelationId:
        type: string
        description: "Correlation ID for request tracking"

  MirroredCatalogResponseVO:
    type: object
    properties:
      ddxCorrelationId:
        type: string
        description: "Correlation ID for request tracking"
      databricksMirroredCatalog:
        $ref: "#/definitions/MirroredCatalogDataVO"
      grantPermissions:
        $ref: "#/definitions/GrantPermissionsVO"

  MirroredCatalogDataVO:
    type: object
    properties:
      mirroredCatalogId:
        type: string
        description: "Fabric object ID of the mirrored catalog"
      mirroredCatalogUrl:
        type: string
        description: "Fabric object URL of the mirrored catalog"
      catalog:
        type: string
        description: "Databricks catalog name"
      schema:
        type: string
        description: "Databricks schema name"
      objects:
        type: array
        items:
          type: string
        description: "List of mirrored object names"
      storageAccountUrl:
        type: string
        description: "ADLS Gen2 storage account URL"
      status:
        type: string
        description: "Status of the mirrored catalog creation"
        enum:
          - success
          - failure
          - already_exists

  GrantPermissionsVO:
    type: array
    items:
      type: string
      description: "DDX group name"

  MirroredCatalogErrorResponseVO:
    type: object
    properties:
      ddxCorrelationId:
        type: string
        description: "Correlation ID for request tracking"
      status:
        type: string
        description: "Always 'error' for error responses"
      errorCode:
        type: string
        description: "Error code identifying the type of error"
        enum:
          - INVALID_REQUEST
          - STORAGE_ACCESS_DENIED
          - DATABRICKS_DATAPRODUCT_NOT_FOUND
          - DDX_GROUP_NOT_FOUND
          - ALREADY_EXISTS
          - INTERNAL_ERROR
      message:
        type: string
        description: "Human-readable error message"

  MirroredCatalogStatusRequestVO:
    type: object
    required:
      - mirroredCatalogId
    properties:
      mirroredCatalogId:
        type: string
        description: "Mirrored catalog ID to look up the status"

  UpdateMirroredCatalogStatusRequestVO:
    type: object
    required:
      - mirroredCatalogId
      - ddxGroupDetails
    properties:
      mirroredCatalogId:
        type: string
        description: "Fabric catalog ID"
      mirroredCatalogUrl:
        type: string
        description: "Fabric object URL of the mirrored catalog"
      mirrorCatalogName:
        type: string
        description: "Mirror catalog name"
      catalogStatus:
        type: string
        description: "Status of catalog creation"
      catalogMessage:
        type: string
        description: "Message for catalog creation"
      ddxGroupDetails:
        type: array
        items:
          $ref: "#/definitions/DdxGroupDetailVO"

  DdxGroupDetailVO:
    type: object
    properties:
      groupName:
        type: string
        description: "DDX group name"
      groupAddedStatus:
        type: string
        description: "Status of group addition"
      grantPermissionStatus:
        type: string
        description: "Status of permission grant"
      message:
        type: string
        description: "Message for this group operation"
