# Adjust values of prometheus Chart to run in DHC CaaS
prometheus:
  enabled: true
  # See values of upstream chart for details: https://github.com/prometheus-community/helm-charts/tree/main/charts/prometheus
  alertmanager:
    image:
      repository: registry-emea.app.corpintra.net/dockerhub/prom/alertmanager
    # Adjust securityContext for non-root
    securityContext:
      runAsUser: 65534
      runAsNonRoot: true
  configmapReload:
    prometheus:
      image:
        repository: registry-emea.app.corpintra.net/ghcrcache/prometheus-operator/prometheus-config-reloader
    alertmanager:
      image:
        repository: registry-emea.app.corpintra.net/ghcrcache/prometheus-operator/prometheus-config-reloader
  initChownData:
    enabled: false
    image:
      repository: registry-emea.app.corpintra.net/dockerhub/busybox
  kube-state-metrics:
    enabled: false
    image:
      registry: registry-emea.app.corpintra.net
      repository: k8scache/kube-state-metrics/kube-state-metrics
    securityContext:
      runAsUser: 65534
      fsGroup: 65534
  # DHC CaaS already provides nodeExporter
  prometheus-node-exporter:
    enabled: false
  server:
    image:
      repository: registry-emea.app.corpintra.net/dockerhub/prom/prometheus
    extraArgs:
      # Limit persistent data size (experimental)
      storage.tsdb.retention.size: "10GB"
    # Adjust securityContext for non-root
    securityContext:
      runAsUser: 65534
      runAsNonRoot: true
      fsGroup: 65534
    persistentVolume:
     storageClass: dhc-gp3
     size: 25Gi
    #podLabels for adding label for network policy
    retention: "30d"
    podLabels:
      i3.monitoring.app: prometheus
    global:
      # Adjust scrape_interval to 1m
      scrape_interval: 1m
      # Adjust scrape_timeout to 20s for scraping kube-system resources which may need > 10s to respond
      scrape_timeout: 20s


    ### BEGIN autoload all alert configmaps
    extraVolumeMounts:
      - name: alert-storage-volume
        mountPath: /etc/config/alerting_rules
        readOnly: true

    extraVolumes:
      - name: alert-storage-volume
        emptyDir: {}

    sidecarContainers:
      reloadAlerts:
        name: reload-alerts
        image: "registry-emea.app.corpintra.net/dockerhub/kiwigrid/k8s-sidecar:0.1.151"
        imagePullPolicy: IfNotPresent
        env:
          - name: METHOD
            value: WATCH
          - name: LABEL
            value: "prometheus_alert"
          - name: FOLDER
            value: "/alerts"
          - name: RESOURCE
            value: "configmap"
          # - name: NAMESPACE
          #   value: "{{ .Values.sidecar.dashboards.searchNamespace }}"
          - name: SKIP_TLS_VERIFY
            value: "true"
          # Adapt REQ_URL if you change prometheus.server.prefixURL
          - name: REQ_URL
            value: "http://127.0.0.1:9090/-/reload"
          - name: REQ_METHOD
            value: POST
        resources:
          limits:
            memory: "128Mi"
        volumeMounts:
        - name: alert-storage-volume
          mountPath: /alerts
  
  serverFiles:
    # The following is copied from the upstream prometheus Helm chart.
    # Additions are marked with BEGIN/END CUSTOM
    prometheus.yml:
      rule_files:
        - /etc/config/alerting_rules/*.yaml
        - /etc/config/recording_rules.yml
        - /etc/config/alerting_rules.yml
      ## Below two files are DEPRECATED will be removed from this default values file
        - /etc/config/rules
        - /etc/config/alerts

      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets:
                - localhost:9090

        #Connecting Prometheus with minio for metric sharing
        - job_name: minio-job
          metrics_path: '/minio/v2/metrics/cluster'
          scrape_interval: 15s
          scheme: http
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          params:
            format: [ 'prometheus' ]
          static_configs:
            - targets: [ 'minio.minio.svc.cluster.local:80' ]
        - job_name: argocd
          metrics_path: /metrics
          params:
            format:
            - prometheus
          scheme: http
          scrape_interval: 5s
          static_configs:
          - targets:
            - agrocd-application-controller.argocd.svc.cluster.local:8082
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt 

        - job_name: cnpg	
          metrics_path: /metrics	
          params:	
            format:	
            - prometheus	
          scheme: http	
          scrape_interval: 5s	
          static_configs:	
          - targets:	
            - 192-168-129-123.cnpg-system.pod.cluster.local:9187	
          tls_config:	
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt  
        - job_name: jaeger	
          metrics_path: /metrics	
          params:	
            format:	
            - prometheus	
          scheme: http	
          scrape_interval: 5s	
          static_configs:	
          - targets:	
            - jaeger-query.i3-logging.svc.cluster.local:16687	
          tls_config:	
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt     
        - job_name: jupyterhub	
          metrics_path: /hub/metrics
          params:	
            format:	
            - prometheus	
          scheme: http	
          scrape_interval: 5s	
          static_configs:	
          - targets:	
            - cs-hub-hub.code-server.svc.cluster.local:8081	
          tls_config:	
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt                      

        # A scrape configuration for running Prometheus on a Kubernetes cluster.
        # This uses separate scrape configs for cluster components (i.e. API server, node)
        # and services to allow each to use different authentication configs.
        #
        # Kubernetes labels will be added as Prometheus labels on metrics via the
        # `labelmap` relabeling action.

        # Scrape config for API servers.
        #
        # Kubernetes exposes API servers as endpoints to the default/kubernetes
        # service so this uses `endpoints` role and uses relabelling to only keep
        # the endpoints associated with the default/kubernetes service using the
        # default named port `https`. This works for single API server deployments as
        # well as HA API server deployments.
        - job_name: 'kubernetes-apiservers'

          kubernetes_sd_configs:
            - role: endpoints

          # Default to scraping over https. If required, just disable this or change to
          # `http`.
          scheme: https

          # This TLS & bearer token file config is used to connect to the actual scrape
          # endpoints for cluster components. This is separate to discovery auth
          # configuration because discovery & scraping are two separate concerns in
          # Prometheus. The discovery auth config is automatic if Prometheus runs inside
          # the cluster. Otherwise, more config options have to be provided within the
          # <kubernetes_sd_config>.
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            # If your node certificates are self-signed or use a different CA to the
            # master CA, then disable certificate verification below. Note that
            # certificate verification is an integral part of a secure infrastructure
            # so this should only be disabled in a controlled environment. You can
            # disable certificate verification by uncommenting the line below.
            #
            insecure_skip_verify: true
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

          # Keep only the default/kubernetes service endpoints for the https port. This
          # will add targets for each API server which Kubernetes adds an endpoint to
          # the default/kubernetes service.
          relabel_configs:
            - source_labels: [ __meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name ]
              action: keep
              regex: default;kubernetes;https

        - job_name: 'kubernetes-nodes'

          # Default to scraping over https. If required, just disable this or change to
          # `http`.
          scheme: https

          # This TLS & bearer token file config is used to connect to the actual scrape
          # endpoints for cluster components. This is separate to discovery auth
          # configuration because discovery & scraping are two separate concerns in
          # Prometheus. The discovery auth config is automatic if Prometheus runs inside
          # the cluster. Otherwise, more config options have to be provided within the
          # <kubernetes_sd_config>.
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            # If your node certificates are self-signed or use a different CA to the
            # master CA, then disable certificate verification below. Note that
            # certificate verification is an integral part of a secure infrastructure
            # so this should only be disabled in a controlled environment. You can
            # disable certificate verification by uncommenting the line below.
            #
            insecure_skip_verify: true
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

          kubernetes_sd_configs:
            - role: node

          relabel_configs:
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - target_label: __address__
              replacement: kubernetes.default.svc:443
            - source_labels: [ __meta_kubernetes_node_name ]
              regex: (.+)
              target_label: __metrics_path__
              replacement: /api/v1/nodes/$1/proxy/metrics


        - job_name: 'kubernetes-nodes-cadvisor'

          # Default to scraping over https. If required, just disable this or change to
          # `http`.
          scheme: https

          # This TLS & bearer token file config is used to connect to the actual scrape
          # endpoints for cluster components. This is separate to discovery auth
          # configuration because discovery & scraping are two separate concerns in
          # Prometheus. The discovery auth config is automatic if Prometheus runs inside
          # the cluster. Otherwise, more config options have to be provided within the
          # <kubernetes_sd_config>.
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            # If your node certificates are self-signed or use a different CA to the
            # master CA, then disable certificate verification below. Note that
            # certificate verification is an integral part of a secure infrastructure
            # so this should only be disabled in a controlled environment. You can
            # disable certificate verification by uncommenting the line below.
            #
            insecure_skip_verify: true
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

          kubernetes_sd_configs:
            - role: node

          # This configuration will work only on kubelet 1.7.3+
          # As the scrape endpoints for cAdvisor have changed
          # if you are using older version you need to change the replacement to
          # replacement: /api/v1/nodes/$1:4194/proxy/metrics
          # more info here https://github.com/coreos/prometheus-operator/issues/633
          relabel_configs:
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - target_label: __address__
              replacement: kubernetes.default.svc:443
            - source_labels: [__meta_kubernetes_node_name]
              regex: (.+)
              target_label: __metrics_path__
              replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

        # Scrape config for service endpoints.
        #
        # The relabeling allows the actual service scrape endpoint to be configured
        # via the following annotations:
        #
        # * `prometheus.io/scrape`: Only scrape services that have a value of
        # `true`, except if `prometheus.io/scrape-slow` is set to `true` as well.
        # * `prometheus.io/scheme`: If the metrics endpoint is secured then you will need
        # to set this to `https` & most likely set the `tls_config` of the scrape config.
        # * `prometheus.io/path`: If the metrics path is not `/metrics` override this.
        # * `prometheus.io/port`: If the metrics are exposed on a different port to the
        # service then set this appropriately.
        # * `prometheus.io/param_<parameter>`: If the metrics endpoint uses parameters
        # then you can set any parameter
        - job_name: 'kubernetes-service-endpoints'

          # BEGIN CUSTOM
          # Provide cluster CA and bearer token for scraping kube-scheduler and kube-apiserver
          # on DHC CaaS 1.14.6.
          # insecure_skip_verify for other service endpoints using a custom CA
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            insecure_skip_verify: true
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          # END CUSTOM

          kubernetes_sd_configs:
            - role: endpoints

          relabel_configs:
            - source_labels: [ __meta_kubernetes_service_annotation_prometheus_io_scrape ]
              action: keep
              regex: true
            - source_labels: [ __meta_kubernetes_service_annotation_prometheus_io_scrape_slow ]
              action: drop
              regex: true
            - source_labels: [ __meta_kubernetes_service_annotation_prometheus_io_scheme ]
              action: replace
              target_label: __scheme__
              regex: (https?)
            - source_labels: [ __meta_kubernetes_service_annotation_prometheus_io_path ]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [ __address__, __meta_kubernetes_service_annotation_prometheus_io_port ]
              action: replace
              target_label: __address__
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $1:$2
            - action: labelmap
              regex: __meta_kubernetes_service_annotation_prometheus_io_param_(.+)
              replacement: __param_$1
            - action: labelmap
              regex: __meta_kubernetes_service_label_(.+)
            # BEGIN CUSTOM RELABELING: backward compatibility with i3-monitoring 4.x labels
            - source_labels: [ __meta_kubernetes_namespace ]
              action: replace
              #target_label: namespace
              target_label: kubernetes_namespace
            - source_labels: [ __meta_kubernetes_service_name ]
              action: replace
              #target_label: service
              target_label: kubernetes_name
            - source_labels: [ __meta_kubernetes_pod_node_name ]
              action: replace
              #target_label: node
              target_label: kubernetes_node
            # END CUSTOM RELABELING

            # BEGIN CUSTOM
            - source_labels: [ __meta_kubernetes_pod_host_ip ]
              separator: ;
              regex: (.*)
              target_label: kubernetes_node_ip
              replacement: $1
              action: replace
            # add pod labels
            - separator: ;
              regex: __meta_kubernetes_pod_label_(.+)
              replacement: $1
              action: labelmap
            - source_labels: [ __meta_kubernetes_pod_name ]
              separator: ;
              regex: (.*)
              target_label: kubernetes_pod_name
              replacement: $1
              action: replace
            # END CUSTOM

          # Scrape config for slow service endpoints; same as above, but with a larger
          # timeout and a larger interval
          #
          # The relabeling allows the actual service scrape endpoint to be configured
          # via the following annotations:
          #
          # * `prometheus.io/scrape-slow`: Only scrape services that have a value of `true`
          # * `prometheus.io/scheme`: If the metrics endpoint is secured then you will need
          # to set this to `https` & most likely set the `tls_config` of the scrape config.
          # * `prometheus.io/path`: If the metrics path is not `/metrics` override this.
          # * `prometheus.io/port`: If the metrics are exposed on a different port to the
          # service then set this appropriately.
          # * `prometheus.io/param_<parameter>`: If the metrics endpoint uses parameters
          # then you can set any parameter
        - job_name: 'kubernetes-service-endpoints-slow'

          # BEGIN CUSTOM
          # Provide cluster CA and bearer token for scraping kube-scheduler and kube-apiserver
          # on DHC CaaS 1.14.6.
          # insecure_skip_verify for other service endpoints using a custom CA
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            insecure_skip_verify: true
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          # END CUSTOM

          scrape_interval: 5m
          scrape_timeout: 30s

          kubernetes_sd_configs:
            - role: endpoints

          relabel_configs:
            - source_labels: [ __meta_kubernetes_service_annotation_prometheus_io_scrape_slow ]
              action: keep
              regex: true
            - source_labels: [ __meta_kubernetes_service_annotation_prometheus_io_scheme ]
              action: replace
              target_label: __scheme__
              regex: (https?)
            - source_labels: [ __meta_kubernetes_service_annotation_prometheus_io_path ]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [ __address__, __meta_kubernetes_service_annotation_prometheus_io_port ]
              action: replace
              target_label: __address__
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $1:$2
            - action: labelmap
              regex: __meta_kubernetes_service_annotation_prometheus_io_param_(.+)
              replacement: __param_$1
            - action: labelmap
              regex: __meta_kubernetes_service_label_(.+)
            # BEGIN CUSTOM RELABELING: backward compatibility with i3-monitoring 4.x labels
            - source_labels: [ __meta_kubernetes_namespace ]
              action: replace
              # target_label: namespace
              target_label: kubernetes_namespace
            - source_labels: [ __meta_kubernetes_service_name ]
              action: replace
              #target_label: service
              target_label: kubernetes_name
            - source_labels: [ __meta_kubernetes_pod_node_name ]
              action: replace
              #target_label: node
              target_label: kubernetes_node
            # END CUSTOM RELABELING

            # BEGIN CUSTOM
            - source_labels: [ __meta_kubernetes_pod_host_ip ]
              separator: ;
              regex: (.*)
              target_label: kubernetes_node_ip
              replacement: $1
              action: replace
            - separator: ;
              regex: __meta_kubernetes_pod_label_(.+)
              replacement: $1
              action: labelmap
            - source_labels: [ __meta_kubernetes_pod_name ]
              separator: ;
              regex: (.*)
              target_label: kubernetes_pod_name
              replacement: $1
              action: replace
            # END CUSTOM

        - job_name: 'prometheus-pushgateway'
          honor_labels: true

          kubernetes_sd_configs:
            - role: service

          relabel_configs:
            - source_labels: [ __meta_kubernetes_service_annotation_prometheus_io_probe ]
              action: keep
              regex: pushgateway

        # Example scrape config for probing services via the Blackbox Exporter.
        #
        # The relabeling allows the actual service scrape endpoint to be configured
        # via the following annotations:
        #
        # * `prometheus.io/probe`: Only probe services that have a value of `true`
        - job_name: 'kubernetes-services'

          metrics_path: /probe
          params:
            module: [ http_2xx ]
          # BEGIN CUSTOM
          tls_config:
            insecure_skip_verify: true
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          # END CUSTOM

          kubernetes_sd_configs:
            - role: service

          relabel_configs:
            - source_labels: [ __meta_kubernetes_service_annotation_prometheus_io_probe ]
              action: keep
              regex: true
            - source_labels: [ __address__ ]
              target_label: __param_target
            - target_label: __address__
              replacement: blackbox
            - source_labels: [ __param_target ]
              target_label: instance
            - action: labelmap
              regex: __meta_kubernetes_service_label_(.+)
            # BEGIN CUSTOM RELABELING: backward compatibility with i3-monitoring 4.x labels
            - source_labels: [ __meta_kubernetes_namespace ]
              #target_label: namespace
              target_label: kubernetes_namespace
            - source_labels: [ __meta_kubernetes_service_name ]
              #target_label: service
              target_label: kubernetes_name
            # END CUSTOM RELABELING

        # Example scrape config for pods
        #
        # The relabeling allows the actual pod scrape endpoint to be configured via the
        # following annotations:
        #
        # * `prometheus.io/scrape`: Only scrape pods that have a value of `true`,
        # except if `prometheus.io/scrape-slow` is set to `true` as well.
        # * `prometheus.io/scheme`: If the metrics endpoint is secured then you will need
        # to set this to `https` & most likely set the `tls_config` of the scrape config.
        # * `prometheus.io/path`: If the metrics path is not `/metrics` override this.
        # * `prometheus.io/port`: Scrape the pod on the indicated port instead of the default of `9102`.
        - job_name: 'kubernetes-pods'
          # BEGIN CUSTOM
          tls_config:
            insecure_skip_verify: true
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          # END CUSTOM
          kubernetes_sd_configs:
            - role: pod

          relabel_configs:
            - source_labels: [ __meta_kubernetes_pod_annotation_prometheus_io_scrape ]
              action: keep
              regex: true
            - source_labels: [ __meta_kubernetes_pod_annotation_prometheus_io_scrape_slow ]
              action: drop
              regex: true
            - source_labels: [ __meta_kubernetes_pod_annotation_prometheus_io_scheme ]
              action: replace
              regex: (https?)
              target_label: __scheme__
            - source_labels: [ __meta_kubernetes_pod_annotation_prometheus_io_path ]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [ __address__, __meta_kubernetes_pod_annotation_prometheus_io_port ]
              action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $1:$2
              target_label: __address__
            - action: labelmap
              regex: __meta_kubernetes_pod_annotation_prometheus_io_param_(.+)
              replacement: __param_$1
            - action: labelmap
              regex: __meta_kubernetes_pod_label_(.+)
            # BEGIN CUSTOM RELABELING: backward compatibility with i3-monitoring 4.x labels
            - source_labels: [ __meta_kubernetes_namespace ]
              action: replace
              #target_label: namespace
              target_label: kubernetes_namespace
            - source_labels: [ __meta_kubernetes_pod_name ]
              action: replace
              #target_label: pod
              target_label: kubernetes_pod_name
            # END CUSTOM RELABELING
            - source_labels: [ __meta_kubernetes_pod_phase ]
              regex: Pending|Succeeded|Failed|Completed
              action: drop
            # BEGIN CUSTOM
            - source_labels: [ __meta_kubernetes_pod_node_name ]
              target_label: node
            - source_labels: [ __meta_kubernetes_pod_ready ]
              target_label: ready
            - source_labels: [ __meta_kubernetes_pod_annotation_prometheus_io_scheme ]
              action: replace
              target_label: __scheme__
              regex: (https?)

          metric_relabel_configs:
            # ## cadvisor daemonset metrics relabeling to match kubelet cadvisor metrics
            # # copy labels starting with container_label_io_kubernetes_ to label without it
            # # e.g.: container_label_io_kubernetes_pod_name -> pod_name
            - action: labelmap
              regex: container_label_io_kubernetes_(.+)
            # copy container_label_io_kubernetes_pod_namespace -> namespace
            - action: labelmap
              regex: container_label_io_kubernetes_pod_(namespace)
            # copy node label to kubernetes_io_hostname
            - source_labels: [ node ]
              target_label: kubernetes_io_hostname
            ## end of cadvisor rewrites
            - source_labels: [ mountpoint ]
              regex: .*csi.*/(pvc-[a-f0-9-]{36})/(?:global)?mount
              replacement: $1
              target_label: pv_name
            # extract pv_name from kube-state-metrics series
            - source_labels: [ volumename ]
              action: replace
              regex: (.+)
              target_label: pv_name
            # extract pvc_name from kube-state-metrics series
            - source_labels: [ persistentvolumeclaim ]
              action: replace
              regex: (.+)
              target_label: pvc_name
          # END CUSTOM

          # Example Scrape config for pods which should be scraped slower. An useful example
          # would be stackriver-exporter which queries an API on every scrape of the pod
          #
          # The relabeling allows the actual pod scrape endpoint to be configured via the
          # following annotations:
          #
          # * `prometheus.io/scrape-slow`: Only scrape pods that have a value of `true`
          # * `prometheus.io/scheme`: If the metrics endpoint is secured then you will need
          # to set this to `https` & most likely set the `tls_config` of the scrape config.
          # * `prometheus.io/path`: If the metrics path is not `/metrics` override this.
          # * `prometheus.io/port`: Scrape the pod on the indicated port instead of the default of `9102`.
        - job_name: 'kubernetes-pods-slow'

          # BEGIN CUSTOM
          tls_config:
            insecure_skip_verify: true
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          # END CUSTOM

          scrape_interval: 5m
          scrape_timeout: 30s

          kubernetes_sd_configs:
            - role: pod

          relabel_configs:
            - source_labels: [ __meta_kubernetes_pod_annotation_prometheus_io_scrape_slow ]
              action: keep
              regex: true
            - source_labels: [ __meta_kubernetes_pod_annotation_prometheus_io_scheme ]
              action: replace
              regex: (https?)
              target_label: __scheme__
            - source_labels: [ __meta_kubernetes_pod_annotation_prometheus_io_path ]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [ __address__, __meta_kubernetes_pod_annotation_prometheus_io_port ]
              action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $1:$2
              target_label: __address__
            - action: labelmap
              regex: __meta_kubernetes_pod_annotation_prometheus_io_param_(.+)
              replacement: __param_$1
            - action: labelmap
              regex: __meta_kubernetes_pod_label_(.+)
            # BEGIN CUSTOM RELABELING: backward compatibility with i3-monitoring 4.x labels
            - source_labels: [ __meta_kubernetes_namespace ]
              action: replace
              #target_label: namespace
              target_label: kubernetes_namespace
            - source_labels: [ __meta_kubernetes_pod_name ]
              action: replace
              #target_label: pod
              target_label: kubernetes_pod_name
              # END CUSTOM RELABELING
            - source_labels: [ __meta_kubernetes_pod_phase ]
              regex: Pending|Succeeded|Failed|Completed
              action: drop
            # BEGIN CUSTOM
            - source_labels: [ __meta_kubernetes_pod_node_name ]
              target_label: node
            - source_labels: [ __meta_kubernetes_pod_ready ]
              target_label: ready
            - source_labels: [ __meta_kubernetes_pod_annotation_prometheus_io_scheme ]
              action: replace
              target_label: __scheme__
              regex: (https?)

          metric_relabel_configs:
            # ## cadvisor daemonset metrics relabeling to match kubelet cadvisor metrics
            # # copy labels starting with container_label_io_kubernetes_ to label without it
            # # e.g.: container_label_io_kubernetes_pod_name -> pod_name
            - action: labelmap
              regex: container_label_io_kubernetes_(.+)
            # copy container_label_io_kubernetes_pod_namespace -> namespace
            - action: labelmap
              regex: container_label_io_kubernetes_pod_(namespace)
            # copy node label to kubernetes_io_hostname
            - source_labels: [ node ]
              target_label: kubernetes_io_hostname
            ## end of cadvisor rewrites
            - source_labels: [ mountpoint ]
              regex: .*csi.*/(pvc-[a-f0-9-]{36})/(?:global)?mount
              replacement: $1
              target_label: pv_name
            # extract pv_name from kube-state-metrics series
            - source_labels: [ volumename ]
              action: replace
              regex: (.+)
              target_label: pv_name
            # extract pvc_name from kube-state-metrics series
            - source_labels: [ persistentvolumeclaim ]
              action: replace
              regex: (.+)
              target_label: pvc_name
          # END CUSTOM              
  ### END autoload all alert configmaps
  prometheus-pushgateway:
    enabled: true
    image:
      repository: registry-emea.app.corpintra.net/dockerhub/prom/pushgateway
    # Adjust securityContext for non-root
    securityContext:
      runAsUser: 65534
      fsGroup: 65534
    #podLabels for adding label for network policy
    podLabels:
      i3.monitoring.app: prometheus
            
    ingress:
      enabled: true
      path: /
      hosts:
        - <path:kv/data/dna/kubernetesSecret/monitoring#pushgateway.domain>
      annotations:
        traefik.frontend.rule.type: PathPrefix
        kubernetes.io/ingress.class: ingress-traefik
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        cert-manager.io/cluster-issuer: mercedes-benz-acme
        traefik.ingress.kubernetes.io/router.middlewares: default-redirect@kubernetescrd 
      tls:
        - hosts:
            - <path:kv/data/dna/kubernetesSecret/monitoring#pushgateway.domain>
          secretName: metrics-pg-tls
  # Disable default network policies of prometheus chart, we'll use our own more fine-grained network policies
  networkPolicy:
    enabled: true

# Adjust values of grafana Chart to run in DHC CaaS
grafana:
  enabled: true
  # See values of upstream chart for details: https://github.com/grafana/helm-charts/tree/main/charts/grafana
  image:
    registry: registry-emea.app.corpintra.net
    repository: dockerhub/grafana/grafana
    tag: "latest"
    pullSecrets: []

  deploymentStrategy:
    type: Recreate

  ingress:
    enabled: true
    # # To expose Grafana, override ingress with the following settings
    # enabled: true
    path: /
    hosts:
       - <path:kv/data/dna/kubernetesSecret/monitoring#grafana.domain>
    annotations:
      traefik.frontend.rule.type: PathPrefix
      kubernetes.io/ingress.class: ingress-traefik
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: mercedes-benz-acme
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect@kubernetescrd 
    tls:
      - hosts:
          - <path:kv/data/dna/kubernetesSecret/monitoring#grafana.domain>
        secretName: grafana-tls

  # if the Grafana URL uses a subpath like /grafana, ensure to set the following lines
  grafana.ini:
    server:
      domain: <path:kv/data/dna/kubernetesSecret/monitoring#grafana.domain>
      root_url: https://<path:kv/data/dna/kubernetesSecret/monitoring#grafana.domain>
      serve_from_sub_path: false
    smtp:
      enabled: true
      host: <path:kv/data/dna/kubernetesSecret/monitoring#mailhost>
      skip_verify: true
      from_address: <path:kv/data/dna/kubernetesSecret/monitoring#fromaddress>
      from_name: <path:kv/data/dna/kubernetesSecret/monitoring#fromname>
    auth.generic_oauth:
      enabled: true
      allow_sign_up: true
      auto_login: true
      team_ids:
      allowed_organizations:
      name: MB-SSO
      client_id: <path:kv/data/dna/kubernetesSecret/monitoring#client_id>
      client_secret: <path:kv/data/dna/kubernetesSecret/monitoring#client_secret>
      scopes: openid profile email offline_access
      auth_url: <path:kv/data/dna/kubernetesSecret/monitoring#auth_url>
      token_url: <path:kv/data/dna/kubernetesSecret/monitoring#token_url>
      api_url: https://<path:kv/data/dna/kubernetesSecret/monitoring#grafana.domain>/userinfo
      use_pkce: true
      use_refresh_token: true     
      skip_org_role_sync: true

  ## Configure notifiers
  ## ref: http://docs.grafana.org/administration/provisioning/#alert-notification-channels
  ##
  notifiers:
   notifiers.yaml:
     notifiers:
     - name: DnADevAlerts
       type: email
       uid: DnADevAlerts-UID
       # either:
       org_id: 1
       # or
       #org_name: Main Org.
       is_default: true
       send_reminder: true
       frequency: 10h
       settings:
         addresses: <path:kv/data/dna/kubernetesSecret/monitoring#notifiers.addresses>
     delete_notifiers:

  # Enable dashboard sidecar
  # Grafana will watch configmaps and secrets inside the same namespace with the matching label
  sidecar:
    image:
      registry: registry-emea.app.corpintra.net
      repository: dockerhub/kiwigrid/k8s-sidecar
    dashboards:
      enabled: true
      label: grafana_dashboard
  initChownData:
    enabled: false

  # DHC CaaS forbids settings of container capabilities, so lets disable PodSecurityPolicy
  rbac:
    pspEnabled: false

  # Override default image dduportal/bats with one of ours
  testFramework:
    enabled: false

  # Override default image appropriate/curl with one of ours
  downloadDashboardsImage:
    repository: registry-emea.app.corpintra.net/i3-images/alpine
    tag: latest

  # # To set admin credentials for login:
  adminUser: <path:kv/data/dna/kubernetesSecret/monitoring#user>
  adminPassword: <path:kv/data/dna/kubernetesSecret/monitoring#password>

  # Default DataSource
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: "http://{{ .Release.Name }}-prometheus-server"
        isDefault: true
        basic_auth: false

