apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: {{ .Values.env }}-dna-airflow
  namespace: {{ .Values.namespace }}
  labels:
    name: service
    env: {{ .Values.env }}
    project: dna
spec:
  destination:
    namespace: {{ .Values.env }}-dna-airflow
    server: {{ .Values.server | squote }}
  source:
    path: deployment/kubernetes/helm/charts/airflow
    repoURL: {{ .Values.repoURL | squote }}
    targetRevision: migration/aws-airflow
    plugin:
      name: argocd-vault-plugin-helm
      env:
        - name: HELM_ARGS
          value: -f values-{{ .Values.env }}.yaml
  project: {{ .Values.env }}-dna
{{- if .Values.enableSync }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
{{- end }}
