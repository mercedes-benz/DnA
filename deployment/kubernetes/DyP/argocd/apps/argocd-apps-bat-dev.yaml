kind: Application
apiVersion: argoproj.io/v1alpha1
metadata:
  name: dev-bat-root-app
  namespace: argocd
spec:
  project: 'bat-development'
  source:
    repoURL: 'https://git.i.mercedes-benz.com/BAT/bat-infra.git'
    targetRevision: 'infra/aws-migration'
    path: c52p219-dev/apps/mppl
    plugin:
      name: argocd-vault-plugin-helm
  destination:
    name: 'bat-development-c82p085'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
