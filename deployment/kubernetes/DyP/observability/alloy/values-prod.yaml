# -- Overrides the chart's name. Used to change the infix in the resource names.
nameOverride: null

# -- Overrides the chart's namespace.
namespaceOverride: observability

# -- Overrides the chart's computed fullname. Used to change the full prefix of
# resource names.
fullnameOverride: alloy

## Global properties for image pulling override the values defined under `image.registry` and `configReloader.image.registry`.
## If you want to override only one image registry, use the specific fields but if you want to override them all, use `global.image.registry`
global:
  image:
    # -- Global image registry to use if it needs to be overridden for some specific use cases (e.g local registries, custom images, ...)
    registry: ""

    # -- Optional set of global image pull secrets.
    pullSecrets: []

  # -- Security context to apply to the Grafana Alloy pod.
  podSecurityContext: 
    runAsUser: 473
    runAsGroup: 473  

crds:
  # -- Whether to install CRDs for monitoring.
  create: true

## Various Alloy settings. For backwards compatibility with the grafana-agent
## chart, this field may also be called "agent". Naming this field "agent" is
## deprecated and will be removed in a future release.
alloy:
  configMap:
    # -- Create a new ConfigMap for the config file.
    create: true
    # -- Content to assign to the new ConfigMap.  This is passed into `tpl` allowing for templating from values.
    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }

      prometheus.remote_write "mimir" {
        endpoint {
          url = "http://mimir-nginx.observability:80/api/v1/push"
          headers = {"X-Scope-OrgID" = "c82p160"}
        }
      }

      // service endpoints section
      discovery.kubernetes "endpoints" {
        role = "endpoints"
      }

      discovery.relabel "honor_service_annotations" {
        targets = discovery.kubernetes.endpoints.targets
        rule {
          source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_scrape"]
          regex = "(true)"
          action = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_path"]
          target_label = "__metrics_path__"
        }
        rule {
          source_labels = ["__address__", "__meta_kubernetes_service_annotation_prometheus_io_port"]
          regex = "([^:]+)(?::\\d+)?;(\\d+)"
          target_label = "__address__"
          replacement = "$1:$2"
        }
        rule {
          source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_scheme"]
          regex = "(https?)"
          target_label = "__scheme__"
          action = "replace"
        }
        rule {
          action = "replace"
          source_labels = ["__meta_kubernetes_service_name"]
          target_label = "service_name"
        }
        rule {
          action = "replace"
          source_labels = ["__meta_kubernetes_pod_host_ip"]
          target_label = "node_ip"
        }
        rule {
          action = "replace"
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label = "node_name"
        }
        rule {
          action = "replace"
          source_labels = ["__meta_kubernetes_namespace"]
          target_label = "Kubernetes_namespace"
        }
        rule {
          action = "replace"
          source_labels = ["__meta_kubernetes_exported_namespace"]
          target_label = "namespace"
        }
        rule {
          action = "replace"
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label = "pod_name"
        }
        rule {
          action = "replace"
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label = "pod_ip"
        }
        rule {
          action = "replace"
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label = "container_name"
        }
        rule {
          action = "replace"
          source_labels = ["__meta_kubernetes_pod_container_port_number"]
          target_label = "container_port"
        }
        rule {
          action = "replace"
          source_labels = ["__meta_kubernetes_service_label_app"]
          target_label = "app"
        }
      }

      prometheus.scrape "service_metrics" {
        targets = discovery.relabel.honor_service_annotations.output
        authorization {
          type = "Bearer"
          credentials_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        }
        tls_config {
          ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        }
        clustering {
          enabled = true
        }
        scrape_interval = "60s"
        forward_to = [prometheus.relabel.drop_unused_metrics.receiver]
      }

      prometheus.relabel "drop_unused_metrics" {
        // kube apiserver
        rule {
          source_labels = ["__name__"]
          regex = "^apiserver_.*_(total|bucket|count|sum)$"
          action = "drop"
        }
        // kube apiserver
        rule {
          source_labels = ["__name__"]
          regex = "etcd_request_duration_seconds_bucket|container_tasks_state"
          action = "drop"
        }
        // kube apiserver
        rule {
          source_labels = ["__name__"]
          regex = "rest_client_request_(duration|latency)_seconds_(bucket|count|sum)"
          action = "drop"
        }
        // kube apiserver
        rule {
          source_labels = ["__name__"]
          regex = "rest_client_rate_limiter_duration_seconds_.*"
          action = "drop"
        }
        // etcd
        rule {
          source_labels = ["__name__"]
          regex = "grpc_server_handled_total"
          action = "drop"
        }
        forward_to = [prometheus.relabel.add_cluster_labels.receiver]
      }

      //Node Section
      discovery.kubernetes "nodes" {
        role = "node"
      }

      // scrape nodes
      prometheus.scrape "node_metrics" {
        targets = discovery.kubernetes.nodes.targets
        authorization {
          type = "Bearer"
          credentials_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        }
        tls_config {
          ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        }
        clustering {
          enabled = true
        }
        scheme = "https"
        scrape_interval = "60s"
        forward_to = [prometheus.relabel.add_cluster_labels.receiver]
      }

      //Pod Section
      //Discover pods
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // To discover pods with required annotaions set on the pods
      discovery.relabel "honor_pod_scrape_annotations" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
          regex = "(true)"
          action = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
          target_label = "__metrics_path__"
          regex = "(.+)"
          replacement = "$1"
        }
        rule {
          source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
          target_label = "__address__"
          regex = "([^:]+)(?::\\d+)?;(\\d+)"
          replacement = "$1:$2"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scheme"]
          target_label = "__scheme__"
          regex = "(https?)"
          action = "replace"
        }
      }

      discovery.relabel "honor_pod_annotations" {
        targets = discovery.relabel.honor_pod_scrape_annotations.output
        rule {
          action = "replace"
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label = "node_name"
        }
        rule {
          action = "replace"
          source_labels = ["__meta_kubernetes_pod_host_ip"]
          target_label = "node_ip"
        }
        rule {
          action = "replace"
          source_labels = ["__meta_kubernetes_namespace"]
          target_label = "Kubernetes_namespace"
        }
        rule {
          action = "replace"
          source_labels = ["__meta_kubernetes_exported_namespace"]
          target_label = "namespace"
        }
        rule {
          action = "replace"
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label = "pod_name"
        }
        rule {
          action = "replace"
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label = "pod_ip"
        }
        rule {
          action = "replace"
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label = "container_name"
        }
        rule {
          action = "replace"
          source_labels = ["__meta_kubernetes_pod_container_port_number"]
          target_label = "container_port"
        }
        rule {
          action = "replace"
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label = "app"
        }
      }

      prometheus.scrape "pods" {
        targets    = discovery.relabel.honor_pod_annotations.output
        clustering {
          enabled = true
        }
        scrape_interval = "60s"
        forward_to = [prometheus.relabel.drop_unused_pod_metrics.receiver]
      }

      prometheus.relabel "drop_unused_pod_metrics" {
        rule {
          source_labels = ["__name__"]
          action = "drop"
          regex = "goldpinger_peers_response_time_s.*"
        }
        rule {
          source_labels = ["__name__"]
          action = "drop"
          regex = "prometheus_fanout_latency_bucket"
        }
        rule {
          source_labels = ["app"]
          action = "drop"
          regex = "kube-state-metrics"
        }
        rule {
          source_labels = ["__name__"]
          action = "drop"
          regex = "go_.*"
        }
        rule {
          source_labels = ["__name__"]
          action = "drop"
          regex = "node_sockstat.*"
        }
        rule {
          source_labels = ["__name__"]
          action = "drop"
          regex = "node_timex.*"
        }
        rule {
          source_labels = ["__name__"]
          action = "drop"
          regex = "node_softnet.*"
        }
        forward_to = [prometheus.relabel.add_cluster_labels.receiver]
      }

      //KSM
      discovery.relabel "ksm" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          regex = "kube-state-metrics"
          action = "keep"
        }
      }

      prometheus.scrape "ksm" {
        targets    = discovery.relabel.ksm.output
        clustering {
          enabled = true
        }
        scrape_interval = "60s"
        forward_to = [prometheus.relabel.drop_unused_ksm_metrics.receiver]
      }

      prometheus.relabel "drop_unused_ksm_metrics" {
        rule {
          source_labels = ["__name__"]
          regex = "(kube_cronjob_next_schedule_time|kube_cronjob_spec_suspend|kube_daemonset_status_current_number_scheduled|kube_daemonset_status_desired_number_scheduled|kube_daemonset_status_number_misscheduled|kube_daemonset_status_number_ready|kube_deployment_created|kube_deployment_metadata_generation|kube_deployment_spec_replicas|kube_deployment_status_observed_generation|kube_deployment_status_replicas|kube_deployment_status_replicas_available|kube_deployment_status_replicas_unavailable|kube_deployment_status_replicas_updated|kube_job_status_active|kube_job_status_failed|kube_job_status_succeeded|kube_mutatingwebhookconfiguration_info|kube_namespace_created|kube_namespace_status_phase|kube_node_info|kube_node_labels|kube_node_spec_taint|kube_node_spec_unschedulable|kube_node_status_allocatable|kube_node_status_capacity|kube_node_status_condition|kube_persistentvolumeclaim_status_phase|kube_persistentvolumeclaim_info|kube_pod_container_info|kube_pod_container_resource_limits|kube_pod_container_resource_requests|kube_pod_container_status_last_terminated_reason|kube_pod_container_status_restarts_total|kube_pod_container_status_running|kube_pod_container_status_terminated|kube_pod_container_status_waiting|kube_poddisruptionbudget_status_pod_disruptions_allowed|kube_pod_info|kube_pod_labels|kube_pod_status_phase|kube_pod_status_ready|kuberhealthy_check|kube_service_status_load_balancer_ingress|kube_statefulset_metadata_generation|kube_statefulset_replicas|kube_statefulset_status_current_revision|kube_statefulset_status_observed_generation|kube_statefulset_status_replicas|kube_statefulset_status_replicas_ready|kube_statefulset_status_replicas_updated|kube_statefulset_status_update_revision|kube_validatingwebhookconfiguration_info|kube_volumeattachment_info|kube_volumeattachment_spec_source_persistentvolume|kube_volumeattachment_status_attached)"
          action = "keep"
        }
        forward_to = [prometheus.relabel.add_cluster_labels.receiver]
      }

      //cadvisor section
      discovery.relabel "metrics_cadvisor" {
          targets = discovery.kubernetes.nodes.targets
          rule {
            action = "replace"
            target_label = "__address__"
            replacement = "kubernetes.default.svc.cluster.local:443"
          }
          rule {
            source_labels = ["__meta_kubernetes_node_name"]
            regex = "(.+)"
            action = "replace"
            replacement = "/api/v1/nodes/${1}/proxy/metrics/cadvisor"
            target_label = "__metrics_path__"
          }
      }

      prometheus.scrape "cadvisor" {
        scheme = "https"
        tls_config {
            server_name = "kubernetes"
            ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            insecure_skip_verify = false
        }
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        targets = discovery.relabel.metrics_cadvisor.output
        scrape_interval = "60s"
        clustering {
          enabled = true
        }
        forward_to = [prometheus.relabel.drop_unused_cadvisor_metrics.receiver]
      }

      prometheus.relabel "drop_unused_cadvisor_metrics" {
        rule {
          source_labels = ["__name__"]
          regex = "(container_blkio.*)"
          action = "drop"
        }
        forward_to = [prometheus.relabel.add_cluster_labels.receiver]
      }

      prometheus.relabel "add_cluster_labels" {
        forward_to = [prometheus.remote_write.mimir.receiver]
        rule {
          source_labels =  ["__address__"]
          target_label = "cluster"
          replacement = "c82p160"
          action = "replace"
        }
        rule {
          source_labels = ["__name__"]
          regex = "^apiserver_.*_(total|bucket|count|sum)$"
          action = "drop"
        }
        // kube apiserver
        rule {
          source_labels = ["__name__"]
          regex = "etcd_request_duration_seconds_bucket|container_tasks_state"
          action = "drop"
        }
        // kube apiserver
        rule {
          source_labels = ["__name__"]
          regex = "rest_client_request_(duration|latency)_seconds_(bucket|count|sum)"
          action = "drop"
        }
        // kube apiserver
        rule {
          source_labels = ["__name__"]
          regex = "rest_client_rate_limiter_duration_seconds_.*"
          action = "drop"
        }
        // etcd
        rule {
          source_labels = ["__name__"]
          regex = "grpc_server_handled_total"
          action = "drop"
        }
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki-gateway/loki/api/v1/push"
          headers = {"X-Scope-OrgID" = "c82p160"}
        }
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex        = "caas-system|kube-system|caas-crossplane-system"
          action       = "drop"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          action = "replace"
          target_label = "namespace"
          replacement = "$1"
        }
        rule {
          action = "replace"
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label = "pod"
        }
        rule {
          action = "replace"
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_id"]
          action = "replace"
          target_label = "container_runtime"
          regex = "^(\\S+):\\/\\/.+$"
          replacement = "$1"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          action = "replace"
          target_label = "app"
        }
      }

      // Kubernetes pod logs source
      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.kubernetes_logs.receiver]
        clustering {
          enabled = true
        }
      }

      // Processing for Kubernetes pod logs
      loki.process "kubernetes_logs" {
        stage.cri {}
        stage.decolorize {}
        stage.drop {
          expression  = ".*debug.*"
          longer_than = "1MB"
        }
        forward_to = [loki.write.loki.receiver]
      }

      // Kubernetes events source
      loki.source.kubernetes_events "kubernetes_events" {
        forward_to = [loki.process.exclude_namespaces.receiver]
      }

      loki.process "exclude_namespaces" {
        stage.match {
          selector = "{namespace=~\"kube-system|caas-system|caas-crossplane-system\"}"
          action   = "drop"
        }
        forward_to = [loki.write.loki.receiver]
      }  

      //otlp
      otelcol.receiver.otlp "default" {
        grpc {}
        http {}

        output {
          traces = [otelcol.connector.spanlogs.default.input, otelcol.exporter.otlp.default.input]
        }
      }

      // Separate Zipkin receiver
      otelcol.receiver.zipkin "default" {
        endpoint = "0.0.0.0:9411"
        output {
          traces = [
            otelcol.connector.spanlogs.default.input,
            otelcol.exporter.otlp.default.input,
          ]
        }
      }

      otelcol.connector.spanlogs "default" {
        roots = true
        span_attributes = ["http.method", "http.target"]
        output {
          logs = [otelcol.exporter.loki.default.input]
        }
      }

      otelcol.exporter.loki "default" {
        forward_to = [loki.write.loki.receiver]
      }

      otelcol.exporter.otlp "default" {
        client {
            endpoint = "http://tempo-distributor.observability.svc.cluster.local:4317"
            tls {
                insecure             = true
                insecure_skip_verify = true
            }
        }
      }

    # -- Name of existing ConfigMap to use. Used when create is false.
    name: null
    # -- Key in ConfigMap to get config from.
    key: null

  clustering:
    # -- Deploy Alloy in a cluster to allow for load distribution.
    enabled: false

    # -- Name for the Alloy cluster. Used for differentiating between clusters.
    name: ""

    # -- Name for the port used for clustering, useful if running inside an Istio Mesh
    portName: http

  # -- Minimum stability level of components and behavior to enable. Must be
  # one of "experimental", "public-preview", or "generally-available".
  stabilityLevel: "generally-available"

  # -- Path to where Grafana Alloy stores data (for example, the Write-Ahead Log).
  # By default, data is lost between reboots.
  storagePath: /tmp/alloy

  # -- Address to listen for traffic on. 0.0.0.0 exposes the UI to other
  # containers.
  listenAddr: 0.0.0.0

  # -- Port to listen for traffic on.
  listenPort: 12345

  # -- Scheme is needed for readiness probes. If enabling tls in your configs, set to "HTTPS"
  listenScheme: HTTP

  # --  Base path where the UI is exposed.
  uiPathPrefix: /

  # -- Enables sending Grafana Labs anonymous usage stats to help improve Grafana
  # Alloy.
  enableReporting: true

  # -- Extra environment variables to pass to the Alloy container.
  extraEnv: []

  # -- Maps all the keys on a ConfigMap or Secret as environment variables. https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.24/#envfromsource-v1-core
  envFrom: []

  # -- Extra args to pass to `alloy run`: https://grafana.com/docs/alloy/latest/reference/cli/run/
  extraArgs: []

  # -- Extra ports to expose on the Alloy container.
  extraPorts: 
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP  
    - name: zipkin
      port: 9411
      targetPort: 9411
      protocol: TCP       
  # - name: "faro"
  #   port: 12347
  #   targetPort: 12347
  #   protocol: "TCP"
  #   appProtocol: "h2c"

  # -- Host aliases to add to the Alloy container.
  hostAliases: []
  # - ip: "20.21.22.23"
  #   hostnames:
  #     - "company.grafana.net"

  mounts:
    # -- Mount /var/log from the host into the container for log collection.
    varlog: false
    # -- Mount /var/lib/docker/containers from the host into the container for log
    # collection.
    dockercontainers: false

    # -- Extra volume mounts to add into the Grafana Alloy container. Does not
    # affect the watch container.
    extra: []

  # -- Security context to apply to the Grafana Alloy container.
  securityContext: {}

  # -- Resource requests and limits to apply to the Grafana Alloy container.
  resources: 
    requests:
      memory: "8Gi"
    limits:
      cpu: "700m"
      memory: "15Gi"

  # -- Set lifecycle hooks for the Grafana Alloy container.
  lifecycle: {}
    # preStop:
    #   exec:
    #     command:
    #     - /bin/sleep
    #     - "10"

  # -- Set livenessProbe for the Grafana Alloy container.
  livenessProbe: {}

  # -- Resource requests and limits to apply to the Grafana Alloy container.
  resources: 
    requests:
      memory: "10Gi"
    limits:
      cpu: "700m"
      memory: "18Gi"

  # -- Set lifecycle hooks for the Grafana Alloy container.
  lifecycle: {}
    # preStop:
    #   exec:
    #     command:
    #     - /bin/sleep
    #     - "10"

image:
  # -- Grafana Alloy image registry (defaults to docker.io)
  registry: "registry-emea.app.corpintra.net/dockerhub"
  # -- Grafana Alloy image repository.
  repository: grafana/alloy
  # -- (string) Grafana Alloy image tag. When empty, the Chart's appVersion is
  # used.
  tag: null
  # -- Grafana Alloy image's SHA256 digest (either in format "sha256:XYZ" or "XYZ"). When set, will override `image.tag`.
  digest: null
  # -- Grafana Alloy image pull policy.
  pullPolicy: IfNotPresent
  # -- Optional set of image pull secrets.
  pullSecrets: []

rbac:
  # -- Whether to create RBAC resources for Alloy.
  create: true
  # -- Additional rules to add to the ClusterRole
  extraClusterRoleRules:
    - apiGroups: [""]
      resources: ["nodes", "nodes/metrics", "nodes/proxy"]
      verbs: ["get", "list", "watch"]
    - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
      verbs: ["get"]

serviceAccount:
  # -- Whether to create a service account for the Grafana Alloy deployment.
  create: true
  # -- Additional labels to add to the created service account.
  additionalLabels: {}
  # -- Annotations to add to the created service account.
  annotations: {}
  # -- The name of the existing service account to use when
  # serviceAccount.create is false.
  name: null
  # Whether the Alloy pod should automatically mount the service account token.
  automountServiceAccountToken: true

# Options for the extra controller used for config reloading.
configReloader:
  # -- Enables automatically reloading when the Alloy config changes.
  enabled: true
  image:
    # -- Config reloader image registry (defaults to docker.io)
    registry: "registry-emea.app.corpintra.net/ghcrcache"
    # -- Repository to get config reloader image from.
    repository: prometheus-operator/prometheus-config-reloader
    # -- Tag of image to use for config reloading.
    tag: v0.81.0
    # -- SHA256 digest of image to use for config reloading (either in format "sha256:XYZ" or "XYZ"). When set, will override `configReloader.image.tag`
    digest: ""
  # -- Override the args passed to the container.
  customArgs: []
  # -- Resource requests and limits to apply to the config reloader container.
  resources:
    requests:
      cpu: "161m"
      memory: "872Mi"
  # -- Security context to apply to the Grafana configReloader container.
  securityContext: {}

controller:
  # -- Type of controller to use for deploying Grafana Alloy in the cluster.
  # Must be one of 'daemonset', 'deployment', or 'statefulset'.
  type: 'statefulset'

  # -- Number of pods to deploy. Ignored when controller.type is 'daemonset'.
  replicas: 3

  # -- Annotations to add to controller.
  extraAnnotations: {}

  # -- Whether to deploy pods in parallel. Only used when controller.type is
  # 'statefulset'.
  parallelRollout: true

  # -- How many additional seconds to wait before considering a pod ready.
  minReadySeconds: 10

  # -- Configures Pods to use the host network. When set to true, the ports that will be used must be specified.
  hostNetwork: false

  # -- Configures Pods to use the host PID namespace.
  hostPID: false

  # -- Configures the DNS policy for the pod. https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-s-dns-policy
  dnsPolicy: ClusterFirst

  # -- Termination grace period in seconds for the Grafana Alloy pods.
  # The default value used by Kubernetes if unspecifed is 30 seconds.
  terminationGracePeriodSeconds: null

  # -- Update strategy for updating deployed Pods.
  updateStrategy: {}

  # -- nodeSelector to apply to Grafana Alloy pods.
  nodeSelector: {}

  # -- Tolerations to apply to Grafana Alloy pods.
  tolerations: []

  # -- Topology Spread Constraints to apply to Grafana Alloy pods.
  topologySpreadConstraints: []

  # -- priorityClassName to apply to Grafana Alloy pods.
  priorityClassName: ''

  # -- Extra pod annotations to add.
  podAnnotations: {}

  # -- Extra pod labels to add.
  podLabels: {}

  # -- PodDisruptionBudget configuration.
  podDisruptionBudget:
    # -- Whether to create a PodDisruptionBudget for the controller.
    enabled: false
    # -- Minimum number of pods that must be available during a disruption.
    # Note: Only one of minAvailable or maxUnavailable should be set.
    minAvailable: null
    # -- Maximum number of pods that can be unavailable during a disruption.
    # Note: Only one of minAvailable or maxUnavailable should be set.
    maxUnavailable: null

  # -- Whether to enable automatic deletion of stale PVCs due to a scale down operation, when controller.type is 'statefulset'.
  enableStatefulSetAutoDeletePVC: false

  autoscaling:
    # -- Creates a HorizontalPodAutoscaler for controller type deployment.
    # Deprecated: Please use controller.autoscaling.horizontal instead
    enabled: false
    # -- The lower limit for the number of replicas to which the autoscaler can scale down.
    minReplicas: 1
    # -- The upper limit for the number of replicas to which the autoscaler can scale up.
    maxReplicas: 5
    # -- Average CPU utilization across all relevant pods, a percentage of the requested value of the resource for the pods. Setting `targetCPUUtilizationPercentage` to 0 will disable CPU scaling.
    targetCPUUtilizationPercentage: 0
    # -- Average Memory utilization across all relevant pods, a percentage of the requested value of the resource for the pods. Setting `targetMemoryUtilizationPercentage` to 0 will disable Memory scaling.
    targetMemoryUtilizationPercentage: 80

    scaleDown:
      # -- List of policies to determine the scale-down behavior.
      policies: []
        # - type: Pods
        #   value: 4
        #   periodSeconds: 60
      # -- Determines which of the provided scaling-down policies to apply if multiple are specified.
      selectPolicy: Max
      # -- The duration that the autoscaling mechanism should look back on to make decisions about scaling down.
      stabilizationWindowSeconds: 300

    scaleUp:
      # -- List of policies to determine the scale-up behavior.
      policies: []
        # - type: Pods
        #   value: 4
        #   periodSeconds: 60
      # -- Determines which of the provided scaling-up policies to apply if multiple are specified.
      selectPolicy: Max
      # -- The duration that the autoscaling mechanism should look back on to make decisions about scaling up.
      stabilizationWindowSeconds: 0

    # -- Configures the Horizontal Pod Autoscaler for the controller.
    horizontal:
      # -- Enables the Horizontal Pod Autoscaler for the controller.
      enabled: false

      # -- The lower limit for the number of replicas to which the autoscaler can scale down.
      minReplicas: 1
      # -- The upper limit for the number of replicas to which the autoscaler can scale up.
      maxReplicas: 5
      # -- Average CPU utilization across all relevant pods, a percentage of the requested value of the resource for the pods. Setting `targetCPUUtilizationPercentage` to 0 will disable CPU scaling.
      targetCPUUtilizationPercentage: 0
      # -- Average Memory utilization across all relevant pods, a percentage of the requested value of the resource for the pods. Setting `targetMemoryUtilizationPercentage` to 0 will disable Memory scaling.
      targetMemoryUtilizationPercentage: 80

      scaleDown:
        # -- List of policies to determine the scale-down behavior.
        policies: []
          # - type: Pods
          #   value: 4
          #   periodSeconds: 60
        # -- Determines which of the provided scaling-down policies to apply if multiple are specified.
        selectPolicy: Max
        # -- The duration that the autoscaling mechanism should look back on to make decisions about scaling down.
        stabilizationWindowSeconds: 300

      scaleUp:
        # -- List of policies to determine the scale-up behavior.
        policies: []
          # - type: Pods
          #   value: 4
          #   periodSeconds: 60
        # -- Determines which of the provided scaling-up policies to apply if multiple are specified.
        selectPolicy: Max
        # -- The duration that the autoscaling mechanism should look back on to make decisions about scaling up.
        stabilizationWindowSeconds: 0
    # -- Configures the Vertical Pod Autoscaler for the controller.
    vertical:
      # -- Enables the Vertical Pod Autoscaler for the controller.
      enabled: false

      # -- List of recommenders to use for the Vertical Pod Autoscaler.
      # Recommenders are responsible for generating recommendation for the object.
      # List should be empty (then the default recommender will generate the recommendation)
      # or contain exactly one recommender.
      recommenders: []
      # recommenders:
      # - name: custom-recommender-performance

      # -- Configures the resource policy for the Vertical Pod Autoscaler.
      resourcePolicy:
        # -- Configures the container policies for the Vertical Pod Autoscaler.
        containerPolicies:
        - containerName: alloy
          # -- The controlled resources for the Vertical Pod Autoscaler.
          controlledResources:
          - cpu
          - memory
          # -- The controlled values for the Vertical Pod Autoscaler. Needs to be either RequestsOnly or RequestsAndLimits.
          controlledValues: "RequestsAndLimits"
          # -- The maximum allowed values for the pods.
          maxAllowed: {}
          # cpu: 200m
          # memory: 100Mi
          # -- Defines the min allowed resources for the pod
          minAllowed: {}
          # cpu: 200m
          # memory: 100Mi

      # -- Configures the update policy for the Vertical Pod Autoscaler.
      updatePolicy:
        # -- Specifies minimal number of replicas which need to be alive for VPA Updater to attempt pod eviction
        # minReplicas: 1
        # -- Specifies whether recommended updates are applied when a Pod is started and whether recommended updates
        # are applied during the life of a Pod. Possible values are "Off", "Initial", "Recreate", and "Auto".
        # updateMode: Auto

  # -- Affinity configuration for pods.
  affinity: {}

  volumes:
    # -- Extra volumes to add to the Grafana Alloy pod.
    extra: []

  # -- volumeClaimTemplates to add when controller.type is 'statefulset'.
  volumeClaimTemplates: []

  ## -- Additional init containers to run.
  ## ref: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
  ##
  initContainers: []

  # -- Additional containers to run alongside the Alloy container and initContainers.
  extraContainers: []

service:
  # -- Creates a Service for the controller's pods.
  enabled: true
  # -- Service type
  type: ClusterIP
  # -- NodePort port. Only takes effect when `service.type: NodePort`
  nodePort: 31128
  # -- Cluster IP, can be set to None, empty "" or an IP address
  clusterIP: ''
  # -- Value for internal traffic policy. 'Cluster' or 'Local'
  internalTrafficPolicy: Cluster
  annotations: {}
    # cloud.google.com/load-balancer-type: Internal

serviceMonitor:
  enabled: false
  # -- Additional labels for the service monitor.
  additionalLabels: {}
  # -- Scrape interval. If not set, the Prometheus default scrape interval is used.
  interval: ""
  # -- MetricRelabelConfigs to apply to samples after scraping, but before ingestion.
  # ref: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api.md#relabelconfig
  metricRelabelings: []
  # - action: keep
  #   regex: 'kube_(daemonset|deployment|pod|namespace|node|statefulset).+'
  #   sourceLabels: [__name__]

  # -- Customize tls parameters for the service monitor
  tlsConfig: {}

  # -- RelabelConfigs to apply to samples before scraping
  # ref: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api.md#relabelconfig
  relabelings: []
  # - sourceLabels: [__meta_kubernetes_pod_node_name]
  #   separator: ;
  #   regex: ^(.*)$
  #   targetLabel: nodename
  #   replacement: $1
  #   action: replace
ingress:
  # -- Enables ingress for Alloy (Faro port)
  enabled: false
  # For Kubernetes >= 1.18 you should specify the ingress-controller via the field ingressClassName
  # See https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/#specifying-the-class-of-an-ingress
  # ingressClassName: nginx
  # Values can be templated
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  labels: {}
  path: /
  faroPort: 12347

  # pathType is only for k8s >= 1.1=
  pathType: Prefix

  hosts:
    - chart-example.local
  ## Extra paths to prepend to every host configuration. This is useful when working with annotation based services.
  extraPaths: []
  # - path: /*
  #   backend:
  #     serviceName: ssl-redirect
  #     servicePort: use-annotation
  ## Or for k8s > 1.19
  # - path: /*
  #   pathType: Prefix
  #   backend:
  #     service:
  #       name: ssl-redirect
  #       port:
  #         name: use-annotation

  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Extra k8s manifests to deploy
extraObjects: []
# - apiVersion: v1
#   kind: Secret
#   metadata:
#     name: grafana-cloud
#   stringData:
#     PROMETHEUS_HOST: 'https://prometheus-us-central1.grafana.net/api/prom/push'
#     PROMETHEUS_USERNAME: '123456'
