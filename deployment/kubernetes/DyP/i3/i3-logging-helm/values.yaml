
# The default values of the subchart already meet the requirements for DHC CaaS
fluent-bit:
  enabled: true

  # the labels are required by OpenSearch networkPolicy to enable access to OpenSearch
  labels:
    i3-logging-opensearch-master-transport-client: "true"
  podLabels:
    i3-logging-opensearch-master-transport-client: "true"

  kind: DaemonSet 

  image:
    repository: registry-emea.app.corpintra.net/dockerhub/fluent/fluent-bit
    pullPolicy: IfNotPresent

  podSecurityPolicy:
    create: false

  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 0

  securityContext:
    runAsUser: 1000
    runAsGroup: 0

  service:
    type: ClusterIP
    port: 2020
    labels: { }
    # nodePort: 30020
    annotations: { }
    #   prometheus.io/path: "/api/v1/metrics/prometheus"
    #   prometheus.io/port: "2020"
    #   prometheus.io/scrape: "true"
  
  daemonSetVolumeMounts:
    #https://github.com/kubernetes/kubernetes/issues/53022
    - name: user-host-logs
      subPath: pods
      mountPath: /var/log/pods
      readOnly: true
    - name: user-host-logs
      mountPath: /var/log/containers
      subPath: containers
      readOnly: true
    - mountPath: /db
      name: db-volume
    
  daemonSetVolumes:
    - name: user-host-logs
      persistentVolumeClaim:
        claimName: i3-logging-user-host-logs-claim
    - name: db-volume
      emptyDir:
        sizeLimit: 500Mi

  # Info is the default log level of fluent-bit. Please note, that on setting logLevel to "DEBUG", fluent-bit puts multiple logs per second to stdout, therefore creating high cpu usage
  logLevel: info

  ## https://docs.fluentbit.io/manual/administration/configuring-fluent-bit/classic-mode/configuration-file
  config:
    service: |
      [SERVICE]
          Daemon Off
          Flush 1
          Log_Level {{ .Values.logLevel }}
          Parsers_File parsers.conf
          Parsers_File custom_parsers.conf
          HTTP_Server On
          HTTP_Listen 0.0.0.0
          HTTP_Port {{ .Values.service.port }}
          Health_Check On

    ## See documentation/INPUT.md
    ## https://docs.fluentbit.io/manual/pipeline/inputs
    inputs: |
      # Input type tail is enabled by default, since this is the expected input mode on DHC CaaS. 
      # see: https://pages.git.i.mercedes-benz.com/DHC/CaaS/docs/technical-guide/logging/user-host-logs
      @INCLUDE input_tail.conf

      # Input for opentelemetry. Opentelemetry endpoint is exposed at port 4318.
      # @INCLUDE input_opentelemetry.conf

    ## See documentation/FILTER.md
    ## https://docs.fluentbit.io/manual/pipeline/filters
    filters: |
      # Kubernetes plugin is inactive by default. Uncomment to enable
      @INCLUDE filter_kubernetes.conf

      # Map env variables to log entry
      @INCLUDE filter_add_to_log_from_env.conf

      # Enable filtering of DHC CaaS Kubernetes api server audit logs. Comment to disable.
      # If disabled, you need to enable extraFilters to avoid Opensearch index errors. See /documentation/FILTER.md for hints.
      @INCLUDE filter_excludePlatformAuditLogs.conf

      # Enable filtering of DHC CaaS Nodes kubelet logs. Comment to disable
      @INCLUDE filter_excludePlatformKubeletLogs.conf

      # Enable filtering of all container logs within namespace 'kube-system'. Comment to disable
      @INCLUDE filter_excludeK8sSystemLogs.conf

    ## By default, write logs to OpenSearch.
    ## https://docs.fluentbit.io/manual/pipeline/outputs
    outputs: |
      @INCLUDE output_opensearch.conf

    # extra files, which are included in config above
    extraFiles:
      input_tail.conf: |
        # for explainations, see https://docs.fluentbit.io/manual/input/tail
        [INPUT]
            Name             tail
            Path             /var/log/containers/*.log
            multiline.parser  docker, cri
            Tag              kube.*
            Refresh_Interval 5
            Mem_Buf_Limit    5MB
            Skip_Long_Lines  On
            Read_from_Head false
            db      /db/tail.db
      
      input_opentelemetry.conf: |
        # for explainations, see https://docs.fluentbit.io/manual/v/dev-2.2/pipeline/inputs/opentelemetry
        [INPUT]
            name opentelemetry
            listen 127.0.0.1
            port 4318

      filter_add_to_log_from_env.conf: |
        [FILTER]
            Name record_modifier
            Match *
            Record HOSTNAME ${HOSTNAME}

      filter_kubernetes.conf: |
        [FILTER]
            Name                kubernetes
            Match               kube.*
            Kube_Tag_Prefix     kube.var.log.containers.
            Kube_URL            https://kubernetes.default.svc:443
            Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
            #
            # When enabled, it checks if the `log` field content is a JSON string map, if so,
            # it append the map fields as part of the log structure.
            Merge_Log           On
            #
            # When Merge_Log is enabled, the filter tries to assume the log field from the
            # incoming message is a JSON string message and make a structured representation of it
            # at the same level of the log field in the map. Now if Merge_Log_Key is set (a string name),
            # all the new structured fields taken from the original log content are inserted under the new key.
            #Merge_Log_Key       ""
            #
            # If On, enable the use of monitoring for a pod annotation of
            # fluentbit.io/parser: parser_name. parser_name must be the name
            # of a parser contained within parsers.conf
            K8S-Logging.Parser  Off
            #
            # If true, enable the use of monitoring for a pod annotation of
            # fluentbit.io/exclude: true. If present, discard logs from that pod.
            K8S-Logging.Exclude On

      filter_excludePlatformAuditLogs.conf: |
        [FILTER]
            Name                grep
            Match               k8s_audit_sys_user
            Exclude             kind Event

      filter_excludePlatformKubeletLogs.conf: |
        [FILTER]
            Name                grep
            Match               systemd_sys_kubelet
            Exclude             HOSTNAME .*

      filter_excludeK8sSystemLogs.conf: |
        # Since nested fields are not support by grep filter, we use lift with prefix `k8s_resource_` and then filter linear index name
        # see https://docs.fluentbit.io/manual/pipeline/filters/grep#nested-fields-example
        [FILTER]
            Name                modify
            Condition           Key_Exists  kubernetes
            Copy                kubernetes  k8s_resources
            Match_Regex         ^(k8s|kube\.var\.log\.containers).*$

        [FILTER]
            Name                nest
            Operation           lift
            Match_Regex         ^(k8s|kube\.var\.log\.containers).*$
            Nested_under        k8s_resources
            Add_prefix          k8s_resource_

        [FILTER]
            Name                grep
            Match_Regex         ^(k8s|kube\.var\.log\.containers).*$
            Exclude             k8s_resource_namespace_name .*kube-system.*

      output_opensearch.conf: |
        [OUTPUT]
          Name  opensearch
          Match *
          Host  i3-logging-opensearch-master
          Port  9200
          Logstash_Format On
          Retry_Limit 2
          Suppress_Type_Name On
          Time_Key @flb-timestamp
          Replace_Dots On
          Logstash_Prefix kubernetes_cluster

opensearch-dashboards:
  enabled: true
  image:
    repository: "registry-emea.app.corpintra.net/dockerhub/opensearchproject/opensearch-dashboards"
    # override image tag, which is .Chart.AppVersion from upstream opensearch-dashboards helm chart by default
    # if you change this, you also must change opensearchDashboardVersion in i3-opensearch-config
    tag: "2.17.1"

  # the label is required by OpenSearch networkPolicy to enable access to OpenSearch
  labels:
    i3-logging-opensearch-master-transport-client: "true"

  # We use lifecycle to delete securityDashboard plugin and create the search index and search filters on opensearch-dashboards startup.
  lifecycle:
    postStart:
      exec:
        command:
          - bash
          - -c
          - |
            #!/bin/bash
            /usr/share/opensearch-dashboards/bin/opensearch-dashboards-plugin remove securityDashboards
            
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  securityContext:
    runAsUser: 1000

  opensearchHosts: http://i3-logging-opensearch-master:9200

  extraEnvs: 
    # Defines the opensearch-dashboards url path prefix. Should match with server.basePath in opensearch-dashboards.config.opensearch_dashboards.yml
    #- name: SERVER_BASEPATH
    #  value: /logging
    - name: DISABLE_SECURITY_DASHBOARDS_PLUGIN
      value: "true"


  config:
    opensearch_dashboards.yml: |
      logging:
        quiet: true
      # Should match environment variable SERVER_BASEPATH in opensearch-dashboards.extraEnvs 
      # Also set rewriteBasePath to true and adapt OSD_URL in opensearch-dashboards.lifecycle.postStart.exec.command
      # server:
      #  basePath: /logging
      #  rewriteBasePath: true


  extraInitContainers: [ ]

  extraContainers: [ ]

  extraVolumes: [ ]

opensearch:
  enabled: true

  # Provide custom masterService to match with fluent-bit output.host
  masterService: "i3-logging-opensearch-master"

  image:
    repository: "registry-emea.app.corpintra.net/dockerhub/opensearchproject/opensearch"

  securityContext:
    runAsUser: 1000

  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000

  resources:
    requests:
      cpu: "500m"
      memory: "100Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

  sysctl:
    enabled: false

  # Provide custom clusterName for consistent resource naming of all components
  clusterName: i3-logging-opensearch

  labels:
    i3-logging-opensearch-master-transport-client: "true"

  config:
    log4j2.properties: |
      status = info

      appender.console.type = Console
      appender.console.name = console

      rootLogger.level = info
      rootLogger.appenderRef.console.ref = console

    opensearch.yml: |
      cluster.name: opensearch-cluster
      # Bind to all interfaces because we don't know what IP address Docker will assign to us.
      network.host: 0.0.0.0
      plugins.security.disabled: true

  networkPolicy:
    create: true

  securityConfig:
    enabled: false
  persistence:
    enableInitChown: false

i3-opensearch-config:
  # Apply i3 specific configuration such as ISM policy
  enabled: true

  # Opensearch Hosts to apply the policy to. Supports comma seperated values.
  opensearchHosts: "http://i3-logging-opensearch-master:9200"

  # Opensearch Dashboards to apply the policy to.Supports comma seperated values.
  opensearchDashboardHosts: "http://i3-logging-opensearch-dashboards:5601"

  # Opensearch dashboard version
  opensearchDashboardVersion: "2.17.1"
  
  # Apply Index management policy
  ism:
    enabled: true

  # Apply i3-access anomaly detector to Opensearch dashboards.
  i3AccessAnomaly:
    enabled: false
    
  # Apply reusable saved objects.Global tenent is used by default
  savedObjectApi:
    enabled: false

    # Path of saved objects api
    path: "/api/saved_objects/_import"

    # Additional url parameters.
    #eg ?param1=val1&param2=val2
    additionalUrlParams: "?overwrite=true"

    # List your configmaps 
    # Case 1
    # If you added your ndjson to savedobjects folder those will be installed automatically. 
    # or Case 2
    # Create your configmaps! Your configmaps will be instaled after your ndjson in savedobjects folder. List your external configmaps in additionalConfigMapNames.
    # Your configmap needs to be in the same namespace as the namespace where you installed i3-logging
    # apiVersion: v1
    # kind: ConfigMap
    # metadata:
    #   name: replaceMeWithANameForYourConfigmap
    # data:
    #   replaceMeWithANameForYourSavedObject: |
    #     <value>
    #
    # then in the fild below add those names
    #
    # additionalConfigMapNames:
    #   - replaceMeWithANameForYourConfigmap
    additionalConfigMapNames: []