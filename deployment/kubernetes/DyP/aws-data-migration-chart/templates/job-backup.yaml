---
{{- if .Values.backupJob.enabled }}
{{- $apiUrl :=  .Values.storageCredentials.apiUrl }}
{{- $bucketName := .Values.storageCredentials.bucketName }}
{{- $path := .Values.storageCredentials.path }}
{{- range $index,$pvc := .Values.backupJob.backupPvc }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $pvc.pvcName }}-bk-job
  namespace: {{ $pvc.namespace | quote }}
spec:
  template:
    spec:
      initContainers:
      - name: init-container
        image: registry-emea.app.corpintra.net/dockerhub/restic/restic:latest
        args:
          - init
        env:
          - name: RESTIC_REPOSITORY
            value: "{{ $apiUrl }}/{{ $bucketName }}/{{ $path }}"
          - name: RESTIC_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ $pvc.pvcName }}
                key: resticKey
                optional: false
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: {{ $pvc.pvcName }}
                key: accessKeyId
                optional: false
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: {{ $pvc.pvcName }}
                key: secretAccessKey
                optional: false          
      containers:
      - name: restic
        image: registry-emea.app.corpintra.net/dockerhub/restic/restic:latest
        workingDir: {{ $pvc.backupPath }}
        args:
          - backup
          - --host
          - kubernetes  # set a consistent hostname to avoid restic rescans
          - .           # use workingDir to set path
        env:
          - name: RESTIC_REPOSITORY
            value: "{{ $apiUrl }}/{{ $bucketName }}/{{ $path }}"
          - name: RESTIC_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ $pvc.pvcName }}
                key: resticKey
                optional: false
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: {{ $pvc.pvcName }}
                key: accessKeyId
                optional: false
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: {{ $pvc.pvcName }}
                key: secretAccessKey
                optional: false
        volumeMounts:
          - name: backupdata
            mountPath: {{ $pvc.backupPath }}
            readOnly: true
          - name: backupdata
            mountPath: /.cache
      volumes:
        - name: backupdata
          persistentVolumeClaim:
            claimName: {{ $pvc.pvcName }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000                
      restartPolicy: OnFailure
---
{{- end }}
{{- end }}