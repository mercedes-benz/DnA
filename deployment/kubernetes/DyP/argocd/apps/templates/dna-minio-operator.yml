{{- if ne .Values.env "test" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: minio-operator
  namespace: {{ .Values.namespace }}
  labels:
    name: service
    project: {{ .Values.env }}-dna  
spec:
  destination:
    namespace: minio-operator
    server: {{ .Values.server | squote }}
  source:
    path: deployment/kubernetes/helm/charts/minio/operator
    repoURL: {{ .Values.repoURL | squote }}
    targetRevision: {{ .Values.branch }}
    helm:
      releaseName: minio-operator
      valueFiles:
        - values-dhc.yaml
  project: {{ .Values.env }}-dna
{{- if .Values.enableSync }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
{{- end }}
{{- end -}}