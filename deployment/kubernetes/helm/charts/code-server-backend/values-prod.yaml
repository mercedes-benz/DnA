replicaCount: 2
namespace: prod-dna-cs-workspaces
image:
  repository: registry-emea.app.corpintra.net/dnaplatform/code-server-be
  pullPolicy: Always
  tag: 1.8.1
envs: {}
imagePullSecrets: []
nameOverride: ''
fullnameOverride: cs-be
serviceAccount:
  create: true
  annotations: {}
  name: ''
podAnnotations:
  vault.hashicorp.com/agent-inject: 'true'
  vault.hashicorp.com/role: dna_aws_prod_k8_role
  vault.hashicorp.com/agent-pre-populate-only: 'true'
  vault.hashicorp.com/agent-inject-secret-truststore.jks: dna_aws_kv/prod/kubernetesSecret/kafka
  vault.hashicorp.com/agent-inject-template-truststore.jks: |
    {{- with secret "dna_aws_kv/prod/kubernetesSecret/kafka" -}}
    {{ base64Decode  .Data.data.TRUSTSTORE }}
    {{- end }}
  vault.hashicorp.com/agent-inject-secret-keystore.p12: dna_aws_kv/prod/kubernetesSecret/kafka
  vault.hashicorp.com/agent-inject-template-keystore.p12: |
    {{- with secret "dna_aws_kv/prod/kubernetesSecret/kafka" -}}
    {{ base64Decode  .Data.data.KEYSTORE }}
    {{- end }}      
  vault.hashicorp.com/agent-inject-secret-envvar: dna_aws_kv/prod/kubernetesSecret/codeServerService
  vault.hashicorp.com/agent-inject-template-envvar: |
    {{- with secret "dna_aws_kv/prod/kubernetesSecret/codeServerService" -}}
      {{- range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
      {{- end }}
    {{- end }}
    {{- with secret "dna_aws_kv/prod/kubernetesSecret/kafka" -}}
      {{- range $k, $v := .Data.data }}
      {{- if or (eq $k "KEYSTORE_PASSWORD") (eq $k "TRUSTSTORE_PASSWORD") (eq $k "KEYSTORE_PATH") (eq $k "TRUSTSTORE_PATH") }}
          export {{ $k }}="{{ $v }}"
      {{- end }}        
      {{- end }}      
    {{- end }}      
podSecurityContext:
  runAsUser: 1000
securityContext: {}
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: false
  className: prod-ingress-intranet
  annotations:
    traefik.frontend.rule.type: PathPrefix
    kubernetes.io/ingress.class: prod-ingress-intranet
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: mercedes-benz-acme
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect@kubernetescrd
  hosts:
    - host: api.code-spaces.dna.app.corpintra.net
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - api.code-spaces.dna.app.corpintra.net
      secretName: cs-tls-secret
resources:
  requests:
    memory: 765Mi
    cpu: 1m
  limits:
    memory: 765Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetMemoryUtilizationPercentage: 70
nodeSelector: {}
tolerations: []
affinity: {}
vaultInjector:
  enable: true
  jarName: code-server-lib*.jar
podDisruptionBudget:
  enabled: true
  minAvailable: 50%
