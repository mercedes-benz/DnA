namespace: prod-dna-dashboard
replicas: 2
image:
  repository: registry-emea.app.corpintra.net/dnaplatform/dashboard-backend
  tag: 3.1.9
imagePullPolicy: Always
imagePullSecret:
  name: imagepullsecret
dbUrl: <path:dna_aws_kv/data/prod/kubernetesSecret/reportService#API_DB_URL>
secret:
  name: dashboard-secrets
  appUserName: null
  appPassword: null
  jwtKey: null
appUrl: null
enableAuth: true
loggingPath: /tmp/dashboard/log
loggingEnvironment: prod
flywayBaseline: 'true'
flywayBaselineOnMigrate: 'true'
flywayBaselineVersion: '0'
flywaySchema: public
containerPort: 7173
corsOrigibUrl: https://*.app.corpintra.net
naasBroker: null
ingress:
  enabled: false
  host: report.dna.app.corpintra.net
  annotations:
    traefik.frontend.rule.type: PathPrefix
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: mercedes-benz-acme
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect@kubernetescrd
resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 1000Mi
    cpu: 500m
probes:
  initialDelaySeconds: 120
  timeoutSeconds: 10
  periodSeconds: 10
  failureThreshold: 3
  livenessProbe:
    path: /actuator/health/liveness
    port: api
  readinessProbe:
    path: /actuator/health/readiness
    port: api
vaultInjector:
  enable: true
  annotations:
    vault.hashicorp.com/agent-inject: 'true'
    vault.hashicorp.com/role: 'dna_aws_prod_k8_role'
    vault.hashicorp.com/tls-skip-verify: 'true'
    vault.hashicorp.com/agent-pre-populate-only: 'true'
    vault.hashicorp.com/agent-inject-secret-truststore.jks: dna_aws_kv/prod/kubernetesSecret/kafka
    vault.hashicorp.com/agent-inject-template-truststore.jks: |
      {{- with secret "dna_aws_kv/prod/kubernetesSecret/kafka" -}}
      {{ base64Decode  .Data.data.TRUSTSTORE }}
      {{- end }}
    vault.hashicorp.com/agent-inject-secret-keystore.p12: dna_aws_kv/prod/kubernetesSecret/kafka
    vault.hashicorp.com/agent-inject-template-keystore.p12: |
      {{- with secret "dna_aws_kv/prod/kubernetesSecret/kafka" -}}
      {{ base64Decode  .Data.data.KEYSTORE }}
      {{- end }}      
    vault.hashicorp.com/agent-inject-secret-envvar: dna_aws_kv/prod/kubernetesSecret/reportService
    vault.hashicorp.com/agent-inject-template-envvar: |
      {{- with secret "dna_aws_kv/prod/kubernetesSecret/reportService" -}}
        {{- range $k, $v := .Data.data }}
            export {{ $k }}="{{ $v }}"
        {{- end }}
      {{- end }}
      {{- with secret "dna_aws_kv/prod/kubernetesSecret/kafka" -}}
        {{- range $k, $v := .Data.data }}
        {{- if or (eq $k "KEYSTORE_PASSWORD") (eq $k "TRUSTSTORE_PASSWORD") (eq $k "KEYSTORE_PATH") (eq $k "TRUSTSTORE_PATH") }}
            export {{ $k }}="{{ $v }}"
        {{- end }}        
        {{- end }}      
      {{- end }} 
  saName: default
  jarName: dashboard*.jar
podDisruptionBudget:
  enabled: true
  minAvailable: 50%
