schedule: <path:kv/data/dna/kubernetesSecret/vaultUnseal#schedule>
restartPolicy: OnFailure
successfulJobsHistoryLimit: 1
namespace: vault
image:
  name: registry-emea.app.corpintra.net/dnaplatform/vault/vault-unseal
  tag: 1.0.0
  pullPolicy: IfNotPresent
envs:
  - name: VAULT_ADDR
    value: <path:kv/data/dna/kubernetesSecret/vaultUnseal#address>
  - name: VAULT_TOKEN
    value: <path:kv/data/dna/kubernetesSecret/vaultBackup#token>
  - name: UNSEAL_KEYS
    value: <path:kv/data/dna/kubernetesSecret/vaultUnseal#unsealKey1>
