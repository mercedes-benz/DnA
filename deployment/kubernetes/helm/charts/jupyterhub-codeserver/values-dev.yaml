    NO_PROXY : 53.0.0.0/8,10.0.0.0/8,192.168.0.0/16,corpshared.net,corpintra.net,cluster.local,git.daimler.com,login.daimler.com,sso.daimler.com,matter.i.mercedes-benz.com,git.i.mercedes-benz.com,artifacts.i.mercedes-benz.com,localhost,127.0.0.1
    no_proxy : 53.0.0.0/8,10.0.0.0/8,192.168.0.0/16,corpshared.net,corpintra.net,cluster.local,git.daimler.com,login.daimler.com,sso.daimler.com,matter.i.mercedes-benz.com,git.i.mercedes-benz.com,artifacts.i.mercedes-benz.com,localhost,127.0.0.1
    ENTRYPOINTD : /home/coder/entrypoint.d    
    CS_MINIO_ENDPOINT: <path:kv/data/dna/kubernetesSecret/jupyterhub-codeserver#minio_endpoint> 
    CS_MINIO_KEY: <path:kv/data/dna/kubernetesSecret/jupyterhub-codeserver#minio_key>
    CS_MINIO_SECRET: <path:kv/data/dna/kubernetesSecret/jupyterhub-codeserver#minio_secret>                   
