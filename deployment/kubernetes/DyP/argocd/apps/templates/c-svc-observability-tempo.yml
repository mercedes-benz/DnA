{{- if ne .Values.env "test" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: tempo
  namespace: {{ .Values.namespace }}
  labels:
    name: service
    project: c-svc
spec:
  destination:
    namespace: observability
    server: {{ .Values.server | squote }}
  source:
    path: deployment/kubernetes/DyP/observability/tempo-distributed
    repoURL: {{ .Values.repoURL | squote }}
    targetRevision: {{ .Values.branch }}
    helm:
      releaseName: tempo
      skipCrds: false
      valueFiles:
        - values-{{ .Values.env }}.yaml         
  project: c-svc
{{- if .Values.enableSync }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - PruneLast=true
      - Replace=true
{{- end }}

{{- end -}}