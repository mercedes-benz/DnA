fullnameOverride: mimir

image:
  repository: registry-emea.app.corpintra.net/dockerhub/grafana/mimir

mimir:
    structuredConfig:
      # Increase ingestion rate limits
      limits:
        # Global ingestion rate limit (items/second) - increased from 10000
        ingestion_rate: 50000
        # Global ingestion burst size - increased from 200000  
        ingestion_burst_size: 500000
        # Per-tenant max series limit
        max_global_series_per_user: 1500000
        # Per-tenant max samples per query
        max_fetched_series_per_query: 100000

      # alertmanager_storage:
      #   s3:
      #     bucket_name: my-ruler-bucket
      #     endpoint: "loki-minio.observability:9000"
      #     access_key_id: "admin" # This is a secret injected via an environment variable
      #     secret_access_key: "jTPPj-13jebS5Ulo" # This is a secret injected via an environment variable
      #     http:
      #       insecure_skip_verify: true
      blocks_storage:
        backend: s3
        s3:
          bucket_name: mimir-tsdb
          endpoint: "loki-minio.observability:9000"
          access_key_id: "admin" # This is a secret injected via an environment variable
          secret_access_key: "jTPPj-13jebS5Ulo" # This is a secret injected via an environment variable
          http:
            insecure_skip_verify: true
          insecure: true            
      ruler_storage:
        s3:
          bucket_name: mimir-ruler
          endpoint: "loki-minio.observability:9000"
          access_key_id: "admin" # This is a secret injected via an environment variable
          secret_access_key: "jTPPj-13jebS5Ulo" # This is a secret injected via an environment variable
          http:
            insecure_skip_verify: true   
          insecure: true           
      memberlist:
        join_members: 
          - mimir-gossip-ring.mimir-test.svc.cluster.local:7946          

nginx:
  image:
    # -- The Docker registry for nginx image
    registry: registry-emea.app.corpintra.net/dockerhub
rollout_operator:
    image:
    # -- The Docker registry for nginx image
    registry: registry-emea.app.corpintra.net/dockerhub
minio:
  enabled: false