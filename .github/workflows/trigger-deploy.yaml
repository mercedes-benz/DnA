
name: 3. Trigger Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target build environment"
        type: environment
        required: true
        default: 'Development'      
      service:
        description: "Service"
        type: choice
        default: dna-frontend
        required: true  
        options: 
          - airflow-backend
          - authenticator-service
          - chronos-mfe
          - chronos-be
          - code-server
          - code-space-mfe
          - dashboard-backend
          - data-product-backend
          - data-product-mfe
          - dataentry-mfe          
          - datalake-mfe
          - dna-backend
          - dna-frontend
          - dss-be
          - dss-mfe
          - fabric-backend
          - fabric-mfe
          - malware-scanner
          - matomo-backend
          - matomo-mfe
          - naas
          - power-platform-be
          - power-platform-mfe
          - storage-be
          - storage-mfe
          - trino-backend 

  pull_request:
    types:
      - closed
    branches:
      - 'dev'
      - 'staging'
      - 'main'
    paths:
      - 'packages/**'   
      - 'deployment/dockerfiles/**'   

jobs: 
          
  select-service:
    name: 'Detect changes in the service files'
    runs-on: [os-medium-amd64-linux]
    outputs:
      code-server: ${{ steps.filter.outputs.code-server }}    
      chronos-mfe: ${{ steps.filter.outputs.chronos-mfe }}
      chronos-be: ${{ steps.filter.outputs.chronos-be }}
      code-space-mfe: ${{ steps.filter.outputs.code-space-mfe }}
      storage-mfe: ${{ steps.filter.outputs.storage-mfe }}
      storage-be: ${{ steps.filter.outputs.storage-be }}
      dss-mfe: ${{ steps.filter.outputs.dss-mfe }}
      dss-be: ${{ steps.filter.outputs.dss-be }} 
      data-product-backend: ${{ steps.filter.outputs.data-product-backend }}
      authenticator-service: ${{ steps.filter.outputs.authenticator-service }}
      airflow-backend: ${{ steps.filter.outputs.airflow-backend }}
      trino-backend: ${{ steps.filter.outputs.trino-backend }}
      dna-backend: ${{ steps.filter.outputs.dna-backend }}
      dna-frontend: ${{ steps.filter.outputs.dna-frontend }}
      dataentry-mfe: ${{ steps.filter.outputs.dataentry-mfe }}
      dashboard-backend: ${{ steps.filter.outputs.dashboard-backend }} 
      data-product-mfe: ${{ steps.filter.outputs.data-product-mfe }}
      malware-scanner: ${{ steps.filter.outputs.malware-scanner }} 
      naas: ${{ steps.filter.outputs.naas }}
      datalake-mfe: ${{ steps.filter.outputs.datalake-mfe }} 
      matomo-mfe: ${{ steps.filter.outputs.matomo-mfe }}
      matomo-backend: ${{ steps.filter.outputs.matomo-backend }}
      fabric-backend: ${{ steps.filter.outputs.fabric-backend }}
      fabric-mfe: ${{ steps.filter.outputs.fabric-mfe }}
      power-platform-mfe: ${{ steps.filter.outputs.power-platform-mfe }}
      power-platform-be: ${{ steps.filter.outputs.power-platform-be }}

    permissions:
      pull-requests: read    
      contents: read
      packages: write   
      actions: write   
      checks: write            
    steps:

      # For pull requests it's not necessary to checkout the code
      - name: checkout 
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3.0.2
        if: ${{ github.event_name != 'workflow_dispatch' }}
        id: filter
        with:
          filters: |
            code-server: 
              - 'packages/code-server/**'
              - 'deployment/dockerfiles/codeServer/cs-backend.Dockerfile'
            chronos-mfe: 
              - 'packages/chronos-mfe/**'
              - 'deployment/dockerfiles/chronosService/chronos-mfe.Dockerfile'
            chronos-be:
              - 'packages/chronos/**'
              - 'deployment/dockerfiles/chronosService/chronos-be.Dockerfile'  
            code-space-mfe: 
              - 'packages/code-space-mfe/**'
              - 'deployment/dockerfiles/codeServer/code-space-mfe.Dockerfile'
            storage-mfe:
              - 'packages/storage-mfe/**'
              - 'deployment/dockerfiles/storageService/storage-mfe.Dockerfile' 
            storage-be:
              - 'packages/storage-backend/**'
              - 'deployment/dockerfiles/storageService/storage-be.Dockerfile' 
            dss-mfe:
              - 'packages/dss-mfe/**'
              - 'deployment/dockerfiles/dss/dss-mfe.Dockerfile'
            dss-be:
              - 'packages/dataiku-backend/**'
              - 'deployment/dockerfiles/dss/dss-be.Dockerfile'  
            data-product-backend:
              - 'packages/data-product-backend/**'
              - 'deployment/dockerfiles/dataProduct/dataProduct-be.Dockerfile'
            authenticator-service:
              - 'packages/authenticator-service/**'
              - 'deployment/dockerfiles/authenticator-service/Dockerfile'
            airflow-backend:
              - 'packages/airflow-backend/**'
              - 'deployment/dockerfiles/airflow/airflow-backend.Dockerfile'
            trino-backend:
              - 'packages/trino-backend/**'
              - 'deployment/dockerfiles/trinoBackend/trinoBackend.Dockerfile'
            dna-backend:
              - 'packages/backend/**'
              - 'deployment/dockerfiles/app/result-backend.Dockerfile'
            dna-frontend:
              - 'packages/frontend/**'
              - 'deployment/dockerfiles/app/result-frontend.Dockerfile'  
            dataentry-mfe:
              - 'packages/dataentry-mfe/**'
              - 'deployment/dockerfiles/dataentry/dataentry-mfe.Dockerfile'
            dashboard-backend:
              - 'packages/dashboard-backend/**'
              - 'deployment/dockerfiles/dashboard/dashboard-backend.Dockerfile' 
            data-product-mfe:
              - 'packages/data-product-mfe/**'
              - 'deployment/dockerfiles/dataProduct/dataProduct-mfe.Dockerfile'
            malware-scanner:
              - 'packages/malware-scanner/**'
              - 'deployment/dockerfiles/clamav/clamav-service.Dockerfile'
            naas:
              - 'packages/naas/**'
              - 'deployment/dockerfiles/naas/naas-backend.Dockerfile'
            datalake-mfe:
              - 'packages/datalake-mfe/**'
              - 'deployment/dockerfiles/datalakeService/datalake-mfe.Dockerfile'
            matomo-mfe:
              - 'packages/matomo-mfe/**'
              - 'deployment/dockerfiles/matomo/matomo-mfe.Dockerfile'
            matomo-backend:
              - 'packages/matomo-backend/**'
              - 'deployment/dockerfiles/matomo/matomo-be.Dockerfile'
            fabric-backend:
              - 'packages/fabric-backend/**'
              - 'deployment/dockerfiles/fabric/fabric-be.Dockerfile'
            fabric-mfe:
              - 'packages/fabric-mfe/**'
              - 'deployment/dockerfiles/fabric/fabric-mfe.Dockerfile' 
            power-platform-mfe:
              - 'packages/power-platform-mfe/**'
              - 'deployment/dockerfiles/power-platform/power-platform-mfe.Dockerfile'
            power-platform-be:
              - 'packages/powerplatform-backend/**'
              - 'deployment/dockerfiles/power-platform/power-platform-be.Dockerfile'                                                  
                

  code-server:
        name: Code Server Backend
        needs: select-service
        if: ${{ needs.select-service.outputs.code-server == 'true' ||  github.event.inputs.service == 'code-server' }}
