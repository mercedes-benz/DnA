swagger: "2.0"
info:
  version: "1.0.0"
  title: "Code-server Workspace Service"
host: "localhost:7979"
basePath: "/api/1.0"
consumes:
  - "application/json"
produces:
  - "application/json"
tags:
  - name: "code-server-admin"
    description: "This service is used to maintain code-server workspaces information."

schemes:
  - "https"

paths:

  # Fetch all valid userinfo or by intent
  #
  #  supported http methods GET, POST
  #
  # path example ../workspaces


  # /workspaces/{id}/config/accept:        
  #   post:
  #     tags:
  #       - "code-server-admin"
  #     summary: "Accepting the changes to be added in access management , marking status as Accepted if success"
  #     description: "Accepting the changes to be added in access management system"
  #     operationId: "acceptSecurityConfig"
  #     parameters:
  #       - name: "id"
  #         in: "path"
  #         description: "Workspace ID to be fetched"
  #         required: true
  #         type: "string"
  #     responses:
  #       201:
  #         description: "Returns message of success or failure"
  #         schema:
  #           $ref: "#/definitions/GenericMessage"
  #       204:
  #         description: "Fetch complete, no content found."
  #       400:
  #         description: "Bad request."
  #       401:
  #         description: "Request does not have sufficient credentials."
  #       403:
  #         description: "Request is not authorized."
  #       405:
  #         description: "Method not allowed"
  #       500:
  #         description: "Internal error"
          
  /workspaces/{id}/config/publish:        
    post:
      tags:
        - "code-server-admin"
      summary: "Marking status after Publishing the changes added in access management system"
      description: "Marking status after Publishing the changes added in access management system"
      operationId: "publishSecurityConfig"
      parameters:
        - name: "id"
          in: "path"
          description: "Workspace ID to be fetched"
          required: true
          type: "string"
        - name: env
          in: query
          description: environment variable to select the target environment
          required: true
          type: string
          enum:
          - int
          - prod
      responses:
        201:
          description: "Returns message of success or failure"
          schema:
            $ref: "#/definitions/GenericMessage"
        204:
          description: "Fetch complete, no content found."
        400:
          description: "Bad request."
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"

  /workspaces/configs:
    get:
      tags:
        - "code-server-admin"
      summary: "Get all workspace security configurations which are in requested and accepted state, waiting for processing."
      description: "Get all workspace security configurations which are in requested and accepted state, waiting for processing"
      operationId: "getWorkspaceConfigs"
      parameters:
          - name: offset
            in: query
            description: page number from which listing of SecurityConfigs should start. Offset. Example 2
            required: false
            type: integer
          - name: limit
            in: query
            description: page size to limit the number of SecurityConfigs, Example 15
            required: false
            type: integer
          - name: projectName
            in: query
            description: project name to get SecurityConfig.
            required: false
            type: string
      responses:
        201:
          description: "Returns message of success or failure"
          schema:
            $ref: "#/definitions/CodespaceSecurityConfigCollectionVO"
        204:
          description: "Fetch complete, no content found."
        400:
          description: "Bad request."
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"

  /workspaces/resourceexemptions:
    get:
      tags:
        - "code-server-admin"
      summary: "Get all codespace projects with their resource cap exemption state."
      description: "Get all codespace projects along with the environment specific resource cap exemption flags. Restricted to codespace admins."
      operationId: "getResourceCapExemptions"
      parameters:
          - name: offset
            in: query
            description: page number from which listing of projects should start. Offset. Example 2
            required: false
            type: integer
          - name: limit
            in: query
            description: page size to limit the number of projects, Example 15
            required: false
            type: integer
          - name: projectName
            in: query
            description: project name to filter the listing.
            required: false
            type: string
      responses:
        200:
          description: "Returns the projects with their exemption state"
          schema:
            $ref: "#/definitions/CodespaceResourceExemptionCollectionVO"
        204:
          description: "Fetch complete, no content found."
        400:
          description: "Bad request."
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"

  /workspaces/{projectName}/resourceexemptions:
    put:
      tags:
        - "code-server-admin"
      summary: "Update the resource cap exemption of a project for an environment."
      description: "Marks or unmarks a codespace project as exempt from the ArgoCD resource caps for the given environment. Applies to every workspace of the project. Restricted to codespace admins."
      operationId: "updateResourceCapExemption"
      parameters:
        - name: "projectName"
          in: "path"
          description: "Name of the codespace project"
          required: true
          type: "string"
        - name: env
          in: query
          description: environment for which the exemption should be updated
          required: true
          type: string
          enum:
          - int
          - prod
        - name: exempt
          in: query
          description: true to exempt the project from the resource caps, false to apply the caps again
          required: true
          type: boolean
      responses:
        200:
          description: "Returns message of success or failure"
          schema:
            $ref: "#/definitions/GenericMessage"
        400:
          description: "Bad request."
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        404:
          description: "Project not found."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"  

definitions:

  CodespaceResourceExemptionVO:
    type: object
    properties:
      projectName:
        type: string
        description: "Name of the Project"
      projectOwner:
        $ref: "#/definitions/UserInfoVO"
      workspaceCount:
        type: integer
        description: "Number of non deleted workspaces belonging to the project"
      exemptInt:
        type: boolean
        description: "True when the project is exempt from the resource caps in staging"
      exemptProd:
        type: boolean
        description: "True when the project is exempt from the resource caps in production"

  CodespaceResourceExemptionCollectionVO:
    type: object
    properties:
     data:
        type: array
        items:
          $ref: "#/definitions/CodespaceResourceExemptionVO"
     totalCount:
        type: integer
        description: "Total number of Codespace projects"
  
  CodespaceSecurityConfigDetailsVO:
    type: object
    properties:
      id: 
        type: string
        description: "Unique technical ID of workspace"
      projectName:
        type: string
        description: "Name of the Project"
      projectOwner:
        $ref: "#/definitions/UserInfoVO"
      securityConfig:
        $ref: "#/definitions/CodespacePublishedSecurityConfigVO"

  CodespaceSecurityConfigCollectionVO: 
    type: object
    properties:
     data:
        type: array
        items:
          $ref: "#/definitions/CodespaceSecurityConfigDetailsVO"
     totalCount:
        type: integer
        description: "Total number of Codespace projects that requested for publishing security configurations"     

  CodespacePublishedSecurityConfigVO:
    type: object
    properties:
      staging:
        $ref: "#/definitions/CodespaceSecurityConfigDetailVO"
      production:
        $ref: "#/definitions/CodespaceSecurityConfigDetailVO"
    

