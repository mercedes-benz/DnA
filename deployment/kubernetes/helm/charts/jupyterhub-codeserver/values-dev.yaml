  networkTools:
    image:
      name: registry-emea.app.corpintra.net/publicquay/jupyterhub/k8s-network-tools
      tag: "3.2.1"
      pullPolicy:
      pullSecrets: []
    resources: {}
  cloudMetadata:
    # block set to true will append a privileged initContainer using the
    # iptables to block the sensitive metadata server at the provided ip.
    blockWithIptables: false
    ip: 169.254.169.254
  networkPolicy:
    enabled: true
    ingress: []
    egress: 
      - {}   
    egressAllowRules:
      cloudMetadataServer: false
      dnsPortsCloudMetadataServer: true
      dnsPortsKubeSystemNamespace: true
      dnsPortsPrivateIPs: true
      nonPrivateIPs: true
      privateIPs: false
    interNamespaceAccessLabels: ignore
    allowedIngressPorts: []
  events: true
  extraAnnotations: {}
  extraLabels:
    hub.jupyter.org/network-access-hub: "true"
  extraFiles:
    .bashrc:
      mountPath: /tmp/.bashrc
      mode: 0777
      stringData: |
          ## Cleanup
          export CS_MINIO_ENDPOINT=""
          export CS_MINIO_KEY=""
          export CS_MINIO_SECRET=""
          export PATH=$PATH:$HOME/bin:/home/coder/.local/bin
    init.sh:
      mountPath: /home/coder/entrypoint.d/init.sh
      mode: 0777
      stringData: |
          #!/bin/bash
          set -e

          if [ -d "/home/coder/app" ]; then
              echo "Directory is already present"
          else
              mkdir -p /home/coder/app
              echo "Cloning the workspace"
              git config --global credential.helper cache
              git config --global user.email "$SHORTID"
              git config --global user.name "$SHORTID"
              git clone https://$GITHUB_TOKEN@$GITHUBREPO_URL /home/coder/app 
              
              # Copy .bashrc
              cp /tmp/.bashrc /home/coder/
              chmod +x /home/coder/.bashrc

              # Install SDK and extensions
              TEMP_DIR="/tmp/.codespaces/DO_NOT_DELETE_MODIFY/"
              mkdir -pv $TEMP_DIR
              cp /home/coder/app/.codespaces/DO_NOT_DELETE_MODIFY/pkg-install.sh $TEMP_DIR
              cd $TEMP_DIR
              chmod +x pkg-install.sh
              ./pkg-install.sh

              # Copy extentions
              mc --insecure alias set myminio $CS_MINIO_ENDPOINT $CS_MINIO_KEY $CS_MINIO_SECRET
              mc --insecure cp --recursive myminio/code-server/tools/extension /home/coder/
              mc alias remove myminio

              #Install Default Plugins
              code-server --install-extension rangav.vscode-thunder-client
              code-server --install-extension PKief.material-icon-theme
              code-server --install-extension GitHub.vscode-pull-request-github
              code-server --install-extension /home/coder/extension/GitHub.copilot-*.vsix
              code-server --install-extension /home/coder/extension/mbos-studio-marketplace-*.vsix
              code-server --install-extension /home/coder/extension/pomdtr.secrets-0.2.2*.vsix

          fi        
