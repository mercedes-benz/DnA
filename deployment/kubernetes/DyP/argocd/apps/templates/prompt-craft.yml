apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: prompt-craft-int
  namespace: {{ .Values.namespace }}
  labels:
    name: service
spec:
  destination:
    namespace: tools
    server: {{ .Values.server | squote }}
  source:
    path: helm
    repoURL: https://git.i.mercedes-benz.com/DNA/prompt-craft.git
    targetRevision: {{ .Values.branch }}
    plugin:
      name: argocd-vault-plugin-helm
      env:
        - name: HELM_ARGS
          value: --namespace tools -f values-{{ .Values.env }}.yaml
  project: dna
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true