namespace: dataentry
configJs: |
  window["dataentry_INJECTED_ENVIRONMENT"]={
    ENABLE_dataentry_SERVICE=true,
    dataentry_MFE_APP_URL="",
    dataentry_API_BASEURL=""
  };
replicaCount: 2
image:
  repository: registry-emea.app.corpintra.net/dnaplatform/dataentry-mfe
  pullPolicy: IfNotPresent
  tag: 5e821211ddaf553edde5121e9b869d0782c157c6
imagePullSecrets:
  - name: imagepullsecret
nameOverride: ''
fullnameOverride: dataentry-mfe
podSecurityContext:
  runAsUser: 1001
containerPort: 8091
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: true
  annotations:
    traefik.frontend.rule.type: PathPrefix
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: daimler-acme
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect@kubernetescrd
  hosts:
    - host: dataentry.dna.app.corpintra.net
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - dataentry.dna.app.corpintra.net
      secretName: dataentry-tls-secret
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi
vaultInjector:
  enable: true
  annotations:
    vault.hashicorp.com/agent-inject: 'true'
    vault.hashicorp.com/role: dna
    vault.hashicorp.com/tls-skip-verify: 'true'
    vault.hashicorp.com/namespace: fmas/prod
    vault.hashicorp.com/agent-pre-populate-only: 'true'
    vault.hashicorp.com/agent-inject-secret-configjs: kv/dna/kubernetesSecret/dataentryMFE
    vault.hashicorp.com/agent-inject-file-configjs: config.js
    vault.hashicorp.com/agent-inject-template-configjs: |
      {{- with secret "kv/dna/kubernetesSecret/dataentryMFE" -}}
          window["dataentry_INJECTED_ENVIRONMENT"]={
          {{- range $k, $v := .Data.data }}
          {{- if or (eq $v "true") (eq $v "false") (regexMatch "^[0-9]+$" $v) }}
                  {{ $k }}:{{ $v }},
          {{ else }}
                  {{ $k }}:'{{ $v }}',
          {{- end }}
          {{- end }}
              };
      {{- end }}   
  saName: default
podDisruptionBudget:
  enabled: true
  minAvailable: 50%
