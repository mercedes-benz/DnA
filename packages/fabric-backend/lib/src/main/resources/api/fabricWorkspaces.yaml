swagger: "2.0"
info:
  version: "1.0.0"
  title: "Fabric workspaces management service"
host: "localhost:9292"
basePath: "/api/1.0"
consumes:
  - "application/json"
produces:
  - "application/json"
tags:
  - name: "solutions"
    description: "This service is used for fabric workspaces maintenance."

schemes:
  - "https"

paths:
  # path to create a new solution and fetch all valid solution or by intent
  #
  #  supprorted http methods GET, POST and DELETE
  #
  # path example ../fabric-workspaces
  /lov/fabric-workspaces:
    get:
      tags:
        - "lovs"
      summary: "List of values for available workspaces"
      description: "Get all workspaces. This endpoints will be used to get all valid available fabric workspace records."
      operationId: "getWorkspacesLov"
      parameters:            
        - name: offset
          in: query
          description: page number from which listing of workspaces should start. Offset. Example 2
          required: false
          type: integer
        - name: limit
          in: query
          description: page size to limit the number of workspaces, Example 15
          required: false
          type: integer
        - name: sortBy
          in: query
          description: Sort workspaces by a given variable like name, createdOn
          required: false
          type: string
          enum: [name, createdOn]
        - name: sortOrder
          in: query
          description: Sort solutions based on the given order, example asc,desc
          required: false
          type: string
          enum: [asc,desc]
      responses:
        201:
          description: "Returns message of success or failure"
          schema:
            $ref: "#/definitions/FabricWorkspacesCollectionVO"
        204:
          description: "Fetch complete, no content found."
        400:
          description: "Bad request."
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"
          
  /fabric-workspaces:
    get:
      tags:
        - "fabric-workspaces"
      summary: "Get all workspaces for the user."
      description: "Get all workspaces. This endpoints will be used to get all valid available fabric workspace records."
      operationId: "getAll"
      parameters:            
        - name: offset
          in: query
          description: page number from which listing of workspaces should start. Offset. Example 2
          required: false
          type: integer
        - name: limit
          in: query
          description: page size to limit the number of workspaces, Example 15
          required: false
          type: integer
        - name: sortBy
          in: query
          description: Sort workspaces by a given variable like name, createdOn
          required: false
          type: string
          enum: [name, createdOn]
        - name: sortOrder
          in: query
          description: Sort solutions based on the given order, example asc,desc
          required: false
          type: string
          enum: [asc,desc]
      responses:
        201:
          description: "Returns message of success or failure"
          schema:
            $ref: "#/definitions/FabricWorkspacesCollectionVO"
        204:
          description: "Fetch complete, no content found."
        400:
          description: "Bad request."
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"

    post:
      tags:
        - "fabric-workspaces"
      summary: "Adds a new fabric workspace."
      description: "Adds a new non existing workspace."
      operationId: "create"
      parameters:
        - name: "workspaceCreateVO"
          in: "body"
          description: "Request Body that contains data required for creating a new workspace"
          required: true
          schema:
            $ref: "#/definitions/FabricWorkspaceCreateRequestVO"    
      responses:
        201:
          description: "Returns message of succes or failure "
          schema:
            $ref: "#/definitions/FabricWorkspaceResponseVO"
        400:
          description: "Bad Request"
          schema:
            $ref: "#/definitions/GenericMessage"
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"

  # Fetch FabricWorkspace by intent
  #
  #  Supported http methods GET
  #
  # path example ../fabric-workspaces
  /fabric-workspaces/{id}:
   get:
      tags:
        - "fabric-workspaces"
      summary: "Get workspace for a given Id."
      description: "Get workspace for a given identifier. This endpoints will be used to get fabric workspace for the given identifier."
      operationId: "getById"
      parameters:
        - name: "id"
          in: "path"
          description: "Fabric Workspace ID to be fetched"
          required: true
          type: "string"
      responses:
        200:
          description: "Returns message of success or failure"
          schema:
            $ref: "#/definitions/FabricWorkspaceVO"
        204:
          description: "Fetch complete, no content found."
        400:
          description: "Bad request."
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"
   put:
      tags:
        - "fabric-workspaces"
      summary: "Update existing workspace."
      description: "Updates an existing workspace."
      operationId: "update"
      parameters:
        - name: "id"
          in: "path"
          description: "Fabric Workspace ID to be updated"
          required: true
          type: "string"
        - name: "workspaceUpdateRequestVO"
          in: "body"
          description: "Request Body that contains data required for updating an existing workspace"
          required: true
          schema:
            $ref: "#/definitions/FabricWorkspaceUpdateRequestVO"
      responses:
        200:
          description: "Updated successfully"
          schema:
            $ref: "#/definitions/FabricWorkspaceResponseVO"
        404:
          description: "No workspace found to update"
          schema:
            $ref: "#/definitions/GenericMessage"
        400:
          description: "Bad Request"
          schema:
            $ref: "#/definitions/GenericMessage"
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"
   delete:
      tags:
        - "fabric-workspaces"
      summary: "Delete workspace for a given Id."
      description: "Delete workspace for a given identifier."
      operationId: "delete"
      parameters:
        - name: "id"
          in: "path"
          description: "Workspace ID to be deleted"
          required: true
          type: "string"
      responses:
        201:
          description: "Returns message of success or failure"
          schema:
            $ref: "#/definitions/GenericMessage"
        204:
          description: "Fetch complete, no content found."
        400:
          description: "Bad request."
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"
  
  /fabric-workspaces/{id}/rolerequest:
    post:
        tags:
          - "fabric-workspaces"
        summary: "request a  fabric workspace role for a user."
        description: "request a  fabric workspace role for a user."
        operationId: "requestRole"
        parameters:
          - name: "id"
            in: "path"
            required: true
            type: "string"
          - name: "roleRequestVO"
            in: "body"
            description: "Request Body that contains data required for requesting a workspace role"
            required: true
            schema:
              $ref: "#/definitions/FabricWorkspaceRoleRequestVO"    
        responses:
          201:
            description: "Returns message of succes or failure "
            schema:
              $ref: "#/definitions/GenericMessage"
          400:
            description: "Bad Request"
            schema:
              $ref: "#/definitions/GenericMessage"
          401:
            description: "Request does not have sufficient credentials."
          403:
            description: "Request is not authorized."
          405:
            description: "Method not allowed"
          500:
            description: "Internal error"

  /fabric-workspaces/createrole:
    post:
        tags:
          - "fabric-workspaces"
        summary: "create new role from dna application."
        description: "create new role from dna application."
        operationId: "createRole"
        parameters:
          - name: "roleRequestVO"
            in: "body"
            description: "Request Body that contains data required for requesting a workspace role"
            required: true
            schema:
              $ref: "#/definitions/createRoleRequestVO"    
        responses:
          201:
            description: "Returns message of succes or failure "
            schema:
              $ref: "#/definitions/GenericMessage"
          400:
            description: "Bad Request"
            schema:
              $ref: "#/definitions/GenericMessage"
          401:
            description: "Request does not have sufficient credentials."
          403:
            description: "Request is not authorized."
          405:
            description: "Method not allowed"
          500:
            description: "Internal error"

  /fabric-workspaces/{id}/dnaroles:
    get:
        tags:
          - "fabric-workspaces"
        summary: "get all dna roles for a user."
        description: "get all dna roles for a user"
        operationId: "getAllUserDnaRoles"
        parameters:
          - name: "id"
            in: "path"
            required: true
            type: "string"  
        responses:
          201:
            description: "Returns message of succes or failure "
            schema:
              $ref: "#/definitions/DnaRoleCollectionVO"
          400:
            description: "Bad Request"
          401:
            description: "Request does not have sufficient credentials."
          403:
            description: "Request is not authorized."
          405:
            description: "Method not allowed"
          500:
            description: "Internal error"

  /fabric-workspaces/{roleId}/details:
    get:
        tags:
          - "fabric-workspaces"
        summary: "get the role details."
        description: "get the role details."
        operationId: "getRoleDetails"
        parameters:
          - name: "roleId"
            in: "path"
            required: true
            type: "string"  
        responses:
          201:
            description: "Returns message of succes or failure "
            schema:
              $ref: "#/definitions/AuthoriserRoleDetailsResponseVO"
          400:
            description: "Bad Request"
          401:
            description: "Request does not have sufficient credentials."
          403:
            description: "Request is not authorized."
          405:
            description: "Method not allowed"
          500:
            description: "Internal error"

  /fabric-workspaces/{roleName}/entraGroupMembers:
    get:
        tags:
          - "fabric-workspaces"
        summary: "get the EntraID group member details."
        description: "get the group member details."
        operationId: "getGroupMemberDetails"
        parameters:
          - name: "roleName"
            in: "path"
            required: true
            type: "string"  
        responses:
          200:
            description: "Returns message of succes or failure "
            schema:
              $ref: "#/definitions/EntraGroupResponseVO"  
          400:
            description: "Bad Request"
          401:
            description: "Request does not have sufficient credentials."
          403:
            description: "Request is not authorized."
          405:
            description: "Method not allowed"
          500:
            description: "Internal error"

  /fabric-workspaces/{id}/transferOwnership:
    patch:
        tags:
          - "fabric-workspaces"
        summary: "Transfer ownership of a workspace"
        description: "Changes the owner of the given workspace to another user."
        operationId: "transferWorkspaceOwnership"
        parameters:
          - name: "id"
            in: "path"
            required: true
            description: "The ID of the workspace"
            type: "string"
          - name: "userInfo"
            in: "body"
            required: true
            description: "The user info of the new owner"
            schema:
              $ref: "#/definitions/CreatedByVO"
        responses:
          200:
            description: "Ownership transferred successfully"
            schema:
              $ref: "#/definitions/GenericMessage"
          400:
            description: "Bad Request"
          401:
            description: "Request does not have sufficient credentials."
          403:
            description: "Request is not authorized."
          405:
            description: "Method not allowed"
          500:
            description: "Internal error"

  /fabric-workspaces/lakehouses/tables:
    get:
      tags:
        - "fabric-workspaces"
      summary: "Get tables for a given lakehouse"
      description: "Get all tables for a given Fabric lakehouse under a workspace."
      operationId: "getLakehouseTables"
      parameters:
        - name: "workspaceId"
          in: "query"
          required: true
          type: "string"
        - name: "lakehouseId"
          in: "query"
          required: true
          type: "string"
      responses:
        200:
          description: "List of tables in the lakehouse"
          schema:
            $ref: "#/definitions/LakehouseTableCollectionResponseVO"
        204:
          description: "Fetch complete, but no tables found."
        400:
          description: "Bad request."
        401:
          description: "Request does not have valid credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed."
        500:
          description: "Internal server error."

  /fabric-workspaces/lakehouses/table/schema:
    get:
      tags:
        - "fabric-workspaces"
      summary: "Get table schema"
      description: "Get column schema for a table inside a Fabric lakehouse."
      operationId: "getTableSchema"
      parameters:
        - name: "workspaceId"
          in: "query"
          required: true
          type: "string"
        - name: "lakehouseId"
          in: "query"
          required: true
          type: "string"
        - name: "tableName"
          in: "query"
          required: true
          type: "string"
        - name: "schemaName"
          in: "query"
          required: false
          type: "string"
      responses:
        200:
          description: "Successfully fetched table schema."
          schema:
            $ref: "#/definitions/LakehouseColumnCollectionResponseVO"
        204:
          description: "Fetch complete, but no schema found."
        400:
          description: "Bad request."
        401:
          description: "Request does not have valid credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed."
        500:
          description: "Internal server error."

  /fabric-workspaces/searchADAProjects:
    get:
      tags:
        - "fabric-workspaces"
      summary: "Search ADA Projects"
      description: "Search ADA Projects by project name,"
      operationId: "searchADAProjects"
      produces:
        - "application/json"
      parameters:
        - name: projectName
          in: query
          description: "Filter by project name"
          required: false
          type: string
      responses:
        200:
          description: "List of ADA Projects matching search criteria"
          schema:
            $ref: "#/definitions/ADAProjectDetailsCollectionVO"
        204:
          description: "No ADA Projects found matching search criteria"
        400:
          description: "Bad request"
        500:
          description: "Internal server error"

  /fabric-workspaces/{id}/takeOwnership:
    patch:
      tags:
        - "fabric-workspaces"
      summary: "Take ownership of a workspace"
      description: "Allows an Admin to take ownership of a workspace. The current owner will lose ownership and all related privileges."
      operationId: "takeWorkspaceOwnership"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "The ID of the workspace"
          type: "string"
      responses:
        200:
          description: "Ownership taken successfully"
          schema:
            $ref: "#/definitions/GenericMessage"
        400:
          description: "Bad Request"
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        405:
          description: "Method not allowed"
        500:
          description: "Internal error"

  /fabric-workspaces/keyVault:
    post:
      tags:
        - "fabric-workspaces"
      summary: "Create Azure Key Vault with Data Governance"
      description: "Creates a new Azure Key Vault with data governance fields and assigns Key Vault Crypto Officer role to the creator."
      operationId: "createKeyVault"
      parameters:
        - name: "keyVaultRequest"
          in: "body"
          description: "Request Body that contains data required for creating a new Key Vault including data governance fields"
          required: true
          schema:
            $ref: "#/definitions/KeyVaultCreateRequestVO"
      responses:
        201:
          description: "Returns Key Vault data with success or failure messages"
          schema:
            $ref: "#/definitions/KeyVaultResponseVO"
        400:
          description: "Bad Request - validation failed"
          schema:
            $ref: "#/definitions/KeyVaultResponseVO"
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        409:
          description: "Key Vault name already exists"
          schema:
            $ref: "#/definitions/KeyVaultResponseVO"
        500:
          description: "Internal error"
          schema:
            $ref: "#/definitions/KeyVaultResponseVO"
    get:
      tags:
        - "fabric-workspaces"
      summary: "Get all Azure Key Vaults created by the authenticated user"
      description: "Retrieves all Azure Key Vaults created by the current user from the database with pagination support."
      operationId: "getAllKeyVaults"
      parameters:
        - name: offset
          in: query
          description: "Page number from which listing should start. Offset. Example: 0"
          required: false
          type: integer
        - name: limit
          in: query
          description: "Page size to limit the number of Key Vaults. Example: 15"
          required: false
          type: integer
      responses:
        200:
          description: "Successfully retrieved Key Vaults"
          schema:
            $ref: "#/definitions/KeyVaultCollectionVO"
        204:
          description: "No Key Vaults found"
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        500:
          description: "Internal error"
          schema:
            $ref: "#/definitions/KeyVaultCollectionVO"

  /fabric-workspaces/keyVault/{id}:
    put:
      tags:
        - "fabric-workspaces"
      summary: "Update Azure Key Vault Data Governance Fields"
      description: "Updates an Azure Key Vault's data governance fields (description, division, department, etc.). Note: Key Vault name cannot be changed as Azure does not support renaming Key Vaults."
      operationId: "updateKeyVault"
      parameters:
        - name: "id"
          in: "path"
          description: "Key Vault ID to be updated"
          required: true
          type: "string"
        - name: "keyVaultRequest"
          in: "body"
          description: "Request Body that contains data required for updating Key Vault data governance fields. Name must remain the same."
          required: true
          schema:
            $ref: "#/definitions/KeyVaultCreateRequestVO"
      responses:
        200:
          description: "Returns Key Vault data with success or failure messages"
          schema:
            $ref: "#/definitions/KeyVaultResponseVO"
        400:
          description: "Bad Request - validation failed or name change attempted"
          schema:
            $ref: "#/definitions/KeyVaultResponseVO"
        401:
          description: "Request does not have sufficient credentials."
        403:
          description: "Request is not authorized."
        404:
          description: "Key Vault not found."
        500:
          description: "Internal error"
          schema:
            $ref: "#/definitions/KeyVaultResponseVO"

definitions:
  CapacityVO:
    type: object
    properties:
      id:
        type: string
        description: "Identifier for the capacity"
      name:
        type: string
        description: "Name of the Capacity"
      sku:
        type: string
      region:
        type: string
      state:
        type: string
  
  CapacityCollectionVO:
    type: object
    properties:
      capacities: 
        description: "Array of capacities details"
        type: array
        items:
          $ref: "#/definitions/CapacityVO"
          
  FabricWorkspaceVO:
    type: object
    properties:
      id: 
        type: string
        description: "ID for the fabric workspace"
      name:
        type: string
        description: "Name of the fabric workspace"
        maxLength: 256
      typeOfProject:
        type: string
      #  enum: ["Playground","Proof of Concept","Production"]
      description:
        type: string
        maxLength: 4000
      divisionId:
        type: string
      division:
        type: string
      subDivisionId:
        type: string
      subDivision:
        type: string
      department:
        type: string
      tags:
        type: array
        items:
         type: string
      dataClassification:
        type: string
      #  enum: ["Confidential","Internal","Public","Secret"]
      archerId:
        type: string
      procedureId:
        type: string
      termsOfUse:
        type: boolean
      hasPii:
        type: boolean
      costCenter:
        type: string
      internalOrder:
        type: string
      status:
        $ref: "#/definitions/FabricWorkspaceStatusVO"
      relatedSolutions:
        type: array
        items:
         $ref: "#/definitions/ProjectReferenceDetailsVO"
      relatedReports:
        type: array
        items:
         $ref: "#/definitions/ProjectReferenceDetailsVO"
      capacity:
        $ref: "#/definitions/CapacityVO"
      createdBy:
        $ref: "#/definitions/CreatedByVO"
      createdOn:
        type: string
        format: date
      deletedOn:
        type: string
        format: date
      role:
        type: string
      lakehouses:
        type: array
        items:
          $ref: "#/definitions/FabricLakehouseVO"
      initiatedBy:
        type: string
        default: string
      # secondaryRoleApproverId: 
      #   type: string
      #   default: null
      # customEntitlementName: 
      #   type: string
      #   default: null
      customGroupName: 
        type: string
        default: null
      customGroupNameCollection:
        type: array
        items:
          type: object
          $ref: "#/definitions/CustomGroupNameCollectionVO" 
      appId:
        type: string
      leanIXDetails:
        $ref: "#/definitions/LeanIXDetailsVO"
      userRole:
          type: string
      projectId:
          type: string
      subscription:
          enum: ["PowerBI", "Fabric"]
      lastModifiedOn:
          type: string
          format: date
      cdcPublishedLakeHouseDetails:
        $ref: "#/definitions/CdcPublishedLakeHouseDetailsVO"
      ddxPublishedLakeHouseDetails:
        type: array
        items:
          $ref: "#/definitions/DdxPublishedLakeHouseDetailsVO"
        description: "List of DDX published lakehouse details with full product information"

  FabricWorkspaceStatusVO:
    type: object
    properties:
      state:
         type: string
      entitlements:
         type: array
         items:
          $ref: "#/definitions/EntitlementDetailsVO" 
      roles:
         type: array
         items:
          $ref: "#/definitions/RoleDetailsVO"
      microsoftGroups:
         type: array
         items:
          $ref: "#/definitions/GroupDetailsVO"
  
  EntitlementDetailsVO:
    type: object
    properties:
      entitlementId:
        type: string
      displayName:
        type: string
      state:
        type: string

  RoleDetailsVO:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      state:
        type: string
      link:
        type: string
      assignEntitlementsState:
        type: string
      roleOwner:
        type: string
      globalRoleAssigner:
        type: string
      roleApprover:
        type: string
      # secondaryRoleApprover: 
      #   type: string
      #   default: null
      entitlements:
        type: array
        items:
         $ref: "#/definitions/EntitlementDetailsVO"
          
  GroupDetailsVO:
    type: object
    properties:
      groupName:
       type: string
      groupId:
       type: string
      state:
       type: string
                    
  ProjectReferenceDetailsVO:
    type: object
    properties:
      id:
       type: string
      name:
       type: string
       
  FabricWorkspaceUpdateRequestVO:
    type: object
    properties:
      name:
        type: string
        description: "Name of the fabric workspace"
        maxLength: 256
      typeOfProject:
        type: string
      #  enum: ["Playground","Proof of Concept","Production"]
      description:
        type: string
        maxLength: 4000
      divisionId:
        type: string
      division:
        type: string
      subDivisionId:
        type: string
      subDivision:
        type: string
      department:
        type: string
      tags:
        type: array
        items:
         type: string
      dataClassification:
        type: string
      #  enum: ["Confidential","Internal","Public","Secret"]
      archerId:
        type: string
      procedureId:
        type: string
