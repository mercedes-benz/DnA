apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: storage-backend
  namespace: {{ .Values.namespace }}
  labels:
    name: backend 
    env: {{ .Values.env }}
    project: dna 
spec:
  destination:
    namespace: storage
    server: {{ .Values.server | squote }}
  source:
    path: deployment/kubernetes/helm/charts/storage-be
    repoURL: {{ .Values.repoURL | squote }}
    targetRevision: {{ .Values.branch }}
    helm:
      releaseName: dna-storage-be
      valueFiles:
        - values-{{ .Values.env }}.yaml
  project: dna
{{- if .Values.enableSync }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
{{- end }}
