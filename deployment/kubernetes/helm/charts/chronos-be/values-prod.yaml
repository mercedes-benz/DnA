replicaCount: 2
namespace: chronos
image:
  repository: registry-emea.app.corpintra.net/dnaplatform/chronos-be
  pullPolicy: IfNotPresent
  tag: 1.4.7
envs: {}
imagePullSecrets: []
nameOverride: ''
fullnameOverride: chronos-be
serviceAccount:
  create: true
  annotations: {}
  name: ''
podAnnotations:
  vault.hashicorp.com/agent-inject: 'true'
  vault.hashicorp.com/role: 'dna_prod_k8_role'
  vault.hashicorp.com/tls-skip-verify: 'true'
  vault.hashicorp.com/agent-pre-populate-only: 'true'
  vault.hashicorp.com/agent-inject-secret-truststore.jks: dna_kv/prod/kubernetesSecret/kafka
  vault.hashicorp.com/agent-inject-template-truststore.jks: |
    {{- with secret "dna_kv/prod/kubernetesSecret/kafka" -}}
    {{ base64Decode  .Data.data.TRUSTSTORE }}
    {{- end }}
  vault.hashicorp.com/agent-inject-secret-keystore.p12: dna_kv/prod/kubernetesSecret/kafka
  vault.hashicorp.com/agent-inject-template-keystore.p12: |
    {{- with secret "dna_kv/prod/kubernetesSecret/kafka" -}}
    {{ base64Decode  .Data.data.KEYSTORE }}
    {{- end }}      
  vault.hashicorp.com/agent-inject-secret-catruststore.jks: dna_kv/prod/kubernetesSecret/infra
  vault.hashicorp.com/agent-inject-template-catruststore.jks: |
    {{- with secret "dna_kv/prod/kubernetesSecret/infra" -}}
    {{ base64Decode  .Data.data.CA_TRUSTSTORE }}
    {{- end }}      
  vault.hashicorp.com/agent-inject-secret-envvar: dna_kv/prod/kubernetesSecret/chronosService
  vault.hashicorp.com/agent-inject-template-envvar: |
    {{- with secret "dna_kv/prod/kubernetesSecret/chronosService" -}}
      {{- range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
      {{- end }}
    {{- end }}
    {{- with secret "dna_kv/prod/kubernetesSecret/kafka" -}}
      {{- range $k, $v := .Data.data }}
      {{- if or (eq $k "KEYSTORE_PASSWORD") (eq $k "TRUSTSTORE_PASSWORD") (eq $k "KEYSTORE_PATH") (eq $k "TRUSTSTORE_PATH") }}
          export {{ $k }}="{{ $v }}"
      {{- end }}        
      {{- end }}      
    {{- end }}  
podSecurityContext:
  runAsUser: 1000
securityContext: {}
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: false
  annotations:
    traefik.frontend.rule.type: PathPrefix
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: daimler-acme
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect@kubernetescrd
  hosts:
    - host: chronos.dna.app.corpintra.net
      paths:
        - path: /api
          pathType: Prefix
        - path: /swagger-ui.html
          pathType: Prefix
        - path: /swagger-resources
          pathType: Prefix
        - path: /v2/api-docs
          pathType: Prefix
        - path: /webjars
          pathType: Prefix
  tls: null
resources: {}
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
nodeSelector: {}
tolerations: []
affinity: {}
vaultInjector:
  enable: true
  jarName: chronos-lib*.jar
podDisruptionBudget:
  enabled: true
  minAvailable: 50%
